<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GeneSling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: sticky resource header + tab rail over one working panel; raids take over the screen as a canvas overlay */
:root{
  --night:#17122e; --deep:#0e0a1f; --panel:#231b45; --panel2:#2d2457; --line:#4b3e87;
  --ink:#f6eedb; --muted:#b4a9d8; --gold:#ffcf4a; --gold-d:#b5861b; --mint:#5de8b0; --rose:#ff6688; --sky:#58c2ff;
  --display:'Pixelify Sans','Courier New',monospace; --body:'Alegreya Sans','Trebuchet MS',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px),radial-gradient(rgba(255,207,74,.06) 1px,transparent 1.2px);
  background-size:26px 26px,57px 57px;background-position:0 0,13px 9px}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0}
.app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
/* The resource header and the tab rail stay pinned together at the top of every hideout screen */
.topbar{position:sticky;top:0;z-index:10;background:var(--night);padding-top:env(safe-area-inset-top,0px);border-bottom:2px solid var(--line);margin-inline:-16px;padding-inline:16px}
header.top{padding-block:12px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:1.7rem;font-weight:700;color:var(--gold);text-shadow:2px 2px 0 var(--rose),4px 4px 0 var(--deep);letter-spacing:.04em}
.res{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.pill{font-family:var(--display);font-size:.92rem;background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{color:var(--gold);font-weight:600}
.pill small{color:var(--muted);font-family:var(--body);font-size:.78rem}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:8px 8px;padding-inline:2px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
/* Phones held sideways (the S23 is about 780 × 360): one compact pinned bar of brand, resources and tabs,
   so the screen below is for the game. Notch-side insets are respected. */
@media (orientation:landscape) and (max-height:500px){
  .app{padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px));padding-bottom:24px}
  .topbar{margin-inline:calc(-1 * max(12px,env(safe-area-inset-left,0px))) calc(-1 * max(12px,env(safe-area-inset-right,0px)));padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px))}
  header.top{flex-wrap:nowrap;padding-block:5px 4px;gap:10px}
  .brand{font-size:1.05rem;text-shadow:1px 1px 0 var(--rose),2px 2px 0 var(--deep);flex:none}
  .res{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:4px;padding:2px}
  .res::-webkit-scrollbar{display:none}
  .pill{font-size:.74rem;padding:1px 7px}.pill small{font-size:.66rem}
  nav.tabs{padding-block:4px 5px;gap:4px}
  .tab{padding:4px 10px;font-size:.82rem}
  main{padding-top:8px}
  html #modal .box{max-height:92vh;padding:12px}
}
.tab{font-family:var(--display);background:var(--panel);border:0;box-shadow:0 0 0 2px var(--line);padding:7px 14px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--gold);color:var(--deep);box-shadow:0 0 0 2px var(--gold-d)}
.tab:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
main{padding-top:12px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
/* Phones: one compact row of resources that scrolls sideways, so the pinned bar stays short */
@media (max-width:700px){header.top{flex-wrap:nowrap;gap:10px;padding-block:8px 6px}.brand{font-size:1.15rem;flex:none}.res{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:0;padding:2px}.res::-webkit-scrollbar{display:none}.pill{font-size:.82rem;padding:2px 8px}.tab{padding:6px 11px}}
.card{background:var(--panel);box-shadow:0 0 0 2px var(--line),5px 5px 0 0 var(--deep);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hint{color:var(--muted);font-size:.95rem;max-width:65ch}
.btn{font-family:var(--display);background:var(--panel2);border:0;box-shadow:0 0 0 2px var(--line),0 3px 0 2px var(--deep);padding:7px 12px;cursor:pointer;transition:transform .05s}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--gold);color:var(--deep);box-shadow:0 0 0 2px var(--gold-d),0 3px 0 2px var(--gold-d)}
.btn.danger{background:#5a1d33;box-shadow:0 0 0 2px var(--rose),0 3px 0 2px #2d0b18}
.btn.small{padding:4px 9px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-block;font-family:var(--display);font-size:.78rem;padding:1px 7px;background:var(--panel2);box-shadow:0 0 0 1.5px var(--line);white-space:nowrap}
.chip.type{background:var(--c);color:var(--deep);box-shadow:0 0 0 1.5px var(--deep)}
.chip.warn{background:#5c4410;color:var(--gold);box-shadow:0 0 0 1.5px var(--gold-d)}
.chip.good{background:#123d33;color:var(--mint);box-shadow:0 0 0 1.5px #1f7a62}
.chip.bad{background:#4a1528;color:var(--rose);box-shadow:0 0 0 1.5px var(--rose)}
.bar{height:8px;background:var(--deep);box-shadow:0 0 0 1.5px var(--line);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--mint)}
.bar.hp>i{background:var(--mint)}
.bar.low>i{background:var(--rose)}
canvas.spr{image-rendering:pixelated;background:var(--deep);box-shadow:0 0 0 2px var(--line);flex:none}
.cre{display:flex;gap:12px;background:var(--panel);box-shadow:0 0 0 2px var(--line),5px 5px 0 0 var(--deep);padding:12px;min-width:0}
.cre-main{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.cre-name{font-family:var(--display);font-size:1.12rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cre-name .lv{color:var(--gold);font-size:.9rem}
.cgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.cgrid.two{grid-column:1/-1}
.ccard{display:flex;gap:8px;align-items:flex-start;background:var(--panel);border:0;box-shadow:0 0 0 2px var(--line),3px 3px 0 0 var(--deep);padding:7px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;min-width:0;width:100%}
.ccard:hover,.ccard:focus-visible{box-shadow:0 0 0 2px var(--gold),3px 3px 0 0 var(--deep);outline:none}
.ccard.f-go{box-shadow:0 0 0 2px var(--mint),3px 3px 0 0 var(--deep)}
.cc-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;font-size:.8rem;line-height:1.25}
.cc-name{font-family:var(--display);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cc-name b{color:var(--gold);font-weight:400;font-size:.8rem}.cc-name small{color:var(--muted)}
.cc-form,.cc-where{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-types .chip{font-size:.68rem;padding:0 5px}
.cc-flag{align-self:flex-start;font-family:var(--display);font-size:.7rem;padding:0 6px;background:var(--deep);box-shadow:0 0 0 1.5px var(--line)}
.cc-flag.go{color:var(--mint);box-shadow:0 0 0 1.5px var(--mint)}.cc-flag.hurt{color:var(--rose)}.cc-flag.warn{color:var(--gold)}.cc-flag.new{color:var(--sky)}
.cc-ctx{color:var(--ink);font-size:.76rem;border-top:1px solid var(--line);padding-top:3px;margin-top:2px}.cc-ctx b{color:var(--gold);font-weight:400}
.ccard .bar{height:5px}
.sprlink{background:none;border:0;padding:0;cursor:pointer;flex:none}
.tnode.live{cursor:pointer;color:var(--ink);font:inherit;text-align:left;border:0}.tnode.live:hover{box-shadow:0 0 0 1.5px var(--gold)}
.cpage{display:flex;flex-direction:column;gap:10px;min-width:0}
.cp-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.cp-nav{display:flex;align-items:center;gap:8px}
.cp-cols{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr);gap:14px;align-items:start}
.cp-id{background:var(--panel);box-shadow:0 0 0 2px var(--line),5px 5px 0 0 var(--deep);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cp-head{display:flex;gap:8px;align-items:flex-start}.cp-headtext{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}.cp-head canvas.spr{width:72px;height:72px}
.cp-rename input{width:100%;font-family:var(--display);font-size:1rem;background:var(--deep);color:var(--ink);border:0;box-shadow:0 0 0 1.5px var(--line);padding:4px 6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cp-main{background:var(--panel);box-shadow:0 0 0 2px var(--line),5px 5px 0 0 var(--deep);padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cp-tabs{display:flex;flex-wrap:wrap;gap:6px}
#cp-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.cp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px}
.cp-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;align-items:start}
.cp-stat{background:var(--deep);box-shadow:0 0 0 1.5px var(--line);padding:5px 8px}
.cp-stat summary{display:flex;flex-direction:column;cursor:pointer;list-style:none}.cp-stat summary::-webkit-details-marker{display:none}
.cp-stat summary span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.cp-stat summary b{font-family:var(--display);font-weight:400;font-size:1.05rem}
.cp-parts,.cp-work{list-style:none;padding:0;margin:4px 0 0;font-size:.78rem}
.cp-parts li,.cp-work li{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:2px 0}.cp-parts b{font-weight:400;font-variant-numeric:tabular-nums}
.cp-work li span:last-child{text-align:right;color:var(--ink)}.cp-work li.on{color:var(--gold)}
.cp-actions{display:flex;flex-direction:column;gap:8px}
.cp-log{max-height:none}
@media (max-width:560px){.cp-cols,.cp-grid{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0;font-variant-numeric:tabular-nums}
.stats div{background:var(--deep);padding:3px 6px}
.stats dt{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stats dd{margin:0;font-family:var(--display)}
/* The Exchange: news ticker, commodity rows, books, auctions, charts */
.ticker{overflow:hidden;background:var(--deep);box-shadow:0 0 0 1.5px var(--line);margin:4px 0 8px}
.ticker-track{display:inline-flex;gap:28px;white-space:nowrap;padding:6px 0;animation:tick 60s linear infinite}
.ticker-track span{font-size:.85rem}.ticker-track small{color:var(--gold);margin-right:6px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none;flex-wrap:wrap;white-space:normal}}
.goods{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.goodrow{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,.8fr) minmax(0,.8fr);gap:8px;align-items:center;background:var(--deep);border:0;box-shadow:0 0 0 1.5px var(--line);padding:6px 8px;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.goodrow.on{box-shadow:0 0 0 2px var(--gold)}
.goodrow small{display:block;color:var(--muted);font-size:.74rem}
.goodrow .gprice b{font-family:var(--display);color:var(--gold)}
.goodrow small.up{color:var(--mint)}.goodrow small.down{color:var(--rose)}
.spark path{fill:none;stroke:var(--sky);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.gooddetail{background:var(--panel);box-shadow:0 0 0 1.5px var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.books{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.books table{width:100%;border-collapse:collapse;font-size:.82rem;font-variant-numeric:tabular-nums}
.books th{text-align:left;color:var(--muted);font-weight:500;font-size:.76rem}
.books td{padding:2px 4px;border-top:1px solid var(--line)}.books tr.mine td{color:var(--gold)}
.auctions{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));margin-top:8px}
.auction{background:var(--deep);box-shadow:0 0 0 1.5px var(--line);padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.auction small{display:block;color:var(--ink);font-size:.8rem;overflow-wrap:anywhere}.auction small.status{color:var(--muted)}
.lchart{position:relative;margin:4px 0}
.lchart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.lc-grid{stroke:var(--line);stroke-width:1}.lc-ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:0}
.lc-axis{fill:var(--muted);font-size:10px;font-family:var(--body)}
.lc-line{fill:none;stroke:var(--sky);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.lc-dot,.lc-hot{fill:var(--sky);stroke:var(--deep);stroke-width:2}
.lc-end{fill:var(--ink);font-size:11px;font-family:var(--display)}
.lc-cross{stroke:var(--ink);stroke-width:1;opacity:.6}.lc-hit{fill:transparent;cursor:crosshair}
.lc-tip{position:absolute;top:2px;background:var(--night);box-shadow:0 0 0 1.5px var(--line);padding:3px 8px;font-size:.78rem;pointer-events:none;display:flex;gap:6px;align-items:baseline}
.lc-tip[hidden]{display:none!important}.lc-tip b{font-family:var(--display);color:var(--ink)}.lc-tip span{color:var(--muted)}
.lc-table summary{cursor:pointer;color:var(--muted);font-size:.78rem}.lc-table table{font-size:.78rem;border-collapse:collapse}.lc-table td,.lc-table th{padding:1px 8px;text-align:right}
/* Jobs and production: quality, durability, fatigue, stores, memorial, gear */
.chip.q0{color:var(--muted)}.chip.q1{color:var(--ink)}.chip.q2{color:var(--mint);box-shadow:0 0 0 1.5px #1f7a62}.chip.q3{color:var(--sky);box-shadow:0 0 0 1.5px var(--sky)}.chip.q4{color:var(--gold);box-shadow:0 0 0 1.5px var(--gold-d)}
.chip.role{color:var(--sky)}
.qodds{display:flex;height:16px;margin:4px 0;box-shadow:0 0 0 1.5px var(--line);background:var(--deep);overflow:hidden}
.qodds i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.66rem;white-space:nowrap;overflow:hidden;color:var(--deep);min-width:2px}
.qodds .q0{background:#7d7398}.qodds .q1{background:var(--ink)}.qodds .q2{background:var(--mint)}.qodds .q3{background:var(--sky)}.qodds .q4{background:var(--gold)}
.bar.fat{height:4px;margin-top:3px}.bar.fat i{background:var(--rose)}
.bar.dur{height:4px;margin-top:3px}.bar.dur i{background:var(--mint)}
span.short{color:var(--rose)}
.status.over{color:var(--rose)}
.mats{display:flex;flex-direction:column;gap:6px}
.matrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.matrow small{display:block;color:var(--muted);font-size:.78rem}
.matrow .num{font-family:var(--display);color:var(--gold);font-size:1.05rem;text-align:right}
.matrow .row{grid-column:1/-1}
.invrow.gear{align-items:flex-start}
.gearrow{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.wall{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.memorial{display:flex;gap:8px;align-items:flex-start;background:var(--deep);box-shadow:0 0 0 1.5px var(--line);padding:8px;font-size:.85rem}
.memorial .nm{font-family:var(--display)}
.memorial canvas{flex:none;filter:grayscale(.6)}
/* Genetics: star ratings, allele pairs, family tree, simulator histogram */
.gstars{color:var(--gold);letter-spacing:1px;font-size:.8rem;white-space:nowrap}
.gstars i{color:var(--line);font-style:normal}
.genes small.al{color:var(--muted);font-size:.72rem}
.apex{color:var(--gold)}
span.neg{color:var(--rose)}
.tree{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.tcol{display:flex;flex-direction:column;gap:6px;min-width:150px;flex:none}
.tnodes{display:flex;flex-direction:column;justify-content:space-around;gap:6px;flex:1}
.tnode{display:flex;gap:6px;align-items:center;background:var(--deep);box-shadow:0 0 0 1.5px var(--line);padding:4px 6px;font-size:.8rem;line-height:1.25}
.tnode.unknown{color:var(--muted);justify-content:center;min-height:42px}
.tnode.twice{box-shadow:0 0 0 1.5px var(--gold)}
.tnode canvas{flex:none}
.hist{display:grid;gap:3px;margin-top:6px}
.hrow{display:grid;grid-template-columns:4.5em 1fr 2.5em;gap:8px;align-items:center;font-size:.8rem}
.hrow .g{height:8px;background:var(--deep);position:relative}
.hrow .g i{position:absolute;inset:0 auto 0 0;background:var(--sky)}
.genes{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:.85rem}
.genes .g{height:6px;background:var(--deep);position:relative}
.genes .g i{position:absolute;inset:0 auto 0 0;background:var(--sky)}
.genes span:last-child{font-family:var(--display);font-variant-numeric:tabular-nums}
.trait{font-size:.9rem}
.trait b{font-family:var(--display);font-weight:600;color:var(--gold)}
.status{font-size:.85rem;color:var(--muted)}
.slots{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.slots{grid-template-columns:minmax(0,1fr)}}
.slot{background:var(--deep);box-shadow:0 0 0 2px var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.slot.support{box-shadow:0 0 0 2px var(--sky)}
.slot-label{font-family:var(--display);font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.slot-body{display:flex;gap:10px;align-items:center;min-width:0}
.slot-body .nm{font-family:var(--display);font-size:1.05rem}
.guns{display:flex;flex-wrap:wrap;gap:8px}
.gun{background:var(--deep);border:0;box-shadow:0 0 0 2px var(--line);padding:8px 10px;cursor:pointer;text-align:left;min-width:150px;flex:1}
.gun[aria-pressed="true"]{box-shadow:0 0 0 2px var(--gold),0 0 0 4px var(--gold-d)}
.gun b{font-family:var(--display);display:block}
.gun small{color:var(--muted)}
.risk{background:#2c1230;box-shadow:0 0 0 2px var(--rose);padding:10px 12px;font-size:.95rem}
.risk b{color:var(--rose);font-family:var(--display);font-weight:600}
.station{gap:10px}
.station-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.workers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.worker{background:var(--deep);padding:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.worker select{width:100%;background:var(--panel2);border:0;box-shadow:0 0 0 1.5px var(--line);padding:4px}
.worker .lab{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}

.log li span{font-family:var(--display);color:var(--gold);margin-right:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}

.kv dd{margin:0;font-family:var(--display);text-align:right}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.field select,.field input[type=number]{background:var(--deep);border:0;box-shadow:0 0 0 1.5px var(--line);padding:6px}
.toggle{display:flex;gap:8px;align-items:center;cursor:pointer}
.empty{color:var(--muted);font-style:italic}
kbd{font-family:var(--display);background:var(--deep);box-shadow:0 0 0 1.5px var(--line);padding:0 5px;font-size:.85rem}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
/* modal */
#modal{position:fixed;inset:0;z-index:80;background:rgba(8,5,20,.78);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--panel);box-shadow:0 0 0 2px var(--gold-d),6px 6px 0 0 var(--deep);padding:18px;width:min(560px,100%);max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
#modal .box.wide{width:min(880px,100%)}
.report{display:grid;gap:8px 16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));align-items:start}
.rsec{display:flex;flex-direction:column;gap:4px;min-width:0}
.choose-list{display:flex;flex-direction:column;gap:8px}
.choose-list.cgrid{display:grid}
.choice{display:flex;gap:10px;align-items:center;background:var(--deep);border:0;box-shadow:0 0 0 2px var(--line);padding:8px;cursor:pointer;text-align:left;width:100%}
.choice:hover{box-shadow:0 0 0 2px var(--gold)}
.choice .nm{font-family:var(--display)}
.choice small{color:var(--muted);display:block}
.res-title{font-size:1.6rem}
.res-title.win{color:var(--mint)}
.res-title.lose{color:var(--rose)}
/* raid overlay: stats top-left, map top-right, actions on the right edge above the aim thumb; bottom of the screen stays clear for both sticks */
#raid{position:fixed;inset:0;z-index:50;background:var(--deep);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;overscroll-behavior:none}
/* During a raid the page underneath is pinned, so dragging a joystick can't scroll it, pull to refresh, or slide the browser's address bar (Opera and Chrome on Android) */
html.raiding,html.raiding body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:absolute;pointer-events:none;font-family:var(--display)}
.lcol{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;width:min(210px,50vw);display:flex;flex-direction:column;gap:5px;pointer-events:none}
.hud-top{font-family:var(--display);background:rgba(14,10,31,.8);box-shadow:0 0 0 2px var(--line);padding:5px 7px;display:flex;flex-direction:column;gap:4px}
.hud-line{display:flex;justify-content:space-between;font-size:.8rem;gap:6px;white-space:nowrap}
.hud-hp{height:14px;background:#2a0f1c;position:relative;box-shadow:0 0 0 1.5px var(--deep)}
.hud-hp i{position:absolute;inset:0 auto 0 0;background:var(--rose)}
.hud-hp span{position:absolute;inset:0;font-size:.7rem;line-height:14px;text-align:center;color:#fff;text-shadow:1px 1px 0 var(--deep)}
#hudGun{font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.party{display:flex;flex-direction:column;gap:5px;pointer-events:none}
.pc{pointer-events:auto;background:rgba(14,10,31,.8);border:0;box-shadow:0 0 0 2px var(--line);padding:4px 7px;font-family:var(--display);font-size:.78rem;color:var(--ink);display:grid;grid-template-columns:auto 1fr auto;gap:2px 6px;align-items:center;text-align:left;touch-action:none;cursor:pointer}
.pc .key{color:var(--gold)}
.pc .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .cd{font-size:.7rem;color:var(--mint)}
.pc .mini-bar{grid-column:1/-1;height:4px;background:#222;position:relative}
.pc .mini-bar i{position:absolute;inset:0 auto 0 0;background:var(--mint)}
.pc .cdb{grid-column:1/-1;height:3px;background:#222;position:relative}
.pc .cdb i{position:absolute;inset:0 auto 0 0;background:var(--sky)}
.pc.down{box-shadow:0 0 0 2px var(--rose)}
.pc.caged{box-shadow:0 0 0 2px var(--gold)}
.pc.s3{cursor:default}
.pc .sw{display:flex;gap:4px}
.pc .sw button{pointer-events:auto;border:0;background:var(--panel2);box-shadow:0 0 0 1.5px var(--line);color:var(--ink);font-family:var(--display);font-size:.72rem;padding:3px 6px;touch-action:none;cursor:pointer}
.hud-tr{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{width:88px;height:88px;background:rgba(14,10,31,.8);box-shadow:0 0 0 2px var(--line);pointer-events:none}
@media (min-width:700px) and (min-height:560px){#mini{width:120px;height:120px}}
.pbtn{border:0;background:rgba(45,36,87,.9);box-shadow:0 0 0 2px var(--line);color:var(--ink);font-family:var(--display);padding:6px 12px;cursor:pointer;touch-action:none}
.ccol{position:absolute;left:50%;transform:translateX(-50%);top:27%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:min(480px,86vw)}
#hudMsg{position:static;max-width:100%;box-sizing:border-box;background:rgba(14,10,31,.85);box-shadow:0 0 0 2px var(--gold-d);padding:5px 10px;width:max-content;text-align:center;font-size:.8rem}
#hudPrompt{max-width:100%;background:rgba(14,10,31,.9);border:0;box-shadow:0 0 0 2px var(--sky);padding:7px 12px;text-align:center;max-width:80vw;font-family:var(--display);font-size:.85rem;color:var(--ink);pointer-events:none;touch-action:none}
#hudPrompt.tap{pointer-events:auto;background:var(--sky);color:var(--deep);box-shadow:0 0 0 2px var(--deep),0 3px 0 2px var(--deep);cursor:pointer}
.hud-keys{left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:.78rem;color:var(--muted);background:rgba(14,10,31,.75);padding:5px 8px;max-width:60vw}
/* Raid menus fill a phone held sideways and never scroll: a header row (title, tabs or a note, the way back)
   over columns of cards. If something still runs long, fitOverlay() zooms the contents down to fit. */
#pause{position:absolute;inset:0;background:rgba(8,5,20,.8);display:flex;align-items:center;justify-content:center;
  padding:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
#pause .box{background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:12px 14px;width:min(900px,100%);max-height:100%;overflow:hidden;touch-action:none}
.ov{display:flex;flex-direction:column;gap:8px}
.ovhead{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
.ovhead h2{flex:none}
.ovhead .status{flex:1 1 200px;min-width:0}
.ovhead>.btn{margin-left:auto;flex:none}
.ovhead .mtabs{flex:1}
.ovcols{display:grid;gap:8px;align-items:stretch}
.ovcols.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.ovcols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ovcols.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.ovcols.offers{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.ovcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.ovcols .mcre{min-width:0}
.ovcols .mcre small{font-size:.76rem;line-height:1.3}
.ovcols .mcre .grow{flex:1;color:var(--ink)}
.ovcols .mcre .btn{align-self:flex-start}
.ovlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:.8rem;line-height:1.3}
.ovlist b{font-family:var(--display);font-weight:600;color:var(--mint)}
.ovlist li.bad b{color:var(--rose)}
.status.warn{color:var(--rose)}
.choice.offer{flex-direction:column;align-items:flex-start;gap:4px;height:100%}
.choice.offer small{flex:1;font-size:.76rem;line-height:1.3}
.choice.offer .price{font-family:var(--display);color:var(--gold)}
@media (max-width:620px){.ovcols.c5{grid-template-columns:repeat(3,minmax(0,1fr))}.ovcols.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* The arena's spawn panel: a small button under the minimap that opens a no-scroll grid of label and controls rows */
#arenaPanel{position:absolute;right:calc(env(safe-area-inset-right,0px) + 8px);top:calc(env(safe-area-inset-top,0px) + 100px);display:flex;flex-direction:column;gap:5px;background:rgba(14,10,31,.9);box-shadow:0 0 0 2px var(--line);padding:5px 8px;overflow:hidden;font-size:.8rem}
@media (min-width:700px) and (min-height:560px){#arenaPanel{top:calc(env(safe-area-inset-top,0px) + 140px)}}
#arenaPanel summary{font-family:var(--display);cursor:pointer;color:var(--gold)}
#arenaPanel .ap{display:grid;grid-template-columns:auto auto;gap:4px 8px;margin-top:5px;align-items:center}
#arenaPanel .lab{font-family:var(--display);font-size:.7rem;color:var(--muted);text-transform:uppercase}
#arenaPanel .row{gap:4px;flex-wrap:nowrap}
#arenaPanel .btn.small{padding:3px 7px;font-size:.74rem}
/* Touch controls, laid out for a phone held sideways: move stick bottom left, aim stick bottom right,
   skills 1 and 2 above the aim stick, the combo above them, a large Catch button left of the aim stick
   and Roll above it. Positions follow the stick (--sm from the side, --sb from the bottom, --sr radius). */
#actCol{position:absolute;inset:0;pointer-events:none;--sm:80px;--sb:78px;--sr:52px}
#actCol .tb{position:absolute;pointer-events:auto;padding:0}
#tQ,#tE{bottom:calc(var(--sb) + var(--sr) + 10px)}
#tQ{right:calc(var(--sm) + 5px)}
#tE{right:calc(var(--sm) - var(--tb,54px) - 5px)}
#tCombo{right:calc(var(--sm) - var(--tb,54px) / 2);bottom:calc(var(--sb) + var(--sr) + var(--tb,54px) + 18px)}
#raid #tCage{width:calc(var(--tb,54px) * 1.4);height:calc(var(--tb,54px) * 1.4);right:calc(var(--sm) + var(--sr) + 16px);bottom:calc(var(--sb) - var(--tb,54px) * .7)}
#raid #tRoll{width:calc(var(--tb,54px) * .85);height:calc(var(--tb,54px) * .85);right:calc(var(--sm) + var(--sr) + 30px);bottom:calc(var(--sb) + var(--tb,54px) * .7 + 8px)}
#raid.lefty #tQ{right:auto;left:calc(var(--sm) - var(--tb,54px) - 5px)}
#raid.lefty #tE{right:auto;left:calc(var(--sm) + 5px)}
#raid.lefty #tCombo{right:auto;left:calc(var(--sm) - var(--tb,54px) / 2)}
#raid.lefty #tCage{right:auto;left:calc(var(--sm) + var(--sr) + 16px)}
#raid.lefty #tRoll{right:auto;left:calc(var(--sm) + var(--sr) + 30px)}
.tb.skill{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.05;overflow:hidden;
  background:conic-gradient(rgba(14,10,31,.75) calc(var(--cd,0) * 360deg),rgba(45,36,87,.9) 0)}
.tb.skill b{font-size:1rem;color:var(--gold)}
.tb.skill span{font-size:.56rem;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb.skill.off{opacity:.45}
.tb.cage{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9rem}
.tb.cage span{font-size:.62rem}
.tb.cage.off{opacity:.5;background:rgba(45,36,87,.75);box-shadow:0 0 0 2px var(--line);color:var(--muted)}
.tb.roll{font-size:.72rem}
#rotateHint{display:none}
@media (orientation:portrait) and (max-width:700px){#raid:not([hidden]) #rotateHint{display:block;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);background:rgba(14,10,31,.85);box-shadow:0 0 0 2px var(--line);padding:4px 10px;font-family:var(--display);font-size:.75rem;color:var(--muted);pointer-events:none;white-space:nowrap}}
/* Phones held sideways: a compact HUD so the left column clears the move stick */
@media (orientation:landscape) and (max-height:500px){
  .lcol{width:min(200px,30vw);gap:3px;top:calc(env(safe-area-inset-top,0px) + 6px);left:calc(env(safe-area-inset-left,0px) + 6px)}
  .hud-top{padding:3px 6px;gap:2px}
  .hud-line{font-size:.7rem}
  .hud-hp{height:11px}.hud-hp span{font-size:.6rem;line-height:11px}
  #hudGun{font-size:.64rem}
  .pc{padding:2px 6px;font-size:.66rem;gap:1px 5px}
  .pc .cd{font-size:.6rem}
  .pc .mini-bar{height:3px}
  #mini{width:72px;height:72px}
  .hud-tr{top:calc(env(safe-area-inset-top,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 6px)}
  .ccol{top:22%}
  #raid{--tb:50px}
  #pause .box{width:100%;padding:10px 12px}
  #pause h2{font-size:1.05rem}
}
.hud-tr{flex-direction:row;align-items:flex-start}
#btnPause{font-size:1.2rem;line-height:1;padding:6px 10px}
/* The raid menu: backpack, creatures, weapons, settings */
.mtabs{display:flex;gap:4px;flex-wrap:wrap}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.mitem{background:var(--deep);box-shadow:0 0 0 2px var(--line);padding:6px 8px;display:flex;justify-content:space-between;gap:6px;font-family:var(--display);font-size:.85rem}
.mitem b{color:var(--gold)}
.mitem.empty{color:var(--muted)}
.mcre{background:var(--deep);box-shadow:0 0 0 2px var(--line);padding:8px;display:flex;flex-direction:column;gap:5px}
.mcre.caught{box-shadow:0 0 0 2px var(--gold)}
.mcre.down{box-shadow:0 0 0 2px var(--rose)}
.mcre .row{gap:6px}
.bagbar{height:8px;background:#222;position:relative}.bagbar i{position:absolute;inset:0 auto 0 0;background:var(--mint)}
.tb{width:54px;height:54px;border-radius:50%;border:0;background:rgba(45,36,87,.88);box-shadow:0 0 0 2px var(--line);font-family:var(--display);font-size:.78rem;color:var(--ink);touch-action:none}
.tb.cage{background:rgba(255,207,74,.25);box-shadow:0 0 0 2px var(--gold);color:var(--gold)}
.tb.big{background:rgba(255,207,74,.85);color:var(--deep)}
.chip.sex{font-weight:700}
.chip.sex.f{background:#4a1a35;color:#ff8fb1;box-shadow:0 0 0 1.5px #b3507a}
.chip.sex.m{background:#14304a;color:#7fc8ff;box-shadow:0 0 0 1.5px #3a7ab3}
ul.traits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:.88rem}
ul.traits b{font-family:var(--display);font-weight:600;color:var(--gold)}
ul.traits li.neg b{color:var(--rose)}
.genes .g b{position:absolute;top:-2px;width:4px;height:10px;background:var(--gold)}
.gunslot{background:var(--deep);box-shadow:0 0 0 2px var(--line);padding:10px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:min(100%,220px)}
.gunslot select{background:var(--panel2);border:0;box-shadow:0 0 0 1.5px var(--line);padding:6px}
.gunslot small{color:var(--muted)}
.bchips{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.bchip{font-size:.68rem;background:#123d33;color:var(--mint);padding:0 5px}
#hudGun .on{color:var(--gold)}
#hudGun span:not(.on){color:var(--muted)}
.choice[disabled]{opacity:.45;cursor:not-allowed}
.choice small{color:var(--muted);display:block;font-family:var(--body)}
#arenaPanel select{background:var(--panel2);border:0;box-shadow:0 0 0 1.5px var(--line);padding:3px;max-width:100%}
/* v4 hideout */
.hideout{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.hideout{grid-template-columns:minmax(0,1fr)}}
.seclist{display:flex;flex-direction:column;gap:8px}
@media (max-width:760px){.seclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.secbtn{text-align:left;border:0;background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0}
.secbtn.on{box-shadow:0 0 0 2px var(--gold),4px 4px 0 0 var(--deep)}
.secbtn.locked{opacity:.55}
.secbtn .nm{font-family:var(--display);font-size:1rem}
.secbtn small{color:var(--muted)}
.mbar{display:block;height:5px;background:var(--deep);position:relative}
.mbar i{position:absolute;inset:0 auto 0 0;background:var(--mint)}
.meter{position:relative;height:16px;background:var(--deep);box-shadow:0 0 0 2px var(--line);margin:18px 0 4px}
.meter>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--mint),var(--gold))}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muted)}
.meter b.on{background:var(--gold)}
.meter b span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:.7rem;color:var(--muted);font-weight:400}
.meter b.on span{color:var(--gold)}
.tierlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.tierlist li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;background:var(--deep);padding:5px 8px;color:var(--muted);font-size:.92rem}
.tierlist li b{font-family:var(--display)}
.tierlist li.on{color:var(--ink);box-shadow:inset 3px 0 0 var(--gold)}
.tierlist li.on b{color:var(--gold)}
.tierlist small{font-family:var(--display);font-size:.75rem}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.member{display:flex;gap:8px;align-items:center;background:var(--deep);padding:6px;min-width:0}
.member .nm{font-family:var(--display)}
.member small{color:var(--muted)}
.secdetail select,#addsel{background:var(--deep);border:0;box-shadow:0 0 0 1.5px var(--line);padding:6px;max-width:100%;min-width:0;flex:1}
.chip.tier{background:#3a2e10;color:var(--gold);box-shadow:0 0 0 1.5px var(--gold-d)}
.chip.tier.t0{background:var(--panel2);color:var(--muted);box-shadow:0 0 0 1.5px var(--line)}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.recipe{background:var(--deep);box-shadow:0 0 0 2px var(--line);padding:8px;display:flex;flex-direction:column;gap:6px}
.recipe b{font-family:var(--display);font-weight:600}
.recipe small{color:var(--muted)}
.recipe.unknown{opacity:.55}
.invrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--deep);padding:6px 8px}
.invrow b{font-family:var(--display);font-weight:600}
.trophies{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.trophy{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--deep);padding:6px 4px;text-align:center;font-family:var(--display);font-size:.72rem;color:var(--muted)}
.trophy.won{color:var(--gold);box-shadow:0 0 0 1.5px var(--gold-d)}
.trophy small{font-size:.65rem;color:var(--muted)}
.trophy canvas.spr{box-shadow:none}
.trophy:not(.won) canvas{opacity:.25;filter:grayscale(1)}
.modes{display:flex;flex-direction:column;gap:8px}
.toggle.locked{opacity:.55}
.seg{display:flex;flex-wrap:wrap;gap:6px}
input[type=range]{accent-color:var(--gold);width:100%}
#bossBar{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 236px);width:min(420px,80vw);font-family:var(--display);text-align:center;pointer-events:none}
#bossBar span{display:block;font-size:.85rem;color:#ffa0b0;text-shadow:1px 1px 0 var(--deep)}
#bossBar .bb{height:10px;background:#2a0f1c;box-shadow:0 0 0 2px var(--deep),0 0 0 4px #ff5c7a;position:relative}
#bossBar .bb i{position:absolute;inset:0 auto 0 0;background:#ff3a5c}
.ccol.low{top:calc(env(safe-area-inset-top,0px) + 276px)!important}
#raid .lcol,#raid .hud-tr{opacity:var(--hud-a,.85)}
#raid .tb{width:var(--tb,54px);height:var(--tb,54px)}
#raid.lefty #actCol{right:auto;left:10px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}

/* v5 */
.tab .dot,.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rose);margin-left:6px;vertical-align:middle;box-shadow:0 0 0 1.5px var(--deep)}
.chip.pers{background:#2a2050;color:#c8b8ff;box-shadow:0 0 0 1.5px #5d43a3}
.stars{color:var(--gold);font-size:.95rem;letter-spacing:1px;white-space:nowrap}
.stars i{font-style:normal;color:var(--line)}
.lbl{color:var(--sky);font-family:var(--display);font-weight:600}
.evochain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.82rem}
.evochain i{font-style:normal;color:var(--muted)}
.evo{font-family:var(--display);padding:1px 6px;background:var(--deep);color:var(--muted);box-shadow:0 0 0 1px var(--line)}
.evo small{font-size:.7rem;color:var(--muted)}
.evo.on{color:var(--deep);background:var(--gold);box-shadow:0 0 0 1px var(--gold-d)}
.evo.on small{color:var(--deep)}
.evo.done{color:var(--ink)}
.combo{background:var(--deep);box-shadow:0 0 0 2px var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.combo.special{box-shadow:0 0 0 2px var(--gold-d)}
