<title>GeneSling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: sticky resource header + tab rail over one working panel; raids take over the screen as a canvas overlay */
:root{
  --night:#17122e; --deep:#0e0a1f; --panel:#231b45; --panel2:#2d2457; --line:#4b3e87;
  --ink:#f6eedb; --muted:#b4a9d8; --gold:#ffcf4a; --gold-d:#b5861b; --mint:#5de8b0; --rose:#ff6688; --sky:#58c2ff;
  --display:'Pixelify Sans','Courier New',monospace; --body:'Alegreya Sans','Trebuchet MS',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px),radial-gradient(rgba(255,207,74,.06) 1px,transparent 1.2px);
  background-size:26px 26px,57px 57px;background-position:0 0,13px 9px}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0}
.app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--night);padding-block:12px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;border-bottom:2px solid var(--line)}
.brand{font-family:var(--display);font-size:1.7rem;font-weight:700;color:var(--gold);text-shadow:2px 2px 0 var(--rose),4px 4px 0 var(--deep);letter-spacing:.04em}
.res{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.pill{font-family:var(--display);font-size:.92rem;background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{color:var(--gold);font-weight:600}
.pill small{color:var(--muted);font-family:var(--body);font-size:.78rem}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--display);background:var(--panel);border:0;box-shadow:0 0 0 2px var(--line);padding:7px 14px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--gold);color:var(--deep);box-shadow:0 0 0 2px var(--gold-d)}
.tab:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
main{padding-top:12px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);box-shadow:0 0 0 2px var(--line),5px 5px 0 0 var(--deep);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hint{color:var(--muted);font-size:.95rem;max-width:65ch}
.btn{font-family:var(--display);background:var(--panel2);border:0;box-shadow:0 0 0 2px var(--line),0 3px 0 2px var(--deep);padding:7px 12px;cursor:pointer;transition:transform .05s}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--gold);color:var(--deep);box-shadow:0 0 0 2px var(--gold-d),0 3px 0 2px var(--gold-d)}
.btn.danger{background:#5a1d33;box-shadow:0 0 0 2px var(--rose),0 3px 0 2px #2d0b18}
.btn.small{padding:4px 9px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-block;font-family:var(--display);font-size:.78rem;padding:1px 7px;background:var(--panel2);box-shadow:0 0 0 1.5px var(--line);white-space:nowrap}
.chip.type{background:var(--c);color:var(--deep);box-shadow:0 0 0 1.5px var(--deep)}
.chip.warn{background:#5c4410;color:var(--gold);box-shadow:0 0 0 1.5px var(--gold-d)}
.chip.good{background:#123d33;color:var(--mint);box-shadow:0 0 0 1.5px #1f7a62}
.chip.bad{background:#4a1528;color:var(--rose);box-shadow:0 0 0 1.5px var(--rose)}
.bar{height:8px;background:var(--deep);box-shadow:0 0 0 1.5px var(--line);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--mint)}
.bar.hp>i{background:var(--mint)}
.bar.low>i{background:var(--rose)}
canvas.spr{image-rendering:pixelated;background:var(--deep);box-shadow:0 0 0 2px var(--line);flex:none}
.cre{display:flex;gap:12px;background:var(--panel);box-shadow:0 0 0 2px var(--line),5px 5px 0 0 var(--deep);padding:12px;min-width:0}
.cre-main{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.cre-name{font-family:var(--display);font-size:1.12rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cre-name .lv{color:var(--gold);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0;font-variant-numeric:tabular-nums}
.stats div{background:var(--deep);padding:3px 6px}
.stats dt{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stats dd{margin:0;font-family:var(--display)}
.genes{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:.85rem}
.genes .g{height:6px;background:var(--deep);position:relative}
.genes .g i{position:absolute;inset:0 auto 0 0;background:var(--sky)}
.genes span:last-child{font-family:var(--display);font-variant-numeric:tabular-nums}
.trait{font-size:.9rem}
.trait b{font-family:var(--display);font-weight:600;color:var(--gold)}
.status{font-size:.85rem;color:var(--muted)}
.slots{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.slots{grid-template-columns:minmax(0,1fr)}}
.slot{background:var(--deep);box-shadow:0 0 0 2px var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.slot.support{box-shadow:0 0 0 2px var(--sky)}
.slot-label{font-family:var(--display);font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.slot-body{display:flex;gap:10px;align-items:center;min-width:0}
.slot-body .nm{font-family:var(--display);font-size:1.05rem}
.guns{display:flex;flex-wrap:wrap;gap:8px}
.gun{background:var(--deep);border:0;box-shadow:0 0 0 2px var(--line);padding:8px 10px;cursor:pointer;text-align:left;min-width:150px;flex:1}
.gun[aria-pressed="true"]{box-shadow:0 0 0 2px var(--gold),0 0 0 4px var(--gold-d)}
.gun b{font-family:var(--display);display:block}
.gun small{color:var(--muted)}
.risk{background:#2c1230;box-shadow:0 0 0 2px var(--rose);padding:10px 12px;font-size:.95rem}
.risk b{color:var(--rose);font-family:var(--display);font-weight:600}
.station{gap:10px}
.station-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.workers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.worker{background:var(--deep);padding:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.worker select{width:100%;background:var(--panel2);border:0;box-shadow:0 0 0 1.5px var(--line);padding:4px}
.worker .lab{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.log li{background:var(--deep);padding:6px 10px;font-size:.92rem}
.log li span{font-family:var(--display);color:var(--gold);margin-right:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--display);text-align:right}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.field select,.field input[type=number]{background:var(--deep);border:0;box-shadow:0 0 0 1.5px var(--line);padding:6px}
.toggle{display:flex;gap:8px;align-items:center;cursor:pointer}
.empty{color:var(--muted);font-style:italic}
kbd{font-family:var(--display);background:var(--deep);box-shadow:0 0 0 1.5px var(--line);padding:0 5px;font-size:.85rem}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
/* modal */
#modal{position:fixed;inset:0;z-index:80;background:rgba(8,5,20,.78);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--panel);box-shadow:0 0 0 2px var(--gold-d),6px 6px 0 0 var(--deep);padding:18px;width:min(560px,100%);max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.choose-list{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:center;background:var(--deep);border:0;box-shadow:0 0 0 2px var(--line);padding:8px;cursor:pointer;text-align:left;width:100%}
.choice:hover{box-shadow:0 0 0 2px var(--gold)}
.choice .nm{font-family:var(--display)}
.choice small{color:var(--muted);display:block}
.res-title{font-size:1.6rem}
.res-title.win{color:var(--mint)}
.res-title.lose{color:var(--rose)}
/* raid overlay: stats top-left, map top-right, actions on the right edge above the aim thumb; bottom of the screen stays clear for both sticks */
#raid{position:fixed;inset:0;z-index:50;background:var(--deep);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:absolute;pointer-events:none;font-family:var(--display)}
.lcol{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;width:min(210px,50vw);display:flex;flex-direction:column;gap:5px;pointer-events:none}
.hud-top{font-family:var(--display);background:rgba(14,10,31,.8);box-shadow:0 0 0 2px var(--line);padding:5px 7px;display:flex;flex-direction:column;gap:4px}
.hud-line{display:flex;justify-content:space-between;font-size:.8rem;gap:6px;white-space:nowrap}
.hud-hp{height:14px;background:#2a0f1c;position:relative;box-shadow:0 0 0 1.5px var(--deep)}
.hud-hp i{position:absolute;inset:0 auto 0 0;background:var(--rose)}
.hud-hp span{position:absolute;inset:0;font-size:.7rem;line-height:14px;text-align:center;color:#fff;text-shadow:1px 1px 0 var(--deep)}
#hudGun{font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.party{display:flex;flex-direction:column;gap:5px;pointer-events:none}
.pc{pointer-events:auto;background:rgba(14,10,31,.8);border:0;box-shadow:0 0 0 2px var(--line);padding:4px 7px;font-family:var(--display);font-size:.78rem;color:var(--ink);display:grid;grid-template-columns:auto 1fr auto;gap:2px 6px;align-items:center;text-align:left;touch-action:none;cursor:pointer}
.pc .key{color:var(--gold)}
.pc .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .cd{font-size:.7rem;color:var(--mint)}
.pc .mini-bar{grid-column:1/-1;height:4px;background:#222;position:relative}
.pc .mini-bar i{position:absolute;inset:0 auto 0 0;background:var(--mint)}
.pc .cdb{grid-column:1/-1;height:3px;background:#222;position:relative}
.pc .cdb i{position:absolute;inset:0 auto 0 0;background:var(--sky)}
.pc.down{box-shadow:0 0 0 2px var(--rose)}
.pc.caged{box-shadow:0 0 0 2px var(--gold)}
.pc.s3{cursor:default}
.pc .sw{display:flex;gap:4px}
.pc .sw button{pointer-events:auto;border:0;background:var(--panel2);box-shadow:0 0 0 1.5px var(--line);color:var(--ink);font-family:var(--display);font-size:.72rem;padding:3px 6px;touch-action:none;cursor:pointer}
.hud-tr{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{width:88px;height:88px;background:rgba(14,10,31,.8);box-shadow:0 0 0 2px var(--line);pointer-events:none}
@media (min-width:700px) and (min-height:560px){#mini{width:120px;height:120px}}
.pbtn{border:0;background:rgba(45,36,87,.9);box-shadow:0 0 0 2px var(--line);color:var(--ink);font-family:var(--display);padding:6px 12px;cursor:pointer;touch-action:none}
.ccol{position:absolute;left:50%;transform:translateX(-50%);top:27%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:min(480px,86vw)}
#hudMsg{position:static;max-width:100%;box-sizing:border-box;background:rgba(14,10,31,.85);box-shadow:0 0 0 2px var(--gold-d);padding:5px 10px;width:max-content;text-align:center;font-size:.8rem}
#hudPrompt{max-width:100%;background:rgba(14,10,31,.9);border:0;box-shadow:0 0 0 2px var(--sky);padding:7px 12px;text-align:center;max-width:80vw;font-family:var(--display);font-size:.85rem;color:var(--ink);pointer-events:none;touch-action:none}
#hudPrompt.tap{pointer-events:auto;background:var(--sky);color:var(--deep);box-shadow:0 0 0 2px var(--deep),0 3px 0 2px var(--deep);cursor:pointer}
.hud-keys{left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:.78rem;color:var(--muted);background:rgba(14,10,31,.75);padding:5px 8px;max-width:60vw}
#pause{position:absolute;inset:0;background:rgba(8,5,20,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
#pause .box{background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:18px;display:flex;flex-direction:column;gap:10px;width:min(380px,100%);max-height:88vh;overflow:auto}
#arenaPanel{position:absolute;right:8px;top:calc(env(safe-area-inset-top,0px) + 136px);display:flex;flex-direction:column;gap:5px;max-width:200px;background:rgba(14,10,31,.85);box-shadow:0 0 0 2px var(--line);padding:6px 8px;max-height:34vh;overflow:auto}
@media (min-width:700px) and (min-height:560px){#arenaPanel{top:calc(env(safe-area-inset-top,0px) + 170px);max-height:55vh}}
#arenaPanel summary{font-family:var(--display);cursor:pointer;color:var(--gold)}
#arenaPanel .ap{display:flex;flex-direction:column;gap:6px;margin-top:6px;align-items:flex-start}
#arenaPanel .lab{font-family:var(--display);font-size:.78rem;color:var(--muted);text-transform:uppercase}
#arenaPanel .row{gap:4px}
#actCol{position:absolute;right:10px;top:54%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;align-items:center}
.tb{width:54px;height:54px;border-radius:50%;border:0;background:rgba(45,36,87,.88);box-shadow:0 0 0 2px var(--line);font-family:var(--display);font-size:.78rem;color:var(--ink);touch-action:none}
.tb.cage{background:rgba(255,207,74,.25);box-shadow:0 0 0 2px var(--gold);color:var(--gold)}
.tb.big{background:rgba(255,207,74,.85);color:var(--deep)}
.chip.sex{font-weight:700}
.chip.sex.f{background:#4a1a35;color:#ff8fb1;box-shadow:0 0 0 1.5px #b3507a}
.chip.sex.m{background:#14304a;color:#7fc8ff;box-shadow:0 0 0 1.5px #3a7ab3}
ul.traits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:.88rem}
ul.traits b{font-family:var(--display);font-weight:600;color:var(--gold)}
ul.traits li.neg b{color:var(--rose)}
.genes .g b{position:absolute;top:-2px;width:4px;height:10px;background:var(--gold)}
.gunslot{background:var(--deep);box-shadow:0 0 0 2px var(--line);padding:10px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:min(100%,220px)}
.gunslot select{background:var(--panel2);border:0;box-shadow:0 0 0 1.5px var(--line);padding:6px}
.gunslot small{color:var(--muted)}
.bchips{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.bchip{font-size:.68rem;background:#123d33;color:var(--mint);padding:0 5px}
#hudGun .on{color:var(--gold)}
#hudGun span:not(.on){color:var(--muted)}
.choice[disabled]{opacity:.45;cursor:not-allowed}
.choice small{color:var(--muted);display:block;font-family:var(--body)}
#arenaPanel select{background:var(--panel2);border:0;box-shadow:0 0 0 1.5px var(--line);padding:3px;max-width:100%}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">GeneSling</div>
    <div class="res" id="res"></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="main"></main>
</div>

<div id="modal" hidden><div class="box" id="modalBox"></div></div>

<div id="raid" hidden>
  <canvas id="cv"></canvas>
  <div class="lcol"><div class="hud-top">
    <div class="hud-line"><span id="hudFloor">Floor 1</span><span id="hudTime">10:00</span><span id="hudCoin" style="color:var(--gold)">0c</span></div>
    <div class="hud-hp"><i id="hudHp"></i><span id="hudHpTxt">100/100</span></div>
    <div id="hudGun">Pistol</div>
    <div class="hud-line" id="hudBag" style="font-size:.72rem;color:var(--muted)"></div>
  </div>
  <div class="party" id="hudParty"></div></div>
  <div class="hud-tr"><canvas id="mini" width="240" height="240"></canvas><button class="pbtn" id="btnPause" aria-label="Pause">II</button></div>
  <div class="ccol"><div class="hud" id="hudMsg" hidden></div><button id="hudPrompt" data-t="use" hidden></button></div>
  <div id="actCol" hidden>
    <button class="tb cage" data-t="cage" id="tCage" hidden>Cage</button>
    <button class="tb" data-t="gun" id="tGun" hidden>Gun</button>
    <button class="tb big" data-t="roll">Roll</button>
  </div>
  <div class="hud hud-keys" id="hudKeys">Move <kbd>WASD</kbd> · Shoot <kbd>Mouse</kbd> · Roll <kbd>Space</kbd> · Abilities <kbd>Q</kbd> <kbd>E</kbd> or click a companion · Swap slot 3 <kbd>1</kbd> <kbd>2</kbd> · Gun <kbd>R</kbd> · Cage <kbd>F</kbd> · Use <kbd>G</kbd> · Pause <kbd>Esc</kbd></div>
  <div id="arenaPanel" hidden></div>
  <div id="pause" hidden><div class="box" id="pauseBox"></div></div>
</div>

<script>
'use strict';
/* ================= Utilities ================= */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const wpick=(items,wf)=>{const ws=items.map(wf);let x=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<items.length;i++){x-=ws[i];if(x<=0)return items[i]}return items[items.length-1]};
const SAVE_KEY='genesling-save-v2';
const TOUCH=(window.matchMedia&&matchMedia('(pointer: coarse)').matches)||('ontouchstart' in window);

/* ================= Types ================= */
const TYPES={
  ember:{name:'Ember',color:'#ff7a3d',tier:1,base:{hp:60,atk:12,spd:170},attack:'Fire bolt',ability:'Flame Ring',abilityDesc:'Blasts 12 fire bolts in a ring',support:'+10% gun damage',station:'forge',weight:30},
  fungal:{name:'Fungal',color:'#e0527a',tier:1,base:{hp:80,atk:9,spd:150},attack:'Spore shot that slows',ability:'Spore Field',abilityDesc:'A cloud that slows and damages for 4s',support:'+2 food when you extract',station:'garden',weight:30},
  tide:{name:'Tide',color:'#3fa9ff',tier:2,base:{hp:70,atk:8,spd:160},attack:'Bubble shot, heals you slowly',ability:'Tide Shield',abilityDesc:'You take no damage for 3s and heal 15',support:'You regenerate 1 HP per second',station:'spring',weight:16},
  echo:{name:'Echo',color:'#9b7bff',tier:2,base:{hp:55,atk:10,spd:190},attack:'Twin pulse',ability:'Echo Ping',abilityDesc:'Stuns nearby enemies for 1.6s',support:'Reveals the whole floor map',station:'roost',weight:14},
  gale:{name:'Gale',color:'#4fe0c8',tier:3,base:{hp:58,atk:13,spd:220},attack:'Dive strike (melee)',ability:'Gust Dash',abilityDesc:'Dashes through a foe for heavy damage',support:'Unlocks cliff extracts, +10% move speed',station:null,weight:5},
  crystal:{name:'Crystal',color:'#ff8fe0',tier:3,base:{hp:65,atk:9,spd:150},attack:'Shard spray',ability:'Prism Ward',abilityDesc:'Turns enemy bullets near you back on them for 3s',support:'20% chance to block a hit',station:'vault',weight:3.5},
  warden:{name:'Warden',color:'#e3b04b',tier:4,base:{hp:120,atk:9,spd:135},attack:'Stone slam (melee)',ability:'Taunt',abilityDesc:'Enemies attack it for 4s; it takes half damage',support:'+15% max HP for you',station:'nursery',weight:1.5},
};
const TYPE_IDS=Object.keys(TYPES);
const TIER=['','Common','Uncommon','Rare','Very rare'];

function randGenes(min,max){const g={};for(const k in GENES)g[k]=ri(min,max);return g}
function makeCreature(species,origin,level,o={}){
  const sp=SPECIES[species];
  const type=o.type||(sp.hybrid?sp.types[0]:sp.type);
  const type2=sp.hybrid?(o.type2||sp.types.find(t=>t!==type)):null;
  const wild=origin==='wild';
  const c={id:S.nextId++,species,type,type2,sex:o.sex||(Math.random()<.5?'F':'M'),name:o.name||makeName(type),origin,
    proven:!wild||!!o.proven,
    genes:o.genes||(wild?randGenes((o.floor||1)>=2?4:3,10):randGenes(2,7)),
    traits:o.traits||rollTraits(wild?(Math.random()<.5?2:1):2),
    level:level||1,xp:0,bond:wild?(o.bond!=null?o.bond:10):100,gen:o.gen||0,workXp:0,raids:0,
    captureRaid:o.captureRaid!=null?o.captureRaid:-1};
  c.hp=stats(c).hp;return c;
}
function stats(c){
  const B=TYPES[c.type].base,m=SPECIES[c.species].mods,g=c.genes,l=1+.09*(c.level-1),has=k=>c.traits.includes(k);
  let hp=B.hp*m.hp*(.6+g.vig*.08)*l,atk=B.atk*m.atk*(.6+g.pow*.08)*l,spd=B.spd*m.spd*(.85+g.swf*.03),rate=m.rate*(.8+g.hst*.04);
  if(has('thick'))hp*=1.12;if(has('frail'))hp*=.9;if(has('glow'))atk*=1.1;if(has('quick'))spd*=1.12;if(has('clumsy'))spd*=.9;if(has('rapid'))rate*=1.15;
  const obey=c.origin==='bred'?1:clamp(.4+g.tmp*.03+c.bond/250+(c.proven?.1:0),.2,1);
  return{hp:Math.round(hp),atk:Math.round(atk*10)/10,spd:Math.round(spd),rate:Math.round(rate*100)/100,obey,
    taken:has('sturdy')?.85:1,regen:has('regen')?.015:0,reach:has('reach')?1.3:1,abil:(has('focus')?.8:1)*(has('lazy')?1.25:1),crit:has('keen')?.15:0,vamp:has('vamp')?.08:0};
}

    stations:{forge:[null,null],garden:[null,null],spring:[null,null],roost:[null,null],vault:[null,null],nursery:[null,null]},
    loadout:{guns:['revolver','pistol'],slots:[null,null,null]},stats:{raids:0,extracts:0,deaths:0,lost:0,captures:0,hybrids:0},log:[],
    settings:{god:false,reveal:false,instant:false,noTimer:false,keepArena:true},nextId:1};
  const a=makeCreature('pyrrox','bred',3,{name:'Cinder',sex:'M',traits:['glow','rapid'],genes:{vig:6,pow:7,swf:5,hst:6,tmp:5}});
  const b=makeCreature('puffcap','bred',3,{name:'Morel',sex:'F',traits:['thick','sturdy'],genes:{vig:7,pow:5,swf:4,hst:5,tmp:6}});
  const c=makeCreature('dewdrip','wild',3,{name:'Ripple',sex:'F',proven:true,bond:40,traits:['lucky','regen'],genes:{vig:7,pow:6,swf:7,hst:6,tmp:5}});
  const d=makeCreature('cindlet','bred',2,{name:'Kindle',sex:'F',traits:['worker','quick']});
  const e=makeCreature('shroomite','bred',2,{name:'Puffin',sex:'M',traits:['worker','reach']});
  S.creatures.push(a,b,c,d,e);
  S.stations.forge[0]=d.id;S.stations.garden[0]=e.id;
  S.loadout.slots=[a.id,b.id,c.id];
  addLog('Your hideout opens. Kindle runs the Forge and Puffin tends the Garden. Find a Warden to open the Nursery.');
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(SAVE_KEY);if(r){const d=JSON.parse(r);if(d&&d.v===2)return d}}catch(e){}return null}
function addLog(msg){S.log.unshift({day:S.day,msg});S.log=S.log.slice(0,40)}

const byId=id=>S.creatures.find(c=>c.id===id);
function whereIs(c){
  for(const k in S.stations){const i=S.stations[k].indexOf(c.id);if(i>=0)return{kind:'station',key:k,slot:i}}
  const j=S.loadout.slots.indexOf(c.id);if(j>=0)return{kind:'loadout',slot:j};
  return{kind:'idle'};
}
function normStations(){for(const k in S.stations){const s=S.stations[k];if(!s[0]&&s[1]){s[0]=s[1];s[1]=null}}}
function unplace(c){
  for(const k in S.stations)S.stations[k]=S.stations[k].map(x=>x===c.id?null:x);
  S.loadout.slots=S.loadout.slots.map(x=>x===c.id?null:x);normStations();
}
function killCreature(c){unplace(c);S.creatures=S.creatures.filter(x=>x!==c);S.stats.lost++}
const online=k=>!!byId(S.stations[k][0]);
const upgraded=k=>online(k)&&!!byId(S.stations[k][1]);
const workLevel=c=>Math.min(5,1+Math.floor(c.workXp/40));
const typeTier=c=>Math.max(...typesOf(c).map(t=>TYPES[t].tier));
function sellValue(c){return Math.round((12*typeTier(c)**2+c.level*4)*(c.type2?1.5:1))}
function gainXp(c,amt){
  c.xp+=amt;let ups=0;
  while(c.xp>=40*c.level&&c.level<30){c.xp-=40*c.level;c.level++;ups++}
  if(ups)c.hp=Math.min(stats(c).hp,c.hp+12*ups);
  return ups;
}
const eggCap=()=>upgraded('nursery')?2:1;
const sexSym=s=>s==='F'?'♀':'♂';

function processDay(){
  S.day++;const notes=[];
  const n=S.creatures.length;
  if(S.food>=n)S.food-=n;
  else{const short=n-S.food;S.food=0;S.creatures.forEach(c=>{c.bond=Math.max(0,c.bond-5);c.hp=Math.max(1,Math.round(c.hp*.9))});notes.push(`Food ran short by ${short}. Creatures went hungry and lost bond.`)}
  if(online('garden')){const w=byId(S.stations.garden[0]);const g=3+(upgraded('garden')?2:0)+Math.floor((workLevel(w)-1)/2);S.food+=g;notes.push(`The Garden grew ${g} food.`)}
  S.creatures.forEach(c=>{const m=stats(c).hp;c.hp=online('spring')?m:Math.min(m,Math.round(c.hp+m*.35))});
  if(upgraded('spring'))S.creatures.forEach(c=>{if(c.origin==='wild')c.bond=Math.min(100,c.bond+6)});
  for(const k in S.stations)S.stations[k].forEach(id=>{const c=byId(id);if(c)c.workXp+=c.traits.includes('worker')?20:10});
  if(online('nursery')){
    const hatched=[];
    S.eggs.forEach(e=>{e.days--;if(e.days<=0){S.creatures.push(e.child);hatched.push(e.child)}});
    S.eggs=S.eggs.filter(e=>e.days>0);
    hatched.forEach(c=>notes.push(`An egg hatched: ${c.name}, a ${sexSym(c.sex)} ${SPECIES[c.species].name}${c.type2?' (hybrid!)':''}.`));
  }else if(S.eggs.length)notes.push('Eggs are waiting. The Nursery needs a Warden to keep incubating.');
  addLog(`Day ${S.day}. `+(notes.join(' ')||'A quiet day at the hideout.'));
}

/* ================= Breeding ================= */
function hybridChance(mom,dad){
  if(SPECIES[mom.species].hybrid||SPECIES[dad.species].hybrid)return{id:null,p:0};
  const id=hybridFor(mom.type,dad.type);return{id,p:id?(upgraded('nursery')?.18:.1):0};
}
function breed(){
  const mom=byId(+ui.mom),dad=byId(+ui.dad);
  if(!mom||!dad||mom.sex!=='F'||dad.sex!=='M'||!mom.proven||!dad.proven)return;
  if(!online('nursery')||S.coin<20||S.food<3||S.eggs.length>=eggCap())return;
  S.coin-=20;S.food-=3;
  const up=upgraded('nursery'),mc=up?.25:.12;
  let species=mom.species,type=mom.type,type2=mom.type2;
  const h=hybridChance(mom,dad);let isHybrid=!!mom.type2;
  if(h.id&&Math.random()<h.p){species=h.id;type=mom.type;type2=dad.type;isHybrid=true}
  const genes={};
  for(const k in GENES){let v=Math.random()<.7?dad.genes[k]:mom.genes[k];if(Math.random()<mc)v+=pick([-2,-1,1,1,2]);genes[k]=clamp(v,1,10)}
  const traits=[];
  for(let i=0;i<2;i++){
    let t=null;
    if(Math.random()<.08)t=rollTraits(1,traits)[0];
    else{const src=Math.random()<.6?dad:mom;const pool=src.traits.filter(x=>!traits.includes(x));const alt=(src===dad?mom:dad).traits.filter(x=>!traits.includes(x));t=pool.length?pick(pool):alt.length?pick(alt):rollTraits(1,traits)[0]}
    traits.push(t);
  }
  const child=makeCreature(species,'bred',1,{type,type2,genes,traits,gen:Math.max(mom.gen,dad.gen)+1});
  S.eggs.push({id:child.id,days:up?1:2,child,cols:[SPECIES[mom.species].col,SPECIES[dad.species].col],parents:mom.name+' and '+dad.name,hybrid:isHybrid&&!mom.type2});
  if(isHybrid&&!mom.type2){S.stats.hybrids++;addLog(`${mom.name} and ${dad.name} produced a shimmering egg. Something unusual is inside.`)}
  else addLog(`${mom.name} and ${dad.name} produced an egg.`);
  ui.mom='';ui.dad='';save();renderAll();
}

/* ================= Sprites ================= */
const OL='#160f2c';
function drawAcc(g,kind,col,sh,t,front){
  g.lineWidth=2;g.strokeStyle=OL;
  const fs=()=>{g.fill();g.stroke()};
  if(!front){
    if(kind==='tail'){g.fillStyle=sh;g.beginPath();g.moveTo(-9,4);g.quadraticCurveTo(-22,-2+Math.sin(t*6)*3,-18,10);g.quadraticCurveTo(-13,9,-8,9);g.closePath();fs()}
    if(kind==='m-gale'){g.fillStyle='#4fe0c8';g.beginPath();g.moveTo(-6,-2);g.quadraticCurveTo(-22,-12+Math.sin(t*10)*3,-20,4);g.quadraticCurveTo(-13,6,-6,6);g.closePath();fs()}
    if(kind==='m-tide'){g.fillStyle='#3fa9ff';g.beginPath();g.moveTo(-6,-6);g.lineTo(-14,-16);g.lineTo(-2,-10);g.closePath();fs()}
    if(kind==='m-crystal'){g.fillStyle='#ff8fe0';[[-10,-4],[-6,-10]].forEach(([x,y])=>{g.beginPath();g.moveTo(x,y);g.lineTo(x-5,y-8);g.lineTo(x+3,y-3);g.closePath();fs()})}
    return;
  }
  if(kind==='ears'||kind==='m-echo'){g.fillStyle=kind==='m-echo'?'#9b7bff':col;[-1,1].forEach(s=>{g.beginPath();g.moveTo(s*3,-9);g.lineTo(s*8,-19);g.lineTo(s*10,-7);g.closePath();fs()})}
  if(kind==='horns'||kind==='m-warden'){g.fillStyle=kind==='m-warden'?'#c9b48a':'#f6eedb';[-1,1].forEach(s=>{g.beginPath();g.moveTo(s*4,-10);g.lineTo(s*10,-19);g.lineTo(s*9,-9);g.closePath();fs()})}
  if(kind==='crown'){g.fillStyle='#ffcf4a';g.beginPath();g.moveTo(-8,-10);g.lineTo(-8,-17);g.lineTo(-4,-13);g.lineTo(0,-19);g.lineTo(4,-13);g.lineTo(8,-17);g.lineTo(8,-10);g.closePath();fs()}
  if(kind==='m-ember'){const fl=Math.sin(t*14)*2;g.fillStyle='#ffd23f';g.beginPath();g.moveTo(-4,-9);g.lineTo(-1,-19-fl);g.lineTo(2,-12);g.lineTo(5,-18+fl);g.lineTo(6,-9);g.closePath();fs()}
  if(kind==='m-fungal'){g.fillStyle='#fff';[[-6,4,2.2],[5,7,2],[0,0,1.8]].forEach(([x,y,r])=>{g.beginPath();g.arc(x,y,r,0,7);g.fill()})}
}
function drawCreature(g,c,x,y,s,t,o={}){
  const sp=SPECIES[c.species],type=c.type,col=o.flash?'#ffffff':sp.col,sh=o.flash?'#ffffff':sp.shade;
  const seed=o.seed||0,bob=Math.sin(t*6+seed)*1.5,sz=s*(sp.size||1);
  g.save();g.translate(x,y);g.scale(sz,sz);
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,15,11,3.5,0,0,7);g.fill();
  g.translate(0,bob);if(o.face<0)g.scale(-1,1);
  g.lineWidth=2.2;g.strokeStyle=OL;g.lineJoin='round';
  const fs=()=>{g.fill();g.stroke()};
  const eyes=(ex,ey,gap)=>{g.lineWidth=1.5;[ex,ex-gap].forEach(px=>{g.fillStyle='#fff';g.fillRect(px-2,ey-2,4,4);g.strokeRect(px-2,ey-2,4,4);g.fillStyle=OL;g.fillRect(px-.2,ey-1,2,2.4)});g.lineWidth=2.2};
  const mark=c.type2?'m-'+c.type2:null;
  drawAcc(g,sp.acc,col,sh,t,false);if(mark)drawAcc(g,mark,col,sh,t,false);
  g.lineWidth=2.2;g.strokeStyle=OL;
  if(type==='ember'){
    const fl=Math.sin(t*14+seed)*2;
    if(!mark){g.fillStyle='#ffd23f';g.beginPath();g.moveTo(-6,-6);g.lineTo(-2,-17-fl);g.lineTo(1,-10);g.lineTo(4,-18+fl);g.lineTo(7,-6);g.closePath();fs()}
    g.fillStyle='#ffd23f';g.beginPath();g.moveTo(-10,5);g.lineTo(-19,-2+fl);g.lineTo(-15,8);g.closePath();fs();
    g.fillStyle=col;g.beginPath();g.arc(0,3,11,0,7);fs();
    g.fillStyle=o.flash?'#fff':'rgba(255,230,190,.55)';g.beginPath();g.ellipse(1,7,6,4,0,0,7);g.fill();
    eyes(5,0,6);
  }else if(type==='fungal'){
    g.fillStyle=o.flash?'#fff':'#f2e4c9';g.beginPath();g.rect(-7,-1,14,14);fs();
    g.fillStyle=col;g.beginPath();g.ellipse(0,-1,15,11,0,Math.PI,0);g.closePath();fs();
    g.fillStyle='#fff';[[-7,-6,2.5],[2,-8,3],[8,-4,2]].forEach(([a,b,r])=>{g.beginPath();g.arc(a,b,r,0,7);g.fill()});
    eyes(4,6,6);
  }else if(type==='tide'){
    g.fillStyle=sh;g.beginPath();g.moveTo(-8,2);g.lineTo(-16,-4);g.lineTo(-12,8);g.closePath();fs();
    g.fillStyle=col;g.beginPath();g.moveTo(0,-15);g.bezierCurveTo(10,-4,13,4,9,10);g.bezierCurveTo(5,15,-5,15,-9,10);g.bezierCurveTo(-13,4,-10,-4,0,-15);fs();
    g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(-3,-3,2.5,4,-.4,0,7);g.fill();
    eyes(5,3,6);
  }else if(type==='echo'){
    const w=Math.sin(t*12+seed)*4;
    g.fillStyle=sh;g.beginPath();g.moveTo(-6,0);g.lineTo(-20,-8+w);g.lineTo(-16,4);g.lineTo(-20,8);g.lineTo(-6,8);g.closePath();fs();
    g.beginPath();g.moveTo(6,0);g.lineTo(20,-8+w);g.lineTo(16,4);g.lineTo(20,8);g.lineTo(6,8);g.closePath();fs();
    g.fillStyle=col;g.beginPath();g.arc(0,2,9,0,7);fs();
    eyes(4,1,7);
  }else if(type==='gale'){
    g.fillStyle=sh;g.beginPath();g.moveTo(-4,-6);g.lineTo(-10,-16);g.lineTo(-2,-9);g.lineTo(0,-17);g.lineTo(3,-7);g.closePath();fs();
    g.fillStyle=col;g.beginPath();g.ellipse(0,2,12,10,0,0,7);fs();
    g.fillStyle=sh;g.beginPath();g.moveTo(-10,0);g.quadraticCurveTo(-20,-4+Math.sin(t*10)*3,-18,8);g.quadraticCurveTo(-12,8,-6,6);g.closePath();fs();
    g.fillStyle='#ffb347';g.beginPath();g.moveTo(10,0);g.lineTo(18,3);g.lineTo(10,6);g.closePath();fs();
    eyes(6,-1,6);
  }else if(type==='crystal'){
    g.fillStyle=col;g.beginPath();g.moveTo(0,-16);g.lineTo(12,-2);g.lineTo(0,14);g.lineTo(-12,-2);g.closePath();fs();
    g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=1.2;g.beginPath();g.moveTo(-12,-2);g.lineTo(12,-2);g.moveTo(0,-16);g.lineTo(-4,-2);g.lineTo(0,14);g.stroke();
    g.strokeStyle=OL;g.lineWidth=2.2;eyes(5,3,6);
  }else if(type==='warden'){
    g.fillStyle=col;g.beginPath();g.rect(-13,-10,26,24);fs();
    g.fillStyle=sh;g.fillRect(-13,-10,26,6);g.strokeRect(-13,-10,26,6);
    g.fillStyle=o.flash?'#fff':'rgba(60,40,10,.6)';g.fillRect(-9,8,6,6);g.fillRect(3,8,6,6);
    eyes(6,1,8);
  }
  drawAcc(g,sp.acc,col,sh,t,true);if(mark)drawAcc(g,mark,col,sh,t,true);
  if(o.sex){g.font='700 9px sans-serif';g.textAlign='center';g.fillStyle=o.sex==='F'?'#ff8fb1':'#7fc8ff';g.fillText(sexSym(o.sex),11,-10)}
  g.restore();
}
function drawEgg(g,x,y,s,cols,shiny){
  g.save();g.translate(x,y);g.scale(s,s);
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,14,10,3,0,0,7);g.fill();
  g.fillStyle=shiny?'#fff6c8':'#f6eedb';g.strokeStyle=shiny?'#ffcf4a':OL;g.lineWidth=2.2;g.beginPath();g.ellipse(0,0,11,14,0,0,7);g.fill();g.stroke();
  [[-4,-5,0],[5,2,1],[-3,7,0],[4,-8,1]].forEach(([a,b,i])=>{g.fillStyle=cols[i]||cols[0];g.beginPath();g.arc(a,b,2.6,0,7);g.fill()});
  g.restore();
}
function paintSprites(root){
  const dpr=window.devicePixelRatio||1;
  root.querySelectorAll('canvas.spr').forEach(cv=>{
    const w=+cv.getAttribute('width'),h=+cv.getAttribute('height');
    if(!cv.dataset.sized){cv.style.width=w+'px';cv.style.height=h+'px';cv.width=w*dpr;cv.height=h*dpr;cv.dataset.sized='1'}
    const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
    if(cv.dataset.egg){drawEgg(g,w/2,h/2,w/40,cv.dataset.egg.split(','),cv.dataset.shiny==='1');return}
    if(!cv.dataset.cid)return;
    const c=byId(+cv.dataset.cid)||(R&&R.slot3&&R.slot3.c.id===+cv.dataset.cid?R.slot3.c:null);if(!c)return;
    drawCreature(g,c,w/2,h/2+3,w/50,0,{face:1,sex:c.sex});
  });
}
const spr=(c,size=64)=>`<canvas class="spr" width="${size}" height="${size}" data-cid="${c.id}" aria-label="${esc(SPECIES[c.species].name)} sprite"></canvas>`;
const typeChip=t=>`<span class="chip type" style="--c:${TYPES[t].color}">${TYPES[t].name}</span>`;
const typeChips=c=>typesOf(c).map(typeChip).join('')+(c.type2?'<span class="chip warn">Hybrid</span>':'');
const sexChip=c=>`<span class="chip sex ${c.sex==='F'?'f':'m'}" title="${c.sex==='F'?'Female: passes on her species':'Male: passes on most of his stats'}">${sexSym(c.sex)}</span>`;

function hpBar(c){const m=stats(c).hp,p=clamp(c.hp/m,0,1);return`<div class="bar hp ${p<.35?'low':''}" title="${c.hp}/${m} HP"><i style="width:${p*100}%"></i></div>`}
function statusText(c){

const abilType=c=>c.type2||c.type;
function supportText(c){return typesOf(c).map(t=>TYPES[t].support).join(' · ')}
function validGuns(){

}

function gunStatLine(g){
  const bits=[`${g.dmg}${g.pellets?'×'+g.pellets:''}${g.burst?'×'+g.burst:''}${g.ring?'×'+g.ring:''} dmg`,`${g.rate}/s`];
  if(g.pierce)bits.push(`pierce ${g.pierce}`);if(g.explode)bits.push('explodes');if(g.bounce)bits.push('bounces');if(g.homing)bits.push('homing');if(g.split)bits.push('splits');if(g.spin)bits.push('spins up');
  return bits.join(' · ');
}

function viewHideout(){
  const cards=Object.entries(STATIONS).map(([k,st])=>{
    const ws=S.stations[k].map(byId),on=!!ws[0],up=on&&!!ws[1];
    const opts=(slot)=>{
      const cur=ws[slot];
      const list=S.creatures.filter(c=>typesOf(c).includes(st.type)&&(!cur||c.id!==cur.id)&&!(slot===1&&ws[0]&&c.id===ws[0].id)&&!(slot===0&&ws[1]&&c.id===ws[1].id));
      return`<select id="st-${k}-${slot}" data-act="assign" data-k="${k}" data-slot="${slot}" ${slot===1&&!on?'disabled':''} aria-label="${st.name} worker ${slot+1}">
        <option value="">${cur?'Unassign':'Empty'}</option>${cur?`<option value="${cur.id}" selected>${esc(cur.name)} · Lv ${cur.level}</option>`:''}
        ${list.map(c=>{const w=whereIs(c);return`<option value="${c.id}">${esc(c.name)} · ${SPECIES[c.species].name} Lv ${c.level}${w.kind==='loadout'?' (from loadout)':w.kind==='station'?' (from '+STATIONS[w.key].name+')':''}</option>`}).join('')}</select>`;
    };
    const worker=(slot)=>{const c=ws[slot];return`<div class="worker"><span class="lab">${slot?'Upgrade':'Worker'}</span>${c?spr(c,48):`<canvas class="spr" width="48" height="48" aria-hidden="true"></canvas>`}${c?`<span class="status">Work Lv ${workLevel(c)}</span>`:''}${opts(slot)}</div>`};
    const have=S.creatures.filter(c=>typesOf(c).includes(st.type)).length;
    return`<section class="card station"><div class="station-head"><h3>${st.name}</h3>${on?(up?'<span class="chip good">Upgraded</span>':'<span class="chip good">Online</span>'):'<span class="chip bad">Offline</span>'}</div>
      <div class="row">Needs ${typeChip(st.type)} <span class="status">${TIER[TYPES[st.type].tier]} · you own ${have}</span></div>
      <p>${st.perk}</p><p class="status">Upgrade: ${st.up}</p>
      <div class="workers">${worker(0)}${worker(1)}</div></section>`;
  }).join('');
  const log=S.log.map(l=>`<li><span>Day ${l.day}</span>${esc(l.msg)}</li>`).join('');
  return`<div class="cols"><div class="grid">${cards}</div>
    <section class="card"><h2>Hideout log</h2><p class="hint">Each raid moves time forward one day. Every creature eats 1 food a day. Hybrids can staff either of their types' stations.</p>
    <div class="row"><button class="btn" data-act="wait">Wait one day</button></div><ul class="log">${log}</ul></section></div>`;
}

function creCard(c){

  const sellArmed=ui.sellId===c.id;
  const traits=c.proven?c.traits.map(t=>`<li class="${NEG_TRAITS.includes(t)?'neg':''}"><b>${TRAITS[t].name}</b> · ${TRAITS[t].desc}</li>`).join(''):'<li><b>Traits hidden</b> · revealed once proven</li>';
  return`<article class="cre">${spr(c,72)}<div class="cre-main">
    <div class="cre-name">${esc(c.name)} <span class="lv">Lv ${c.level}</span></div>
    <div class="status">${sp.name} · ${sp.blurb}</div>
    <div class="row" style="gap:4px">${sexChip(c)}${typeChips(c)}<span class="chip">${TIER[typeTier(c)]}</span>${c.origin==='bred'?`<span class="chip good">Bred · Gen ${c.gen}</span>`:(c.proven?'<span class="chip">Wild · Proven</span>':'<span class="chip warn">Wild · Unproven</span>')}</div>

function viewRoster(){
  const F=[['all','All'],['wild','Wild'],['bred','Bred'],['unproven','Unproven'],['f','Female'],['m','Male'],['hybrid','Hybrids'],['idle','Idle']];
  let list=S.creatures.slice();
  const f=ui.filter;

function viewNursery(){
  const on=online('nursery');

  const opt=(list,sel)=>`<option value="">Choose</option>`+list.map(c=>`<option value="${c.id}" ${String(c.id)===String(sel)?'selected':''}>${esc(c.name)} · ${SPECIES[c.species].name}${c.type2?' (hybrid)':''} Lv ${c.level}</option>`).join('');
  const a=byId(+ui.mom),b=byId(+ui.dad);
  let pred='';
  if(a&&b){
    const mut=upgraded('nursery')?2:1;
    const h=hybridChance(a,b);
    const genes=Object.entries(GENES).map(([k,l])=>{const lo=clamp(Math.min(a.genes[k],b.genes[k])-mut,1,10),hi=clamp(Math.max(a.genes[k],b.genes[k])+mut,1,10);
      return`<span>${l}</span><div class="g"><i style="left:${(lo-1)*10}%;width:${(hi-lo+1)*10}%"></i><b style="left:calc(${(b.genes[k]-.5)*10}% - 2px)"></b></div><span>${lo}–${hi}</span>`}).join('');
    const tpool=[...new Set([...b.traits,...a.traits])].map(t=>TRAITS[t].name).join(', ');
    pred=`<div class="slot"><div class="slot-label">Likely offspring</div>
      <p><b style="font-family:var(--display)">${SPECIES[a.species].name}</b> (from the mother)${h.id?` · <span style="color:var(--gold)">${Math.round(h.p*100)}% chance of a ${SPECIES[h.id].name} hybrid (${TYPES[a.type].name}/${TYPES[b.type].name})</span>`:''}</p>
      <div class="genes">${genes}</div>

  }
  const eggs=S.eggs.map(e=>`<div class="slot"><div class="slot-body"><canvas class="spr" width="56" height="56" data-egg="${e.cols.join(',')}" data-shiny="${e.hybrid?1:0}" aria-label="Egg"></canvas><div><div class="nm">${e.hybrid?'Shimmering egg':'Egg'} of ${esc(e.parents)}</div><p class="status">Hatches in ${e.days} day${e.days===1?'':'s'}${on?'':' (paused)'}</p></div></div></div>`).join('');

  const combos=HYBRIDS.map(h=>`<li><b>${h.name}</b>: ${TYPES[h.types[0]].name} + ${TYPES[h.types[1]].name}</li>`).join('');
  return`<div class="cols"><section class="card"><h2>Nursery</h2>
    ${on?`<p class="hint">Pair a proven female and a proven male. The mother decides the species. The father passes on most of the stats. Costs 20 coin and 3 food.</p>`:`<div class="risk"><b>Offline.</b> Assign a Warden to the Nursery in the Hideout tab to start breeding. Wardens are very rare raid finds. You can spawn one in the Test Lab.</div>`}
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))">
      <label class="field">Mother ♀<select id="breedMom" data-act="mom">${opt(moms,ui.mom)}</select></label>
      <label class="field">Father ♂<select id="breedDad" data-act="dad">${opt(dads,ui.dad)}</select></label>
    </div>
    ${pred}
    <div class="row"><button class="btn primary" data-act="breed" ${can?'':'disabled'}>Lay an egg</button><span class="status">Incubator ${S.eggs.length}/${eggCap()}</span></div>
    <p class="status">Only proven creatures can breed. Unproven wild catches must survive one more raid first.</p>
  </section>
  <section class="card"><h2>Incubator</h2>${eggs||'<p class="empty">No eggs yet.</p>'}
    <h3>Known hybrid pairings</h3><p class="hint">Rare when the parents' types match a pairing, in either order. Hybrids have both types, +20% HP and attack, and use the father's type for their ability.</p><ul class="plain">${combos}</ul></section></div>`;
}

/* ================= Actions ================= */
function act(a,d){
  switch(a){
    case'tab':ui.tab=d.k;ui.sellId=null;ui.resetArm=false;renderAll();window.scrollTo(0,0);break;
    case'filter':ui.filter=d.k;renderMain();break;
    case'close':closeModal();break;
    case'choose':openChooser(+d.slot);break;
    case'pickslot':{const c=byId(+d.id);unplace(c);S.loadout.slots[+d.slot]=c.id;closeModal();save();renderAll();break}
    case'clearslot':S.loadout.slots[+d.slot]=null;closeModal();save();renderAll();break;
    case'deploy':startRaid('raid');break;
    case'scav':startRaid('scav');break;
    case'arena':startRaid('arena');break;
    case'wait':processDay();save();renderAll();break;
    case'feed':{const c=byId(+d.id);if(S.food<1)break;S.food--;c.bond=Math.min(100,c.bond+10);c.hp=Math.min(stats(c).hp,c.hp+Math.round(stats(c).hp*.2));save();renderAll();break}
    case'sell':{const c=byId(+d.id);if(ui.sellId!==c.id){ui.sellId=c.id;renderMain();break}
      S.coin+=sellValue(c);unplace(c);S.creatures=S.creatures.filter(x=>x!==c);ui.sellId=null;addLog(`Sold ${c.name} for ${sellValue(c)} coin.`);save();renderAll();break}
    case'breed':breed();break;
    case'craft':{const g=GUNS[d.k],cost=GUN_COST[g.tier];if(S.coin<cost.coin||S.ore<cost.ore)break;S.coin-=cost.coin;S.ore-=cost.ore;S.guns[d.k]=(S.guns[d.k]||0)+1;addLog(`The Forge made a ${g.name}.`);save();renderAll();break}
    case'sellgun':{const g=GUNS[d.k];if(!(S.guns[d.k]>0))break;S.guns[d.k]--;S.coin+=GUN_VALUE[g.tier];validGuns();save();renderAll();break}
    case'gilded':if(S.coin>=25&&S.ore>=2){S.coin-=25;S.ore-=2;S.cages.gilded++;save();renderAll()}break;
    case'buy-food':if(S.coin>=5){S.coin-=5;S.food++;save();renderAll()}break;
    case'buy-food5':if(S.coin>=22){S.coin-=22;S.food+=5;save();renderAll()}break;
    case'buy-cage':if(S.coin>=15){S.coin-=15;S.cages.basic++;save();renderAll()}break;
    case'sell-ore':if(S.ore>0){S.ore--;S.coin+=8;save();renderAll()}break;
    case'lab-spawn':{const L=ui.lab;const lv=clamp(+L.level||1,1,30);
      let traits=null;if(L.t1||L.t2){traits=[];if(L.t1)traits.push(L.t1);if(L.t2&&L.t2!==L.t1)traits.push(L.t2);while(traits.length<2)traits.push(rollTraits(1,traits)[0])}
      const c=makeCreature(L.species,L.origin,lv,{proven:L.proven,sex:L.sex==='R'?null:L.sex,traits,genes:L.max?{vig:10,pow:10,swf:10,hst:10,tmp:10}:undefined,bond:L.origin==='wild'?20:100,captureRaid:L.origin==='wild'&&!L.proven?S.stats.raids:-1});
      S.creatures.push(c);addLog(`Test Lab: added ${c.name}, a ${sexSym(c.sex)} ${L.origin} ${SPECIES[c.species].name} at Lv ${lv}.`);save();renderAll();break}
    case'lab-res':{const k=d.k;if(k==='coin')S.coin+=200;if(k==='food')S.food+=20;if(k==='ore')S.ore+=15;if(k==='cage')S.cages.basic+=3;if(k==='gilded')S.cages.gilded+=3;if(k==='guns')GUN_IDS.forEach(g=>{if(g!=='pistol')S.guns[g]=Math.max(1,S.guns[g]||0)});save();renderAll();break}
    case'lab-heal':S.creatures.forEach(c=>c.hp=stats(c).hp);save();renderAll();break;
    case'lab-prove':S.creatures.forEach(c=>c.proven=true);save();renderAll();break;
    case'lab-xp':S.loadout.slots.map(byId).filter(Boolean).forEach(c=>{c.level=Math.min(30,c.level+1);c.hp=stats(c).hp});save();renderAll();break;

/* ================= Raid engine ================= */
const TS=32,RW=15,RH=11,CW=RW+6,CH=RH+6,FLOORS=3;
let R=null,raf=0;
const keys=new Set();
const touch={move:null,aim:null};

function rollWildSpecies(floor,lair){
  const rareMul=(floor===1?1:floor===2?2:3.5)*(lair?4:1);
  const type=wpick(TYPE_IDS,t=>TYPES[t].weight*(TYPES[t].tier>=3?rareMul:1));
  return wpick(speciesOf(type),k=>SPECIES[k].w*(SPECIES[k].w===1?(floor>=2?2:1):1));
}
function genMap(floor,arena){
  const G=arena?1:4,rooms=[],grid={};const key=(x,y)=>x+','+y;
  const add=(gx,gy)=>{const r={gx,gy,ox:gx*CW+3,oy:gy*CH+3,links:[],kind:'fight',spawned:false,cleared:false,locked:false,visited:false,doors:[],idx:rooms.length};rooms.push(r);grid[key(gx,gy)]=r;return r};
  const start=add(arena?0:ri(0,3),arena?0:ri(0,3));
  const target=arena?1:8+floor;let guard=0;
  while(rooms.length<target&&guard++<1000){const a=pick(rooms);const[dx,dy]=pick([[1,0],[-1,0],[0,1],[0,-1]]);const nx=a.gx+dx,ny=a.gy+dy;
    if(nx<0||ny<0||nx>=G||ny>=G||grid[key(nx,ny)])continue;const b=add(nx,ny);a.links.push(b);b.links.push(a)}
  start.dist=0;const q=[start];while(q.length){const r=q.shift();for(const n of r.links)if(n.dist==null){n.dist=r.dist+1;q.push(n)}}
  start.kind=arena?'arena':'start';start.cleared=true;start.visited=true;
  if(!arena){
    const others=rooms.filter(r=>r!==start).sort((a,b)=>b.dist-a.dist);let i=0;const set=k=>{if(others[i])others[i++].kind=k};
    if(floor<FLOORS){set('stairs');set('gate')}else{set('rift');set('cliff')}
    if(floor>=2)set('lair');
    const rest=others.slice(i).sort(()=>Math.random()-.5);let j=0;const put=k=>{if(rest[j])rest[j++].kind=k};
    put('chest');put('chest');
    if(Math.random()<.75)put('shop');
    if(Math.random()<(floor===1?.35:.7))put('shrine');
    const famW={husk:3,bat:2,crawler:2.5,totem:1.6};
    for(const r of rooms){
      if(['start','shop','shrine'].includes(r.kind))continue;
      const base={fight:[3,4],chest:[1,2],stairs:[3,4],gate:[2,3],rift:[3,4],cliff:[2,3],lair:[3,4]}[r.kind];
      const n=ri(base[0],base[1])+(floor-1);
      const wildChance=floor===3?.28:.22;
      const wc=r.kind==='lair'?1+(Math.random()<.3?1:0):(Math.random()<wildChance?1:0);
      const foes=[];if(r.kind==='lair')foes.push('brute');
      while(foes.length<n-wc)foes.push(wpick(Object.keys(famW),k=>famW[k]));
      r.plan={foes,wilds:Array.from({length:wc},()=>rollWildSpecies(floor,r.kind==='lair'))};
    }
  }
  const W=G*CW,H=G*CH,tiles=new Uint8Array(W*H),doorOwner=new Map();
  for(const r of rooms)for(let j=0;j<RH;j++)for(let i=0;i<RW;i++)tiles[(r.oy+j)*W+r.ox+i]=1;
  const done=new Set();
  for(const a of rooms)for(const b of a.links){
    const k=Math.min(a.idx,b.idx)+'-'+Math.max(a.idx,b.idx);if(done.has(k))continue;done.add(k);
    const[p,q2]=(a.gx<b.gx||a.gy<b.gy)?[a,b]:[b,a];
    if(p.gy===q2.gy){const cy=p.oy+(RH>>1);
      for(let x=p.ox+RW;x<q2.ox;x++)for(let y=cy-1;y<=cy+1;y++)tiles[y*W+x]=1;
      for(let y=cy-1;y<=cy+1;y++){const i1=y*W+p.ox+RW,i2=y*W+q2.ox-1;tiles[i1]=3;tiles[i2]=3;doorOwner.set(i1,p);doorOwner.set(i2,q2);p.doors.push(i1);q2.doors.push(i2)}
    }else{const cx=p.ox+(RW>>1);
      for(let y=p.oy+RH;y<q2.oy;y++)for(let x=cx-1;x<=cx+1;x++)tiles[y*W+x]=1;
      for(let x=cx-1;x<=cx+1;x++){const i1=(p.oy+RH)*W+x,i2=(q2.oy-1)*W+x;tiles[i1]=3;tiles[i2]=3;doorOwner.set(i1,p);doorOwner.set(i2,q2);p.doors.push(i1);q2.doors.push(i2)}
    }
  }
  for(const r of rooms){
    if(['fight','lair','chest','arena'].includes(r.kind)){
      const n=r.kind==='arena'?4:ri(0,3);
      for(let k=0;k<n;k++){const px=r.ox+ri(2,RW-4),py=r.oy+ri(2,RH-4);
        if(Math.abs(px+1-(r.ox+RW/2))<3.5&&Math.abs(py+1-(r.oy+RH/2))<3)continue;
        for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)tiles[(py+dy)*W+px+dx]=2}
    }
    r.cx=(r.ox+RW/2)*TS;r.cy=(r.oy+RH/2)*TS;
    if(r.kind==='chest'||r.kind==='lair')r.chest={x:r.cx,y:r.cy,open:false};
  }
  return{G,W,H,tiles,doorOwner,rooms,grid,start,floor,arena:!!arena};
}
function solidAt(M,tx,ty){if(tx<0||ty<0||tx>=M.W||ty>=M.H)return true;const i=ty*M.W+tx,t=M.tiles[i];if(t===1)return false;if(t===3)return M.doorOwner.get(i).locked;return true}
function hitsWall(x,y,r){const M=R.map;const x0=Math.floor((x-r)/TS),x1=Math.floor((x+r)/TS),y0=Math.floor((y-r)/TS),y1=Math.floor((y+r)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solidAt(M,tx,ty))return true;return false}
function moveEnt(e,dx,dy){let moved=false;if(!hitsWall(e.x+dx,e.y,e.r)){e.x+=dx;moved=true}if(!hitsWall(e.x,e.y+dy,e.r)){e.y+=dy;moved=true}return moved}
function roomAt(x,y,m=0){
  const M=R.map,gx=Math.floor(x/TS/CW),gy=Math.floor(y/TS/CH),r=M.grid[gx+','+gy];if(!r)return null;
  if(x>=r.ox*TS+m&&x<=(r.ox+RW)*TS-m&&y>=r.oy*TS+m&&y<=(r.oy+RH)*TS-m)return r;return null;
}
function renderMapCanvas(M){
  const c=document.createElement('canvas');c.width=M.W*TS;c.height=M.H*TS;const g=c.getContext('2d');
  const pals={1:{a:'#2c4a55',b:'#284450',fl:'#3a6070',wall:'#336b66',top:'#5fb3a0',edge:'#142630'},2:{a:'#3a2a5e',b:'#33255a',fl:'#4a3878',wall:'#5d43a3',top:'#8d6fe0',edge:'#1d1438'},3:{a:'#4a2a2a',b:'#432626',fl:'#5e3434',wall:'#8a3a3a',top:'#ff8a5c',edge:'#240f0f'}};
  const pal=M.arena?{a:'#4a2f3f',b:'#43293a',fl:'#5e3c50',wall:'#7a3f5a',top:'#ff8fb1',edge:'#24101c'}:pals[M.floor];
  g.fillStyle='#0d0a1c';g.fillRect(0,0,c.width,c.height);
  const walk=(x,y)=>{if(x<0||y<0||x>=M.W||y>=M.H)return false;const t=M.tiles[y*M.W+x];return t===1||t===3};
  for(let y=0;y<M.H;y++)for(let x=0;x<M.W;x++){
    if(walk(x,y)){g.fillStyle=(x+y)%2?pal.a:pal.b;g.fillRect(x*TS,y*TS,TS,TS);
      if(Math.random()<.18){g.fillStyle=pal.fl;g.fillRect(x*TS+ri(4,24),y*TS+ri(4,24),ri(2,5),ri(2,4))}}
  }
  for(let y=0;y<M.H;y++)for(let x=0;x<M.W;x++){
    if(walk(x,y))continue;
    let near=false;for(let dy=-1;dy<=1&&!near;dy++)for(let dx=-1;dx<=1;dx++)if(walk(x+dx,y+dy)){near=true;break}
    if(!near)continue;
    g.fillStyle=pal.wall;g.fillRect(x*TS,y*TS,TS,TS);
    g.fillStyle=pal.top;g.fillRect(x*TS,y*TS,TS,6);
    g.fillStyle=pal.edge;g.fillRect(x*TS,y*TS+TS-4,TS,4);
    if(walk(x,y+1)){g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x*TS,(y+1)*TS,TS,6)}
    g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x*TS+(y%2?4:18),y*TS+12,10,2);
  }
  return c;
}

/* ---------- raid setup ---------- */
function makeComp(c){
  const st=stats(c);
  return{c,st,x:R.p.x+rnd(-30,30),y:R.p.y+rnd(-30,30),r:12,hp:Math.max(1,Math.min(c.hp,st.hp)),maxHp:st.hp,atk:st.atk,spd:st.spd,obey:st.obey,
    cd:rnd(.3,1),abil:0,downed:false,rev:0,sulk:0,obeyCheck:rnd(3,6),face:1,flash:0,dash:0,xpGain:0,stuck:0,seed:Math.random()*9};

    comps:[null,null],slot3:null,enemies:[],bullets:[],fields:[],floats:[],fx:[],items:[],trail:[],
    bag:{coin:0,ore:0,food:0},cages:{basic:0,gilded:0},guns:['pistol',null],active:0,spin:0,burst:[],
    buffs:{},leechAcc:0,aim:0,firing:false,mouse:null,shield:0,prism:0,taunt:0,tauntEnt:null,
    msg:'',msgT:0,prompt:'',ext:0,stairT:0,cur:M.start,paused:false,over:false,last:0,saved:{},shops:{},taken:[]};
  if(mode==='scav'){R.cages.basic=1;S.stats.raids++;R.id=S.stats.raids;msg('Scav run: a loaner pistol and one cage. Nothing of yours is at risk.')}

    else{

  resize();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
const B=k=>R.buffs[k]||0;

function partyHas(type){return R.comps.some(m=>m&&!m.downed&&typesOf(m.c).includes(type))||(R.slot3&&typesOf(R.slot3.c).includes(type))}

const capRadius=()=>95*(1+.4*B('cage'));
const tierFor=f=>clamp(f-1,0,2);

/* ---------- spawning ---------- */
function spawnPos(r){
  for(let i=0;i<40;i++){const x=(r.ox+rnd(1.5,RW-1.5))*TS,y=(r.oy+rnd(1.5,RH-1.5))*TS;if(!hitsWall(x,y,18)&&Math.hypot(x-R.p.x,y-R.p.y)>180)return{x,y}}

}
function baseEnemy(pos,room){return{x:pos.x,y:pos.y,room,stun:0,slow:0,face:1,flash:0,hitCd:0,wind:0,rot:Math.random()*6,phase:0,queue:[],chargeT:0,strafe:pick([-1,1]),seed:Math.random()*9}}
function spawnWild(pos,species,room,level){
  const f=R.map.floor;const lv=level||(f===1?ri(2,4):f===2?ri(4,6):ri(6,9));
  const c=makeCreature(species,'wild',lv,{floor:f,bond:5});const st=stats(c);

function spawnFoe(pos,fam,tier,room){

function enterRoom(r){
  r.visited=true;if(r.spawned||!r.plan)return;r.spawned=true;

/* ---------- combat helpers ---------- */
function hurtEnemy(e,dmg,quiet,src){
  if(e.hp<=0)return;e.hp-=dmg;e.flash=.08;
  if(src==='p'&&B('leech')){R.leechAcc+=dmg*B('leech');while(R.leechAcc>=25){R.leechAcc-=25;healPlayer(1)}}
  if(src&&src.c&&src.st.vamp)src.hp=Math.min(src.maxHp,src.hp+dmg*src.st.vamp);
  if(!quiet)float(e.x+rnd(-6,6),e.y-e.r-8,Math.round(dmg),'#ffe38a');
  if(e.kind==='wild'&&e.hp>0&&e.hp/e.maxHp<=.5&&!e.weakShown){e.weakShown=true;float(e.x,e.y-e.r-24,'Weak! Get close and cage it','#ffcf4a')}
}
function hurtPlayer(d,slow){
  const p=R.p;if(S.settings.god||p.roll>0||R.shield>0||p.inv>0)return;
  if(R.sup.has('crystal')&&Math.random()<.2){float(p.x,p.y-24,'Blocked','#ff8fe0');p.inv=.2;return}
  p.hp-=d;p.inv=.5;p.hurt=.15;if(slow)p.slow=slow;R.shake=.18;
  if(p.hp<=0)playerDown();
}
function hurtComp(m,d){
  if(m.downed)return;
  d*=m.st.taken*Math.pow(.8,B('ptough'));if(R.taunt>0&&R.tauntEnt===m)d*=.5;
  m.hp-=d;m.flash=.08;

}
const healPlayer=a=>{R.p.hp=Math.min(R.p.maxHp,R.p.hp+a)};
function playerDown(){

function doRoll(){

function useCage(){

/* ---------- update ---------- */
function moveVec(){
  let mx=0,my=0;
  if(keys.has('KeyW')||keys.has('ArrowUp'))my-=1;if(keys.has('KeyS')||keys.has('ArrowDown'))my+=1;
  if(keys.has('KeyA')||keys.has('ArrowLeft'))mx-=1;if(keys.has('KeyD')||keys.has('ArrowRight'))mx+=1;
  if(touch.move){const dx=touch.move.x-touch.move.ox,dy=touch.move.y-touch.move.oy,l=Math.hypot(dx,dy);if(l>6){const k=Math.min(1,l/50)/l;mx=dx*k;my=dy*k}}
  else{const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}}
  return{mx,my};
}
function fireGun(){
  const p=R.p,id=R.guns[R.active];if(!id)return;const g=GUNS[id];
  const dm=g.dmg*(1+.15*B('dmg'))*(R.sup.has('ember')?1.1:1);
  const o={col:g.col,r:g.r||4,pierce:(g.pierce||0)+B('pierce'),life:g.life||1.2,bounce:g.bounce,explode:g.explode,split:g.split,homing:g.homing,src:'p'};
  const mx=p.x+Math.cos(R.aim)*16,my=p.y+Math.sin(R.aim)*16;
  const one=(ang)=>shoot('p',mx,my,ang,g.speed*rnd(.94,1.04),dm,o);
  if(g.ring){for(let k=0;k<g.ring;k++)one(R.aim+k/g.ring*Math.PI*2)}
  else if(g.burst){for(let k=0;k<g.burst;k++)R.burst.push({t:k*g.burstGap,f:()=>one(R.aim+rnd(-g.spread,g.spread))})}
  else for(let k=0;k<(g.pellets||1);k++)one(R.aim+rnd(-(g.spread||0),g.spread||0));
  let rate=g.rate*(1+.15*B('rate'));
  if(g.spin)rate*=.3+.7*R.spin;
  p.fireCd=1/rate;
}
function update(dt){
  R.t+=dt;const p=R.p;
  if(R.mode!=='arena'&&!S.settings.noTimer){R.time-=dt;if(R.time<=0){endRaid('collapse');return}}
  R.shield=Math.max(0,R.shield-dt);R.prism=Math.max(0,R.prism-dt);R.taunt=Math.max(0,R.taunt-dt);R.shake=Math.max(0,(R.shake||0)-dt);
  if(R.msgT>0)R.msgT-=dt;
  if(touch.aim){const dx=touch.aim.x-touch.aim.ox,dy=touch.aim.y-touch.aim.oy;if(Math.hypot(dx,dy)>12){R.aim=Math.atan2(dy,dx);R.firing=true}else R.firing=false}
  else if(R.mouse){const s=R.scale;const wx=(R.mouse.x-R.vw/2)/s+R.camx,wy=(R.mouse.y-R.vh/2)/s+R.camy;R.aim=Math.atan2(wy-p.y,wx-p.x)}
  p.rollCd-=dt;p.inv=Math.max(0,p.inv-dt);p.hurt=Math.max(0,p.hurt-dt);p.slow=Math.max(0,p.slow-dt);p.fireCd-=dt;
  if(R.sup.has('tide'))healPlayer(dt);
  if(p.roll>0){p.roll-=dt;moveEnt(p,p.rvx*dt,p.rvy*dt)}
  else{const{mx,my}=moveVec();const sp=200*(R.sup.has('gale')?1.1:1)*(1+.12*B('speed'))*(p.slow>0?.6:1);moveEnt(p,mx*sp*dt,my*sp*dt);if(!R.mouse&&!touch.aim&&(mx||my))R.aim=Math.atan2(my,mx)}
  if(!R.trail.length||dist(R.trail[0],p)>12){R.trail.unshift({x:p.x,y:p.y});if(R.trail.length>60)R.trail.pop()}
  const gun=R.guns[R.active]?GUNS[R.guns[R.active]]:null;
  if(gun&&gun.spin)R.spin=R.firing?Math.min(1,R.spin+dt):Math.max(0,R.spin-dt*2);
  for(let i=R.burst.length-1;i>=0;i--){R.burst[i].t-=dt;if(R.burst[i].t<=0){R.burst[i].f();R.burst.splice(i,1)}}
  if(R.firing&&p.fireCd<=0&&p.roll<=0&&!R.burst.length)fireGun();
  R.comps.forEach((m,i)=>m&&updComp(m,dt,i));
  R.enemies.forEach(e=>updEnemy(e,dt));
  updBullets(dt);if(R.over)return;
  R.fields.forEach(f=>{f.t-=dt;R.enemies.forEach(e=>{if(dist(e,f)<f.r+e.r){e.slow=.3;hurtEnemy(e,f.dps*dt,true)}})});R.fields=R.fields.filter(f=>f.t>0);
  for(const e of R.enemies)if(e.hp<=0&&!e.gone){e.gone=true;onEnemyDeath(e)}
  R.enemies=R.enemies.filter(e=>!e.gone);
  const r=roomAt(p.x,p.y,22);
  if(r){R.cur=r;if(!r.spawned&&r.plan)enterRoom(r);r.visited=true}
  else{const r2=roomAt(p.x,p.y,0);if(r2)R.cur=r2}
  R.map.rooms.forEach(rm=>{if(rm.locked&&!R.enemies.some(e=>e.room===rm)){rm.locked=false;rm.cleared=true;msg('Room clear. The doors open.')}else if(rm.spawned&&!rm.locked)rm.cleared=true});
  R.map.rooms.forEach(rm=>{if(rm.chest&&!rm.chest.open&&!rm.locked&&dist(p,rm.chest)<34)openChest(rm)});
  for(let i=R.items.length-1;i>=0;i--){const it=R.items[i];if(it.kind==='buff'&&dist(it,p)<26){R.items.splice(i,1);applyBuff(it.id)}}
  objectives(dt);
  R.floats.forEach(f=>{f.t-=dt*.9;f.y-=24*dt});R.floats=R.floats.filter(f=>f.t>0);
  R.fx.forEach(f=>f.t-=dt);R.fx=R.fx.filter(f=>f.t>0);
}
function updComp(m,dt,idx){
  const p=R.p;m.flash=Math.max(0,m.flash-dt);
  if(m.downed){
    if(dist(m,p)<48){m.rev+=dt;if(m.rev>=1.5){m.downed=false;m.hp=Math.round(m.maxHp*.35);m.rev=0;float(m.x,m.y-22,'Revived','#5de8b0')}}else m.rev=Math.max(0,m.rev-dt);
    return;
  }
  m.abil=Math.max(0,m.abil-dt);m.cd-=dt;
  if(m.st.regen)m.hp=Math.min(m.maxHp,m.hp+m.maxHp*m.st.regen*dt);
  if(typesOf(m.c).includes('tide'))healPlayer(1.2*dt);
  if(m.obey<1&&m.sulk<=0){m.obeyCheck-=dt;if(m.obeyCheck<=0){m.obeyCheck=rnd(4,6);if(Math.random()>m.obey+.15){m.sulk=1.6;float(m.x,m.y-24,'?','#ffcf4a')}}}
  m.sulk=Math.max(0,m.sulk-dt);
  if(m.dash>0){
    m.dash-=dt;moveEnt(m,m.dvx*dt,m.dvy*dt);
    R.enemies.forEach(e=>{if(e.hp>0&&!m.dashHit.has(e)&&dist(e,m)<e.r+m.r+6){m.dashHit.add(e);hurtEnemy(e,m.dashDmg*critMul(m.st),false,m);const a=Math.atan2(e.y-m.y,e.x-m.x);if(e.spd>0)moveEnt(e,Math.cos(a)*24,Math.sin(a)*24)}});
    return;
  }
  // always follow the player along their trail
  const tr=R.trail,want=tr[Math.min(tr.length-1,(idx+1)*4)]||p;
  const dx=want.x-m.x,dy=want.y-m.y,l=Math.hypot(dx,dy);
  if(l>14){const sp=Math.max(m.spd,215)*(l>110?1.6:1);const st=Math.min(l,sp*dt);if(!moveEnt(m,dx/l*st,dy/l*st))m.stuck+=dt;else m.stuck=Math.max(0,m.stuck-dt)}
  if(dist(m,p)>320||m.stuck>.8){m.x=p.x+rnd(-18,18);m.y=p.y+rnd(-6,18);m.stuck=0}
  if(Math.abs(dx)>2)m.face=dx<0?-1:1;
  if(m.sulk>0)return;
  const tgt=nearestEnemy(m,340,true);if(!tgt)return;
  const a=Math.atan2(tgt.y-m.y,tgt.x-m.x),T=m.c.type,atk=m.atk*critMul(m.st)*(1+.2*B('pdmg')),rate=m.st.rate,reach=m.st.reach;
  m.face=Math.cos(a)<0?-1:1;
  if(m.cd>0)return;
  const col=SPECIES[m.c.species].col,o={col,src:m,life:1.3*reach};
  if(T==='gale'||T==='warden'){
    const d=dist(m,tgt);
    if(d<(T==='gale'?190:120)&&dist(tgt,p)<260){const sp=T==='gale'?560:420;m.dash=Math.min(.32,d/sp+.05);m.dvx=Math.cos(a)*sp;m.dvy=Math.sin(a)*sp;m.dashHit=new Set();m.dashDmg=T==='gale'?atk:atk*.9;m.cd=(T==='gale'?1.3:1.6)/rate}
    return;
  }
  const sp=reach;
  if(T==='ember'){shoot('p',m.x,m.y,a,380*sp,atk,{...o,r:5});m.cd=1.1/rate}
  else if(T==='fungal'){shoot('p',m.x,m.y,a,260*sp,atk*.8,{...o,r:6,slow:1.2});m.cd=1.3/rate}
  else if(T==='tide'){shoot('p',m.x,m.y,a,280*sp,atk*.7,{...o,r:6});m.cd=1.2/rate}
  else if(T==='echo'){shoot('p',m.x,m.y,a-.06,420*sp,atk*.6,{...o,r:4});shoot('p',m.x,m.y,a+.06,420*sp,atk*.6,{...o,r:4});m.cd=1/rate}
  else if(T==='crystal'){[-.25,0,.25].forEach(k=>shoot('p',m.x,m.y,a+k,340*sp,atk*.5,{...o,r:4}));m.cd=1.4/rate}
}
function updEnemy(e,dt){
  e.flash=Math.max(0,e.flash-dt);e.hitCd-=dt;
  for(let i=e.queue.length-1;i>=0;i--){const q=e.queue[i];q.t-=dt;if(q.t<=0){e.queue.splice(i,1);if(e.hp>0)q.f()}}
  if(e.stun>0){e.stun-=dt;return}
  e.slow=Math.max(0,e.slow-dt);
  const tgt=pickTarget(e);const dx=tgt.x-e.x,dy=tgt.y-e.y,d=Math.hypot(dx,dy)||1;
  const sp=e.spd*(e.slow>0?.5:1),a=Math.atan2(dy,dx);

/* ---------- end of raid ---------- */
function endRaid(outcome,via){
  if(!R||R.over)return;
  R.over=true;cancelAnimationFrame(raf);
  keys.clear();touch.move=touch.aim=null;
  if(R.mode==='arena'){
    R.comps.forEach(m=>{if(m&&R.saved[m.c.id]!=null)m.c.hp=R.saved[m.c.id]});
    if(R.slot3&&R.saved[R.slot3.c.id]!=null)R.slot3.c.hp=R.saved[R.slot3.c.id];
    let kept='';
    const caught=[R.slot3&&R.slot3.c,...R.comps.map(m=>m&&m.c)].filter(c=>c&&c.captureRaid==='arena');
    caught.forEach(c=>{c.captureRaid=S.stats.raids;if(S.settings.keepArena){S.creatures.push(c);kept+=c.name+' '}});
    exitRaid();
    openModal(`<h2 class="res-title">Left the arena</h2><p class="hint">Your creatures are back at their pre-arena health.${kept?' Kept: '+esc(kept)+'(unproven).':''}</p><div class="row"><button class="btn primary" data-act="close">Back to the lab</button></div>`);
    save();return;
  }
  const L={home:[],lost:[],caught:[],proven:[],levels:[],loot:[],notes:[]};
  R.comps.forEach(m=>{if(m)m.c.hp=m.downed?0:Math.round(m.hp)});
  const party=R.comps.filter(Boolean);
  const vault=R.mode!=='scav'&&online('vault'),vault2=R.mode!=='scav'&&upgraded('vault');
  const isNew=c=>!S.creatures.includes(c);
  const held=R.guns.filter(g=>g&&g!=='pistol');
  if(outcome==='extract'){
    S.stats.extracts++;
    const coinMul=1+.15*party.filter(m=>!m.downed&&m.c.traits.includes('hoard')).length;
    const coin=Math.round(R.bag.coin*coinMul),food=R.bag.food+(R.sup.has('fungal')?2:0);
    S.coin+=coin;S.ore+=R.bag.ore;S.food+=food;
    held.forEach(g=>S.guns[g]=(S.guns[g]||0)+1);
    S.cages.basic+=R.mode==='scav'?0:R.cages.basic;S.cages.gilded+=R.cages.gilded;
    L.loot.push(`+${coin} coin`,`+${R.bag.ore} ore`,`+${food} food`);
    held.forEach(g=>L.loot.push(`${GUNS[g].name}${R.taken.includes(g)?'':' (new)'}`));
    R.taken.forEach(g=>{if(!held.includes(g))L.lost.push(`${GUNS[g].name} (left in the dungeon)`)});
    const handle=(c,downed,xp)=>{
      if(downed){if(isNew(c))L.lost.push(`${c.name} (new catch, never revived)`);else{L.lost.push(`${c.name} (never revived)`);killCreature(c)}return}
      if(isNew(c)){S.creatures.push(c);S.stats.captures++;L.caught.push(`${c.name}, a wild ${sexSym(c.sex)} ${SPECIES[c.species].name} (Lv ${c.level})`);return}
      c.raids++;const ups=gainXp(c,xp);if(ups)L.levels.push(`${c.name} reached Lv ${c.level}`);
      if(!c.proven&&c.captureRaid>=0&&c.captureRaid<R.id){c.proven=true;L.proven.push(`${c.name} is proven. Traits: ${c.traits.map(t=>TRAITS[t].name).join(', ')}`)}
      L.home.push(c.name);
    };
    party.forEach(m=>handle(m.c,m.downed,25+m.xpGain));
    if(R.slot3)handle(R.slot3.c,false,10);
  }else{
    S.stats.deaths++;
    L.notes.push(outcome==='collapse'?'The dungeon collapsed around you.':'You were knocked out.');
    party.forEach(m=>{if(isNew(m.c))L.lost.push(`${m.c.name} (new catch)`);else{L.lost.push(m.c.name);killCreature(m.c)}});
    if(R.slot3){
      const c=R.slot3.c;
      if(vault){if(isNew(c)){S.creatures.push(c);S.stats.captures++;L.caught.push(`${c.name} (saved by the Vault)`)}else L.home.push(`${c.name} (saved by the Vault)`)}
      else{if(isNew(c))L.lost.push(`${c.name} (new catch)`);else{L.lost.push(c.name);killCreature(c)}}
    }
    if(vault2){held.forEach(g=>{S.guns[g]=(S.guns[g]||0)+1;L.home.push(`${GUNS[g].name} (saved by the Vault)`)})}
    else{held.forEach(g=>L.lost.push(GUNS[g].name));R.taken.forEach(g=>{if(!held.includes(g))L.lost.push(GUNS[g].name)})}
    const lostLoot=[R.bag.coin&&R.bag.coin+' coin',R.bag.ore&&R.bag.ore+' ore',R.bag.food&&R.bag.food+' food'].filter(Boolean);
    if(lostLoot.length)L.lost.push('Backpack: '+lostLoot.join(', '));
    const cg=R.mode==='scav'?0:R.cages.basic+R.cages.gilded;if(cg)L.lost.push(`${cg} cage${cg>1?'s':''}`);
  }

  addLog(`${R.mode==='scav'?'Scav run':'Raid'}: ${title.toLowerCase()} on floor ${R.map.floor}.`+(L.caught.length?' Caught '+L.caught.length+'.':'')+(L.lost.length&&outcome!=='extract'?' Lost: '+L.lost.join(', ')+'.':''));
  processDay();save();exitRaid();
  const sec=(h,arr,col)=>arr.length?`<h3 ${col?`style="color:${col}"`:''}>${h}</h3><ul class="plain">${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
  openModal(`<h2 class="res-title ${outcome==='extract'?'win':'lose'}">${title}</h2>${L.notes.map(n=>`<p>${esc(n)}</p>`).join('')}
    ${sec('Caught',L.caught,'var(--gold)')}${sec('Proven',L.proven,'var(--mint)')}${sec('Came home',L.home)}${sec('Level ups',L.levels)}${sec('Loot banked',L.loot)}${sec('Lost',L.lost,'var(--rose)')}

    <div class="row"><button class="btn primary" data-act="close">Back to the hideout</button></div>`);
}

window.addEventListener('blur',()=>{keys.clear();if(R)R.firing=false});
function bindCanvas(){
  cv.addEventListener('mousemove',e=>{if(R)R.mouse={x:e.clientX,y:e.clientY}});
  cv.addEventListener('mousedown',e=>{if(!R||R.paused)return;R.mouse={x:e.clientX,y:e.clientY};if(e.button===2){doRoll();return}if(e.button===0)R.firing=true});
  window.addEventListener('mouseup',e=>{if(R&&e.button===0&&!touch.aim)R.firing=false});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('touchstart',e=>{e.preventDefault();if(!R||R.paused)return;R.mouse=null;
    for(const t of e.changedTouches){const o={id:t.identifier,ox:t.clientX,oy:t.clientY,x:t.clientX,y:t.clientY};
      if(t.clientX<innerWidth/2&&!touch.move)touch.move=o;else if(!touch.aim)touch.aim=o}},{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){[touch.move,touch.aim].forEach(o=>{if(o&&o.id===t.identifier){o.x=t.clientX;o.y=t.clientY}})}},{passive:false});
  const end=e=>{for(const t of e.changedTouches){if(touch.move&&touch.move.id===t.identifier)touch.move=null;if(touch.aim&&touch.aim.id===t.identifier){touch.aim=null;if(R)R.firing=false}}};
  cv.addEventListener('touchend',end);cv.addEventListener('touchcancel',end);
  $('#raid').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-t]');if(!b||!R)return;e.preventDefault();e.stopPropagation();const k=b.dataset.t;
    if(k==='pause'){setPause(!R.paused);return}if(R.paused)return;
    if(k==='roll')doRoll();if(k==='q')useAbility(0);if(k==='e')useAbility(1);if(k==='cage')useCage();if(k==='s1')swapSlot3(0);if(k==='s2')swapSlot3(1);if(k==='gun')switchGun();if(k==='use')interact()});
}
window.addEventListener('resize',()=>{if(cv)resize()});

/* ================= Boot ================= */
function start(data){
  cv=$('#cv');ctx=cv.getContext('2d');mini=$('#mini');mctx=mini.getContext('2d');bindCanvas();
  S=(data&&data.S&&data.S.v===2)?data.S:load();
  if(!S)newGame();
  save();renderAll();
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){try{window.claude.hot.snapshot(()=>({S}))}catch(e){}}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});

</script>
