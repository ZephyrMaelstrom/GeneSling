<title>GeneSling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: sticky resource header + tab rail over one working panel; raids take over the screen as a canvas overlay */
:root{
  --night:#17122e; --deep:#0e0a1f; --panel:#231b45; --panel2:#2d2457; --line:#4b3e87;
  --ink:#f6eedb; --muted:#b4a9d8; --gold:#ffcf4a; --gold-d:#b5861b; --mint:#5de8b0; --rose:#ff6688; --sky:#58c2ff;
  --display:'Pixelify Sans','Courier New',monospace; --body:'Alegreya Sans','Trebuchet MS',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px),radial-gradient(rgba(255,207,74,.06) 1px,transparent 1.2px);
  background-size:26px 26px,57px 57px;background-position:0 0,13px 9px}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0}
.app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--night);padding-block:12px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;border-bottom:2px solid var(--line)}
.brand{font-family:var(--display);font-size:1.7rem;font-weight:700;color:var(--gold);text-shadow:2px 2px 0 var(--rose),4px 4px 0 var(--deep);letter-spacing:.04em}
.res{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.pill{font-family:var(--display);font-size:.92rem;background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{color:var(--gold);font-weight:600}
.pill small{color:var(--muted);font-family:var(--body);font-size:.78rem}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--display);background:var(--panel);border:0;box-shadow:0 0 0 2px var(--line);padding:7px 14px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--gold);color:var(--deep);box-shadow:0 0 0 2px var(--gold-d)}
.tab:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
main{padding-top:12px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);box-shadow:0 0 0 2px var(--line),5px 5px 0 0 var(--deep);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hint{color:var(--muted);font-size:.95rem;max-width:65ch}
.btn{font-family:var(--display);background:var(--panel2);border:0;box-shadow:0 0 0 2px var(--line),0 3px 0 2px var(--deep);padding:7px 12px;cursor:pointer;transition:transform .05s}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--gold);color:var(--deep);box-shadow:0 0 0 2px var(--gold-d),0 3px 0 2px var(--gold-d)}
.btn.danger{background:#5a1d33;box-shadow:0 0 0 2px var(--rose),0 3px 0 2px #2d0b18}
.btn.small{padding:4px 9px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-block;font-family:var(--display);font-size:.78rem;padding:1px 7px;background:var(--panel2);box-shadow:0 0 0 1.5px var(--line);white-space:nowrap}
.chip.type{background:var(--c);color:var(--deep);box-shadow:0 0 0 1.5px var(--deep)}
.chip.warn{background:#5c4410;color:var(--gold);box-shadow:0 0 0 1.5px var(--gold-d)}
.chip.good{background:#123d33;color:var(--mint);box-shadow:0 0 0 1.5px #1f7a62}
.chip.bad{background:#4a1528;color:var(--rose);box-shadow:0 0 0 1.5px var(--rose)}
.bar{height:8px;background:var(--deep);box-shadow:0 0 0 1.5px var(--line);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--mint)}
.bar.hp>i{background:var(--mint)}
.bar.low>i{background:var(--rose)}
canvas.spr{image-rendering:pixelated;background:var(--deep);box-shadow:0 0 0 2px var(--line);flex:none}
.cre{display:flex;gap:12px;background:var(--panel);box-shadow:0 0 0 2px var(--line),5px 5px 0 0 var(--deep);padding:12px;min-width:0}
.cre-main{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.cre-name{font-family:var(--display);font-size:1.12rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cre-name .lv{color:var(--gold);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0;font-variant-numeric:tabular-nums}
.stats div{background:var(--deep);padding:3px 6px}
.stats dt{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stats dd{margin:0;font-family:var(--display)}
.genes{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:.85rem}
.genes .g{height:6px;background:var(--deep);position:relative}
.genes .g i{position:absolute;inset:0 auto 0 0;background:var(--sky)}
.genes span:last-child{font-family:var(--display);font-variant-numeric:tabular-nums}
.trait{font-size:.9rem}
.trait b{font-family:var(--display);font-weight:600;color:var(--gold)}
.status{font-size:.85rem;color:var(--muted)}
.slots{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.slots{grid-template-columns:minmax(0,1fr)}}
.slot{background:var(--deep);box-shadow:0 0 0 2px var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.slot.support{box-shadow:0 0 0 2px var(--sky)}
.slot-label{font-family:var(--display);font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.slot-body{display:flex;gap:10px;align-items:center;min-width:0}
.slot-body .nm{font-family:var(--display);font-size:1.05rem}
.guns{display:flex;flex-wrap:wrap;gap:8px}
.gun{background:var(--deep);border:0;box-shadow:0 0 0 2px var(--line);padding:8px 10px;cursor:pointer;text-align:left;min-width:150px;flex:1}
.gun[aria-pressed="true"]{box-shadow:0 0 0 2px var(--gold),0 0 0 4px var(--gold-d)}
.gun b{font-family:var(--display);display:block}
.gun small{color:var(--muted)}
.risk{background:#2c1230;box-shadow:0 0 0 2px var(--rose);padding:10px 12px;font-size:.95rem}
.risk b{color:var(--rose);font-family:var(--display);font-weight:600}
.station{gap:10px}
.station-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.workers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.worker{background:var(--deep);padding:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.worker select{width:100%;background:var(--panel2);border:0;box-shadow:0 0 0 1.5px var(--line);padding:4px}
.worker .lab{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.log li{background:var(--deep);padding:6px 10px;font-size:.92rem}
.log li span{font-family:var(--display);color:var(--gold);margin-right:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--display);text-align:right}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.field select,.field input[type=number]{background:var(--deep);border:0;box-shadow:0 0 0 1.5px var(--line);padding:6px}
.toggle{display:flex;gap:8px;align-items:center;cursor:pointer}
.empty{color:var(--muted);font-style:italic}
kbd{font-family:var(--display);background:var(--deep);box-shadow:0 0 0 1.5px var(--line);padding:0 5px;font-size:.85rem}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
/* modal */
#modal{position:fixed;inset:0;z-index:80;background:rgba(8,5,20,.78);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--panel);box-shadow:0 0 0 2px var(--gold-d),6px 6px 0 0 var(--deep);padding:18px;width:min(560px,100%);max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.choose-list{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:center;background:var(--deep);border:0;box-shadow:0 0 0 2px var(--line);padding:8px;cursor:pointer;text-align:left;width:100%}
.choice:hover{box-shadow:0 0 0 2px var(--gold)}
.choice .nm{font-family:var(--display)}
.choice small{color:var(--muted);display:block}
.res-title{font-size:1.6rem}
.res-title.win{color:var(--mint)}
.res-title.lose{color:var(--rose)}
/* raid overlay: stats top-left, map top-right, actions on the right edge above the aim thumb; bottom of the screen stays clear for both sticks */
#raid{position:fixed;inset:0;z-index:50;background:var(--deep);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:absolute;pointer-events:none;font-family:var(--display)}
.lcol{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;width:min(210px,50vw);display:flex;flex-direction:column;gap:5px;pointer-events:none}
.hud-top{font-family:var(--display);background:rgba(14,10,31,.8);box-shadow:0 0 0 2px var(--line);padding:5px 7px;display:flex;flex-direction:column;gap:4px}
.hud-line{display:flex;justify-content:space-between;font-size:.8rem;gap:6px;white-space:nowrap}
.hud-hp{height:14px;background:#2a0f1c;position:relative;box-shadow:0 0 0 1.5px var(--deep)}
.hud-hp i{position:absolute;inset:0 auto 0 0;background:var(--rose)}
.hud-hp span{position:absolute;inset:0;font-size:.7rem;line-height:14px;text-align:center;color:#fff;text-shadow:1px 1px 0 var(--deep)}
#hudGun{font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.party{display:flex;flex-direction:column;gap:5px;pointer-events:none}
.pc{pointer-events:auto;background:rgba(14,10,31,.8);border:0;box-shadow:0 0 0 2px var(--line);padding:4px 7px;font-family:var(--display);font-size:.78rem;color:var(--ink);display:grid;grid-template-columns:auto 1fr auto;gap:2px 6px;align-items:center;text-align:left;touch-action:none;cursor:pointer}
.pc .key{color:var(--gold)}
.pc .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .cd{font-size:.7rem;color:var(--mint)}
.pc .mini-bar{grid-column:1/-1;height:4px;background:#222;position:relative}
.pc .mini-bar i{position:absolute;inset:0 auto 0 0;background:var(--mint)}
.pc .cdb{grid-column:1/-1;height:3px;background:#222;position:relative}
.pc .cdb i{position:absolute;inset:0 auto 0 0;background:var(--sky)}
.pc.down{box-shadow:0 0 0 2px var(--rose)}
.pc.caged{box-shadow:0 0 0 2px var(--gold)}
.pc.s3{cursor:default}
.pc .sw{display:flex;gap:4px}
.pc .sw button{pointer-events:auto;border:0;background:var(--panel2);box-shadow:0 0 0 1.5px var(--line);color:var(--ink);font-family:var(--display);font-size:.72rem;padding:3px 6px;touch-action:none;cursor:pointer}
.hud-tr{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{width:88px;height:88px;background:rgba(14,10,31,.8);box-shadow:0 0 0 2px var(--line);pointer-events:none}
@media (min-width:700px) and (min-height:560px){#mini{width:120px;height:120px}}
.pbtn{border:0;background:rgba(45,36,87,.9);box-shadow:0 0 0 2px var(--line);color:var(--ink);font-family:var(--display);padding:6px 12px;cursor:pointer;touch-action:none}
.ccol{position:absolute;left:50%;transform:translateX(-50%);top:27%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:min(480px,86vw)}
#hudMsg{position:static;max-width:100%;box-sizing:border-box;background:rgba(14,10,31,.85);box-shadow:0 0 0 2px var(--gold-d);padding:5px 10px;width:max-content;text-align:center;font-size:.8rem}
#hudPrompt{max-width:100%;background:rgba(14,10,31,.9);border:0;box-shadow:0 0 0 2px var(--sky);padding:7px 12px;text-align:center;max-width:80vw;font-family:var(--display);font-size:.85rem;color:var(--ink);pointer-events:none;touch-action:none}
#hudPrompt.tap{pointer-events:auto;background:var(--sky);color:var(--deep);box-shadow:0 0 0 2px var(--deep),0 3px 0 2px var(--deep);cursor:pointer}
.hud-keys{left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:.78rem;color:var(--muted);background:rgba(14,10,31,.75);padding:5px 8px;max-width:60vw}
#pause{position:absolute;inset:0;background:rgba(8,5,20,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
#pause .box{background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:18px;display:flex;flex-direction:column;gap:10px;width:min(380px,100%);max-height:88vh;overflow:auto}
#arenaPanel{position:absolute;right:8px;top:calc(env(safe-area-inset-top,0px) + 136px);display:flex;flex-direction:column;gap:5px;max-width:200px;background:rgba(14,10,31,.85);box-shadow:0 0 0 2px var(--line);padding:6px 8px;max-height:34vh;overflow:auto}
@media (min-width:700px) and (min-height:560px){#arenaPanel{top:calc(env(safe-area-inset-top,0px) + 170px);max-height:55vh}}
#arenaPanel summary{font-family:var(--display);cursor:pointer;color:var(--gold)}
#arenaPanel .ap{display:flex;flex-direction:column;gap:6px;margin-top:6px;align-items:flex-start}
#arenaPanel .lab{font-family:var(--display);font-size:.78rem;color:var(--muted);text-transform:uppercase}
#arenaPanel .row{gap:4px}
#actCol{position:absolute;right:10px;top:54%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;align-items:center}
.tb{width:54px;height:54px;border-radius:50%;border:0;background:rgba(45,36,87,.88);box-shadow:0 0 0 2px var(--line);font-family:var(--display);font-size:.78rem;color:var(--ink);touch-action:none}
.tb.cage{background:rgba(255,207,74,.25);box-shadow:0 0 0 2px var(--gold);color:var(--gold)}
.tb.big{background:rgba(255,207,74,.85);color:var(--deep)}
.chip.sex{font-weight:700}
.chip.sex.f{background:#4a1a35;color:#ff8fb1;box-shadow:0 0 0 1.5px #b3507a}
.chip.sex.m{background:#14304a;color:#7fc8ff;box-shadow:0 0 0 1.5px #3a7ab3}
ul.traits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:.88rem}
ul.traits b{font-family:var(--display);font-weight:600;color:var(--gold)}
ul.traits li.neg b{color:var(--rose)}
.genes .g b{position:absolute;top:-2px;width:4px;height:10px;background:var(--gold)}
.gunslot{background:var(--deep);box-shadow:0 0 0 2px var(--line);padding:10px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:min(100%,220px)}
.gunslot select{background:var(--panel2);border:0;box-shadow:0 0 0 1.5px var(--line);padding:6px}
.gunslot small{color:var(--muted)}
.bchips{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.bchip{font-size:.68rem;background:#123d33;color:var(--mint);padding:0 5px}
#hudGun .on{color:var(--gold)}
#hudGun span:not(.on){color:var(--muted)}
.choice[disabled]{opacity:.45;cursor:not-allowed}
.choice small{color:var(--muted);display:block;font-family:var(--body)}
#arenaPanel select{background:var(--panel2);border:0;box-shadow:0 0 0 1.5px var(--line);padding:3px;max-width:100%}
/* v4 hideout */
.hideout{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.hideout{grid-template-columns:minmax(0,1fr)}}
.seclist{display:flex;flex-direction:column;gap:8px}
@media (max-width:760px){.seclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.secbtn{text-align:left;border:0;background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0}
.secbtn.on{box-shadow:0 0 0 2px var(--gold),4px 4px 0 0 var(--deep)}
.secbtn.locked{opacity:.55}
.secbtn .nm{font-family:var(--display);font-size:1rem}
.secbtn small{color:var(--muted)}
.mbar{display:block;height:5px;background:var(--deep);position:relative}
.mbar i{position:absolute;inset:0 auto 0 0;background:var(--mint)}
.meter{position:relative;height:16px;background:var(--deep);box-shadow:0 0 0 2px var(--line);margin:18px 0 4px}
.meter>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--mint),var(--gold))}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muted)}
.meter b.on{background:var(--gold)}
.meter b span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:.7rem;color:var(--muted);font-weight:400}
.meter b.on span{color:var(--gold)}
.tierlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.tierlist li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;background:var(--deep);padding:5px 8px;color:var(--muted);font-size:.92rem}
.tierlist li b{font-family:var(--display)}
.tierlist li.on{color:var(--ink);box-shadow:inset 3px 0 0 var(--gold)}
.tierlist li.on b{color:var(--gold)}
.tierlist small{font-family:var(--display);font-size:.75rem}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.member{display:flex;gap:8px;align-items:center;background:var(--deep);padding:6px;min-width:0}
.member .nm{font-family:var(--display)}
.member small{color:var(--muted)}
.secdetail select,#addsel{background:var(--deep);border:0;box-shadow:0 0 0 1.5px var(--line);padding:6px;max-width:100%;min-width:0;flex:1}
.chip.tier{background:#3a2e10;color:var(--gold);box-shadow:0 0 0 1.5px var(--gold-d)}
.chip.tier.t0{background:var(--panel2);color:var(--muted);box-shadow:0 0 0 1.5px var(--line)}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.recipe{background:var(--deep);box-shadow:0 0 0 2px var(--line);padding:8px;display:flex;flex-direction:column;gap:6px}
.recipe b{font-family:var(--display);font-weight:600}
.recipe small{color:var(--muted)}
.recipe.unknown{opacity:.55}
.invrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--deep);padding:6px 8px}
.invrow b{font-family:var(--display);font-weight:600}
.trophies{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.trophy{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--deep);padding:6px 4px;text-align:center;font-family:var(--display);font-size:.72rem;color:var(--muted)}
.trophy.won{color:var(--gold);box-shadow:0 0 0 1.5px var(--gold-d)}
.trophy small{font-size:.65rem;color:var(--muted)}
.trophy canvas.spr{box-shadow:none}
.trophy:not(.won) canvas{opacity:.25;filter:grayscale(1)}
.modes{display:flex;flex-direction:column;gap:8px}
.toggle.locked{opacity:.55}
.seg{display:flex;flex-wrap:wrap;gap:6px}
input[type=range]{accent-color:var(--gold);width:100%}
#bossBar{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 236px);width:min(420px,80vw);font-family:var(--display);text-align:center;pointer-events:none}
#bossBar span{display:block;font-size:.85rem;color:#ffa0b0;text-shadow:1px 1px 0 var(--deep)}
#bossBar .bb{height:10px;background:#2a0f1c;box-shadow:0 0 0 2px var(--deep),0 0 0 4px #ff5c7a;position:relative}
#bossBar .bb i{position:absolute;inset:0 auto 0 0;background:#ff3a5c}
.ccol.low{top:calc(env(safe-area-inset-top,0px) + 276px)!important}
#raid .lcol,#raid .hud-tr{opacity:var(--hud-a,.85)}
#raid .tb{width:var(--tb,54px);height:var(--tb,54px)}
#raid.lefty #actCol{right:auto;left:10px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const wpick=(items,wf)=>{const ws=items.map(wf);let x=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<items.length;i++){x-=ws[i];if(x<=0)return items[i]}return items[items.length-1]};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function makeCreature(species,origin,level,o={}){
  const sp=SPECIES[species];

  const wild=origin==='wild';
  const c={id:S.nextId++,species,type,type2,sex:o.sex||(Math.random()<.5?'F':'M'),name:o.name||makeName(type),origin,
    proven:!wild||!!o.proven,

    traits:o.traits||rollTraits(wild?(Math.random()<.5?2:1):2),

function stats(c){
  const B=TYPES[c.type].base,m=SPECIES[c.species].mods,g=c.genes,l=1+.07*(c.level-1),has=k=>c.traits.includes(k);
  let hp=B.hp*m.hp*(.6+g.vig*.08)*l,atk=B.atk*m.atk*(.6+g.pow*.08)*l,spd=B.spd*m.spd*(.85+g.swf*.03),rate=m.rate*(.8+g.hst*.04);
  if(has('thick'))hp*=1.12;if(has('frail'))hp*=.9;if(has('glow'))atk*=1.1;if(has('quick'))spd*=1.12;if(has('clumsy'))spd*=.9;if(has('rapid'))rate*=1.15;
  const obey=c.origin==='bred'?1:clamp(.4+g.tmp*.03+c.bond/250+(c.proven?.1:0),.2,1);
  return{hp:Math.round(hp),atk:Math.round(atk*10)/10,spd:Math.round(spd),rate:Math.round(rate*100)/100,obey,
    taken:has('sturdy')?.85:1,regen:has('regen')?.015:0,reach:has('reach')?1.3:1,abil:(has('focus')?.8:1)*(has('lazy')?1.25:1),crit:has('keen')?.15:0,vamp:has('vamp')?.08:0};
}

  const out=[];S.keeper.xp+=Math.round(n);
  while(S.keeper.xp>=keeperNeed()){
    S.keeper.xp-=keeperNeed();S.keeper.level++;const L=S.keeper.level;
    const coin=30*L;S.coin+=coin;S.cages.basic+=1;
    out.push(`Keeper rank ${L}: +${coin} coin, +1 cage${KEEPER_PERKS[L]?'. '+KEEPER_PERKS[L]:''}`);
  }
  return out;
}

/* ---------- days ---------- */
function processDay(){
  S.day++;const notes=[];
  const trainees=S.sections.training.ids.length;
  const n=S.creatures.length+trainees;
  if(S.food>=n)S.food-=n;
  else{const short=n-S.food;S.food=0;S.creatures.forEach(c=>{c.bond=Math.max(0,c.bond-5);c.hp=Math.max(1,Math.round(c.hp*.9))});notes.push(`Food ran short by ${short}. Creatures went hungry and lost bond.`)}
  const gt=secTier('garden');if(gt){const g=[0,3,6,10,15,22][gt];S.food+=g;notes.push(`The Garden grew ${g} food.`)}
  const sp=secTier('spring');
  S.creatures.forEach(c=>{const m=stats(c).hp;c.hp=sp>=2?m:Math.min(m,Math.round(c.hp+m*(sp>=1?.5:.35)))});
  if(sp>=3)S.creatures.forEach(c=>{if(c.origin==='wild')c.bond=Math.min(100,c.bond+5)});
  const tt=secTier('training'),txp=[20,30,45,60,75,100][tt];let lvls=0;
  S.sections.training.ids.map(byId).filter(Boolean).forEach(c=>{lvls+=gainXp(c,txp)});
  if(trainees)notes.push(`Trainees earned ${txp} XP each${lvls?` (${lvls} level-up${lvls>1?'s':''})`:''}.`);
  for(const k in S.sections){if(k==='training')continue;S.sections[k].ids.map(byId).filter(Boolean).forEach(c=>gainXp(c,6))}
  if(secTier('nursery')){
    const hatched=[];
    S.eggs.forEach(e=>{e.days--;if(e.days<=0){S.creatures.push(e.child);hatched.push(e.child)}});
    S.eggs=S.eggs.filter(e=>e.days>0);
    hatched.forEach(c=>notes.push(`An egg hatched: ${c.name}, a ${sexSym(c.sex)} ${SPECIES[c.species].name}${c.type2?' (hybrid!)':''}.`));
  }else if(S.eggs.length)notes.push('Eggs are waiting. The Nursery needs Wardens to keep incubating.');
  addLog(`Day ${S.day}. `+(notes.join(' ')||'A quiet day at the hideout.'));
}

/* ---------- breeding ---------- */
function hybridChance(mom,dad){
  if(SPECIES[mom.species].hybrid||SPECIES[dad.species].hybrid)return{id:null,p:0};
  const id=hybridFor(mom.type,dad.type),t=secTier('nursery');return{id,p:id?(t>=5?.2:t>=4?.15:.1):0};
}
function breed(){
  const mom=byId(+ui.mom),dad=byId(+ui.dad);
  if(!mom||!dad||mom.sex!=='F'||dad.sex!=='M'||!mom.proven||!dad.proven)return;
  const t=secTier('nursery');
  if(!t||S.coin<20||S.food<3||S.eggs.length>=eggCap())return;
  S.coin-=20;S.food-=3;
  const mc=t>=4?.25:.12;
  let species=mom.species,type=mom.type,type2=mom.type2;
  const h=hybridChance(mom,dad);let isHybrid=false;
  if(h.id&&Math.random()<h.p){species=h.id;type=mom.type;type2=dad.type;isHybrid=true}
  const genes={};
  for(const k in GENES){let v=Math.random()<.7?dad.genes[k]:mom.genes[k];if(Math.random()<mc)v+=pick([-2,-1,1,1,2]);genes[k]=clamp(v,1,10)}
  const traits=[];
  for(let i=0;i<2;i++){
    let tr=null;
    if(Math.random()<.08)tr=rollTraits(1,traits)[0];
    else{const src=Math.random()<.6?dad:mom;const pool=src.traits.filter(x=>!traits.includes(x));const alt=(src===dad?mom:dad).traits.filter(x=>!traits.includes(x));tr=pool.length?pick(pool):alt.length?pick(alt):rollTraits(1,traits)[0]}
    traits.push(tr);
  }
  const child=makeCreature(species,'bred',t>=5?5:1,{type,type2,genes,traits,gen:Math.max(mom.gen,dad.gen)+1});
  S.eggs.push({id:child.id,days:t>=3?1:2,child,cols:[SPECIES[mom.species].col,SPECIES[dad.species].col],parents:mom.name+' and '+dad.name,hybrid:isHybrid});
  if(isHybrid){S.stats.hybrids++;addLog(`${mom.name} and ${dad.name} produced a shimmering egg. Something unusual is inside.`)}
  else addLog(`${mom.name} and ${dad.name} produced an egg.`);
  ui.mom='';ui.dad='';save();renderAll();
}

const OL='#160f2c';
function drawAcc(g,kind,col,sh,t,front){
  g.lineWidth=2;g.strokeStyle=OL;
  const fs=()=>{g.fill();g.stroke()};
  if(!front){
    if(kind==='tail'){g.fillStyle=sh;g.beginPath();g.moveTo(-9,4);g.quadraticCurveTo(-22,-2+Math.sin(t*6)*3,-18,10);g.quadraticCurveTo(-13,9,-8,9);g.closePath();fs()}
    if(kind==='m-gale'){g.fillStyle='#4fe0c8';g.beginPath();g.moveTo(-6,-2);g.quadraticCurveTo(-22,-12+Math.sin(t*10)*3,-20,4);g.quadraticCurveTo(-13,6,-6,6);g.closePath();fs()}
    if(kind==='m-tide'){g.fillStyle='#3fa9ff';g.beginPath();g.moveTo(-6,-6);g.lineTo(-14,-16);g.lineTo(-2,-10);g.closePath();fs()}
    if(kind==='m-crystal'){g.fillStyle='#ff8fe0';[[-10,-4],[-6,-10]].forEach(([x,y])=>{g.beginPath();g.moveTo(x,y);g.lineTo(x-5,y-8);g.lineTo(x+3,y-3);g.closePath();fs()})}
    return;
  }
  if(kind==='ears'||kind==='m-echo'){g.fillStyle=kind==='m-echo'?'#9b7bff':col;[-1,1].forEach(s=>{g.beginPath();g.moveTo(s*3,-9);g.lineTo(s*8,-19);g.lineTo(s*10,-7);g.closePath();fs()})}
  if(kind==='horns'||kind==='m-warden'){g.fillStyle=kind==='m-warden'?'#c9b48a':'#f6eedb';[-1,1].forEach(s=>{g.beginPath();g.moveTo(s*4,-10);g.lineTo(s*10,-19);g.lineTo(s*9,-9);g.closePath();fs()})}
  if(kind==='crown'){g.fillStyle='#ffcf4a';g.beginPath();g.moveTo(-8,-10);g.lineTo(-8,-17);g.lineTo(-4,-13);g.lineTo(0,-19);g.lineTo(4,-13);g.lineTo(8,-17);g.lineTo(8,-10);g.closePath();fs()}
  if(kind==='m-ember'){const fl=Math.sin(t*14)*2;g.fillStyle='#ffd23f';g.beginPath();g.moveTo(-4,-9);g.lineTo(-1,-19-fl);g.lineTo(2,-12);g.lineTo(5,-18+fl);g.lineTo(6,-9);g.closePath();fs()}
  if(kind==='m-fungal'){g.fillStyle='#fff';[[-6,4,2.2],[5,7,2],[0,0,1.8]].forEach(([x,y,r])=>{g.beginPath();g.arc(x,y,r,0,7);g.fill()})}
}
function drawCreature(g,c,x,y,s,t,o={}){
  const sp=SPECIES[c.species],type=c.type,col=o.flash?'#ffffff':sp.col,sh=o.flash?'#ffffff':sp.shade;
  const seed=o.seed||0,bob=Math.sin(t*6+seed)*1.5,sz=s*(sp.size||1);
  g.save();g.translate(x,y);g.scale(sz,sz);
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,15,11,3.5,0,0,7);g.fill();
  g.translate(0,bob);if(o.face<0)g.scale(-1,1);
  g.lineWidth=2.2;g.strokeStyle=OL;g.lineJoin='round';
  const fs=()=>{g.fill();g.stroke()};
  const eyes=(ex,ey,gap)=>{g.lineWidth=1.5;[ex,ex-gap].forEach(px=>{g.fillStyle='#fff';g.fillRect(px-2,ey-2,4,4);g.strokeRect(px-2,ey-2,4,4);g.fillStyle=OL;g.fillRect(px-.2,ey-1,2,2.4)});g.lineWidth=2.2};
  const mark=c.type2?'m-'+c.type2:null;
  drawAcc(g,sp.acc,col,sh,t,false);if(mark)drawAcc(g,mark,col,sh,t,false);
  g.lineWidth=2.2;g.strokeStyle=OL;
  if(type==='ember'){
    const fl=Math.sin(t*14+seed)*2;
    if(!mark){g.fillStyle='#ffd23f';g.beginPath();g.moveTo(-6,-6);g.lineTo(-2,-17-fl);g.lineTo(1,-10);g.lineTo(4,-18+fl);g.lineTo(7,-6);g.closePath();fs()}
    g.fillStyle='#ffd23f';g.beginPath();g.moveTo(-10,5);g.lineTo(-19,-2+fl);g.lineTo(-15,8);g.closePath();fs();
    g.fillStyle=col;g.beginPath();g.arc(0,3,11,0,7);fs();
    g.fillStyle=o.flash?'#fff':'rgba(255,230,190,.55)';g.beginPath();g.ellipse(1,7,6,4,0,0,7);g.fill();
    eyes(5,0,6);
  }else if(type==='fungal'){
    g.fillStyle=o.flash?'#fff':'#f2e4c9';g.beginPath();g.rect(-7,-1,14,14);fs();
    g.fillStyle=col;g.beginPath();g.ellipse(0,-1,15,11,0,Math.PI,0);g.closePath();fs();
    g.fillStyle='#fff';[[-7,-6,2.5],[2,-8,3],[8,-4,2]].forEach(([a,b,r])=>{g.beginPath();g.arc(a,b,r,0,7);g.fill()});
    eyes(4,6,6);
  }else if(type==='tide'){
    g.fillStyle=sh;g.beginPath();g.moveTo(-8,2);g.lineTo(-16,-4);g.lineTo(-12,8);g.closePath();fs();
    g.fillStyle=col;g.beginPath();g.moveTo(0,-15);g.bezierCurveTo(10,-4,13,4,9,10);g.bezierCurveTo(5,15,-5,15,-9,10);g.bezierCurveTo(-13,4,-10,-4,0,-15);fs();
    g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(-3,-3,2.5,4,-.4,0,7);g.fill();
    eyes(5,3,6);
  }else if(type==='echo'){
    const w=Math.sin(t*12+seed)*4;
    g.fillStyle=sh;g.beginPath();g.moveTo(-6,0);g.lineTo(-20,-8+w);g.lineTo(-16,4);g.lineTo(-20,8);g.lineTo(-6,8);g.closePath();fs();
    g.beginPath();g.moveTo(6,0);g.lineTo(20,-8+w);g.lineTo(16,4);g.lineTo(20,8);g.lineTo(6,8);g.closePath();fs();
    g.fillStyle=col;g.beginPath();g.arc(0,2,9,0,7);fs();
    eyes(4,1,7);
  }else if(type==='gale'){
    g.fillStyle=sh;g.beginPath();g.moveTo(-4,-6);g.lineTo(-10,-16);g.lineTo(-2,-9);g.lineTo(0,-17);g.lineTo(3,-7);g.closePath();fs();
    g.fillStyle=col;g.beginPath();g.ellipse(0,2,12,10,0,0,7);fs();
    g.fillStyle=sh;g.beginPath();g.moveTo(-10,0);g.quadraticCurveTo(-20,-4+Math.sin(t*10)*3,-18,8);g.quadraticCurveTo(-12,8,-6,6);g.closePath();fs();
    g.fillStyle='#ffb347';g.beginPath();g.moveTo(10,0);g.lineTo(18,3);g.lineTo(10,6);g.closePath();fs();
    eyes(6,-1,6);
  }else if(type==='crystal'){
    g.fillStyle=col;g.beginPath();g.moveTo(0,-16);g.lineTo(12,-2);g.lineTo(0,14);g.lineTo(-12,-2);g.closePath();fs();
    g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=1.2;g.beginPath();g.moveTo(-12,-2);g.lineTo(12,-2);g.moveTo(0,-16);g.lineTo(-4,-2);g.lineTo(0,14);g.stroke();
    g.strokeStyle=OL;g.lineWidth=2.2;eyes(5,3,6);
  }else if(type==='warden'){
    g.fillStyle=col;g.beginPath();g.rect(-13,-10,26,24);fs();
    g.fillStyle=sh;g.fillRect(-13,-10,26,6);g.strokeRect(-13,-10,26,6);
    g.fillStyle=o.flash?'#fff':'rgba(60,40,10,.6)';g.fillRect(-9,8,6,6);g.fillRect(3,8,6,6);
    eyes(6,1,8);
  }
  drawAcc(g,sp.acc,col,sh,t,true);if(mark)drawAcc(g,mark,col,sh,t,true);
  if(o.sex){g.font='700 9px sans-serif';g.textAlign='center';g.fillStyle=o.sex==='F'?'#ff8fb1':'#7fc8ff';g.fillText(sexSym(o.sex),11,-10)}
  g.restore();
}
function drawEgg(g,x,y,s,cols,shiny){
  g.save();g.translate(x,y);g.scale(s,s);
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,14,10,3,0,0,7);g.fill();
  g.fillStyle=shiny?'#fff6c8':'#f6eedb';g.strokeStyle=shiny?'#ffcf4a':OL;g.lineWidth=2.2;g.beginPath();g.ellipse(0,0,11,14,0,0,7);g.fill();g.stroke();
  [[-4,-5,0],[5,2,1],[-3,7,0],[4,-8,1]].forEach(([a,b,i])=>{g.fillStyle=cols[i]||cols[0];g.beginPath();g.arc(a,b,2.6,0,7);g.fill()});
  g.restore();
}
function paintSprites(root){
  const dpr=window.devicePixelRatio||1;
  root.querySelectorAll('canvas.spr').forEach(cv=>{
    const w=+cv.getAttribute('width'),h=+cv.getAttribute('height');
    if(!cv.dataset.sized){cv.style.width=w+'px';cv.style.height=h+'px';cv.width=w*dpr;cv.height=h*dpr;cv.dataset.sized='1'}
    const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
    if(cv.dataset.egg){drawEgg(g,w/2,h/2,w/40,cv.dataset.egg.split(','),cv.dataset.shiny==='1');return}
    if(cv.dataset.boss){drawBossBody(g,BOSSES[cv.dataset.boss],w/2,h/2+2,w/110,0,false);return}
    if(cv.dataset.foe){drawFoeBody(g,FOES[cv.dataset.foe],w/2,h/2+2,w/44,0,{});return}
    if(!cv.dataset.cid)return;
    const c=byId(+cv.dataset.cid);if(!c)return;
    drawCreature(g,c,w/2,h/2+3,w/50,0,{face:1,sex:c.sex});
  });
}

    <h3>Bosses</h3><div class="trophies">${bossRow}</div>
    <p class="status">One of four bosses waits at the end of Floor 3 (best faced with companions around Lv 10). Beating it opens Floors 4–6, the Ember Abyss, where a second set of bosses waits (around Lv 25).</p>

    <ul class="plain">
      <li>Rooms seal until every enemy is beaten or caught. Enemies glow just before they fire.</li>
      <li>Weaken a wild creature below half health, get close and use a cage. Catches return to full health.</li>
      <li>Melee weapons cut enemy bullets inside their swing.</li>
      <li>Cracked walls hide secret rooms. Break them with attacks. Echo creatures can hear them.</li>
      <li>Floors 1, 2, 4 and 5 have a paid gate extract. Boss floors have a rift, a cliff that needs a Gale, and a portal once the boss falls.</li>
    </ul>
    <dl class="kv"><dt>Raids</dt><dd>${S.stats.raids}</dd><dt>Extractions</dt><dd>${S.stats.extracts}</dd><dt>Deepest floor</dt><dd>${S.progress.deepest||0}</dd><dt>Bosses beaten</dt><dd>${S.stats.bossKills}</dd><dt>Creatures lost</dt><dd>${S.stats.lost}</dd><dt>Captures</dt><dd>${S.stats.captures}</dd></dl>
  </section></div>`;
}

function meterHtml(score,th,tier){
  const max=th[th.length-1]*1.08,pct=Math.min(100,score/max*100);
  return`<div class="meter"><i style="width:${pct}%"></i>${th.map((t,i)=>`<b class="${tier>i?'on':''}" style="left:${t/max*100}%"><span>T${i+1}</span></b>`).join('')}</div>`;
}
function viewHideout(){
  const list=SECTION_IDS.map(k=>{
    const sec=SECTIONS[k],un=sectionUnlocked(k),t=secTier(k),sc=secScore(k);
    return`<button class="secbtn ${ui.section===k?'on':''} ${un?'':'locked'}" data-act="section" data-k="${k}"><span class="nm">${sec.name}</span>${un?`<span class="row" style="gap:6px">${tierTag(t)}<small>${S.sections[k].ids.length}/${secCap(k)}</small></span><span class="mbar"><i style="width:${Math.min(100,sc/(SEC_TH[4]*1.08)*100)}%"></i></span>`:`<small>Keeper rank ${sec.unlock}</small>`}</button>`;
  }).join('')+`<button class="secbtn ${ui.section==='log'?'on':''}" data-act="section" data-k="log"><span class="nm">Hideout log</span><small>${S.log.length} entries</small></button>`;
  return`<div class="hideout"><nav class="seclist" aria-label="Sections">${list}</nav><section class="card secdetail">${ui.section==='log'?logView():sectionDetail(ui.section)}</section></div>`;
}
function logView(){
  return`<h2>Hideout log</h2><p class="hint">Each raid moves time forward one day. Every creature eats 1 food a day, trainees eat 2.</p>
    <div class="row"><button class="btn" data-act="wait">Wait one day</button></div><ul class="log">${S.log.map(l=>`<li><span>Day ${l.day}</span>${esc(l.msg)}</li>`).join('')}</ul>`;
}
function sectionDetail(k){
  const sec=SECTIONS[k];
  if(!sectionUnlocked(k))return`<h2>${sec.name}</h2><p class="hint">${sec.blurb}</p><div class="risk"><b>Locked.</b> Reach Keeper rank ${sec.unlock} to build the ${sec.name}. Keeper XP comes from every raid, won or lost.</div>`;
  const ids=S.sections[k].ids,cap=secCap(k),t=secTier(k),sc=secScore(k);
  const next=SEC_TH[t];
  const tiers=sec.tiers.map((d,i)=>`<li class="${t>i?'on':''}"><b>T${i+1}</b> <span>${d}</span> <small>${SEC_TH[i]} pts</small></li>`).join('');
  const members=ids.map(byId).filter(Boolean).map(c=>`<div class="member">${spr(c,40)}<div style="min-width:0;flex:1"><div class="nm">${esc(c.name)}</div><small>${SPECIES[c.species].name} Lv ${c.level} · +${Math.round(secContribution(c,k))} pts</small>${k==='training'?`<div class="bar"><i style="width:${c.xp/xpNeed(c)*100}%;background:var(--sky)"></i></div>`:''}</div><button class="btn small" data-act="unassign" data-id="${c.id}" aria-label="Remove ${esc(c.name)}">×</button></div>`).join('');
  const cand=S.creatures.filter(c=>!ids.includes(c.id)).sort((a,b)=>secContribution(b,k)-secContribution(a,k));
  const add=ids.length<cap&&cand.length?`<div class="row"><select id="addsel" aria-label="Add a creature">${cand.map(c=>{const w=whereIs(c);return`<option value="${c.id}">${esc(c.name)} · ${SPECIES[c.species].name} Lv ${c.level} · +${Math.round(secContribution(c,k))} pts${w.kind==='loadout'?' (loadout)':w.kind==='section'?' ('+SECTIONS[w.key].name+')':''}</option>`}).join('')}</select><button class="btn small primary" data-act="assign" data-k="${k}">Add</button></div>`:'';
  const ec=expandCost(k),canExp=S.sections[k].cap<10;
  let extra='';
  if(k==='training'){
    const pool=S.creatures;
    const sel=(id,val)=>`<select id="${id}" data-act="${id}">${pool.map(c=>`<option value="${c.id}" ${String(c.id)===String(val)?'selected':''}>${esc(c.name)} · ${SPECIES[c.species].name} Lv ${c.level}</option>`).join('')}</select>`;
    if(!ui.gl.id&&pool[0])ui.gl.id=String(pool[0].id);if(!ui.tt.id&&pool[0])ui.tt.id=String(pool[0].id);
    const gc=byId(+ui.gl.id),gv=gc?gc.genes[ui.gl.gene]:0,gcost={coin:20*(gv+1),ore:2*(gv+1)};
    const tc=byId(+ui.tt.id);
    extra=`<h3>Gene Lab ${t>=2?'':'· opens at T2'}</h3>
      ${t>=2?`<p class="hint">Raise one gene by 1, up to 10. Costs rise with the gene's value.</p>
      <div class="row">${sel('glc',ui.gl.id)}<select id="glg" data-act="glg">${Object.entries(GENES).map(([g,l])=>`<option value="${g}" ${ui.gl.gene===g?'selected':''}>${l}${gc?' ('+gc.genes[g]+')':''}</option>`).join('')}</select>
      <button class="btn small" data-act="genelab" ${gc&&gv<10&&S.coin>=gcost.coin&&S.ore>=gcost.ore?'':'disabled'}>${gv>=10?'Maxed':`Train · ${gcost.coin}c ${gcost.ore} ore`}</button></div>`:'<p class="status">Reach tier 2 to raise genes directly with coin and ore.</p>'}
      <h3>Trait Tutor ${t>=4?'':'· opens at T4'}</h3>
      ${t>=4?`<p class="hint">Replace one trait with a random positive trait. 60 coin and 8 ore.</p>
      <div class="row">${sel('ttc',ui.tt.id)}<select id="tts" data-act="tts">${tc?tc.traits.map((x,i)=>`<option value="${i}" ${ui.tt.slot==String(i)?'selected':''}>${TRAITS[x].name}</option>`).join(''):''}</select>
      <button class="btn small" data-act="tutor" ${tc&&S.coin>=60&&S.ore>=8?'':'disabled'}>Retrain trait</button></div>`:'<p class="status">Reach tier 4 to swap out unwanted traits.</p>'}`;
  }
  return`<div class="row" style="justify-content:space-between"><h2>${sec.name}</h2>${tierTag(t)}</div>
    <p class="hint">${sec.blurb} ${sec.type?`${TYPES[sec.type].name} creatures count double, hybrids with ${TYPES[sec.type].name} count 1.6×, others 0.6×.`:'Every creature counts the same here.'} Contribution grows with level and ${GENES[sec.gene]}.</p>
    ${meterHtml(sc,SEC_TH,t)}
    <p class="status">${Math.round(sc)} points${next?` · ${Math.round(next-sc)} more for tier ${t+1}`:' · maxed'}</p>
    <ul class="tierlist">${tiers}</ul>
    <h3>Creatures · ${ids.length}/${cap}</h3>
    <div class="members">${members||'<p class="empty">Nobody is assigned yet.</p>'}</div>
    ${add}
    ${canExp?`<div class="row"><button class="btn small" data-act="expand" data-k="${k}" ${S.coin>=ec.coin&&S.ore>=ec.ore?'':'disabled'}>Build a slot · ${ec.coin}c ${ec.ore} ore</button><span class="status">Up to 10 slots${slotBonus()?` (+${slotBonus()} from Keeper rank)`:''}</span></div>`:''}
    ${extra}`;
}

  const traits=c.proven?c.traits.map(t=>`<li class="${NEG_TRAITS.includes(t)?'neg':''}"><b>${TRAITS[t].name}</b> · ${TRAITS[t].desc}</li>`).join(''):'<li><b>Traits hidden</b> · revealed once proven</li>';
  const nextT=ATK_TIERS[at+1];

    <div class="cre-name">${esc(c.name)} <span class="lv">Lv ${c.level}</span></div>

    ${hpBar(c)}
    <dl class="stats"><div><dt>HP</dt><dd>${c.hp}/${st.hp}</dd></div><div><dt>Atk</dt><dd>${st.atk}</dd></div><div><dt>Move</dt><dd>${st.spd}</dd></div><div><dt>Rate</dt><dd>×${st.rate}</dd></div></dl>

    <div class="genes">${genes}</div>

    <div class="bar" title="XP"><i style="width:${c.xp/xpNeed(c)*100}%;background:var(--sky)"></i></div>

function viewRoster(){
  const F=[['all','All'],['wild','Wild'],['bred','Bred'],['unproven','Unproven'],['f','Female'],['m','Male'],['hybrid','Hybrids'],['idle','Idle']];
  let list=S.creatures.slice();const f=ui.filter;
  if(f==='wild')list=list.filter(c=>c.origin==='wild');
  if(f==='bred')list=list.filter(c=>c.origin==='bred');
  if(f==='unproven')list=list.filter(c=>!c.proven);
  if(f==='f')list=list.filter(c=>c.sex==='F');
  if(f==='m')list=list.filter(c=>c.sex==='M');
  if(f==='hybrid')list=list.filter(c=>c.type2);
  if(f==='idle')list=list.filter(c=>whereIs(c).kind==='idle');
  list.sort((a,b)=>b.level-a.level||typeTier(b)-typeTier(a));
  return`<section class="card" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><h2>Roster · ${S.creatures.length} creatures</h2>
    <div class="filters">${F.map(([k,l])=>`<button class="tab" aria-selected="${ui.filter===k}" data-act="filter" data-k="${k}">${l}</button>`).join('')}</div></div>
    <p class="hint">Creatures level from raids and from the Training Grounds. Attacks upgrade at Lv 8, 16 and 25. Feeding costs 1 food, heals 20% and adds 10 bond.</p></section>
    <div class="grid">${list.map(creCard).join('')||'<p class="empty">No creatures match this filter.</p>'}</div>`;
}

function viewBreeding(){
  const t=secTier('nursery');
  const moms=S.creatures.filter(c=>c.proven&&c.sex==='F'),dads=S.creatures.filter(c=>c.proven&&c.sex==='M');
  const opt=(list,sel)=>`<option value="">Choose</option>`+list.map(c=>`<option value="${c.id}" ${String(c.id)===String(sel)?'selected':''}>${esc(c.name)} · ${SPECIES[c.species].name}${c.type2?' (hybrid)':''} Lv ${c.level}</option>`).join('');
  const a=byId(+ui.mom),b=byId(+ui.dad);
  let pred='';
  if(a&&b){
    const mut=t>=4?2:1,h=hybridChance(a,b);
    const genes=Object.entries(GENES).map(([k,l])=>{const lo=clamp(Math.min(a.genes[k],b.genes[k])-mut,1,10),hi=clamp(Math.max(a.genes[k],b.genes[k])+mut,1,10);
      return`<span>${l}</span><div class="g"><i style="left:${(lo-1)*10}%;width:${(hi-lo+1)*10}%"></i><b style="left:calc(${(b.genes[k]-.5)*10}% - 2px)"></b></div><span>${lo}–${hi}</span>`}).join('');
    const tpool=[...new Set([...b.traits,...a.traits])].map(x=>TRAITS[x].name).join(', ');
    pred=`<div class="slot"><div class="slot-label">Likely offspring</div>
      <p><b style="font-family:var(--display)">${SPECIES[a.species].name}</b> (from the mother)${h.id?` · <span style="color:var(--gold)">${Math.round(h.p*100)}% chance of a ${SPECIES[h.id].name} hybrid</span>`:''}</p>
      <div class="genes">${genes}</div>
      <p class="status">Each gene comes from the father 70% of the time (gold tick), with a ${t>=4?25:12}% mutation chance. Traits draw from: ${tpool}.</p></div>`;
  }
  const eggs=S.eggs.map(e=>`<div class="slot"><div class="slot-body"><canvas class="spr" width="56" height="56" data-egg="${e.cols.join(',')}" data-shiny="${e.hybrid?1:0}" aria-label="Egg"></canvas><div><div class="nm">${e.hybrid?'Shimmering egg':'Egg'} of ${esc(e.parents)}</div><p class="status">Hatches in ${e.days} day${e.days===1?'':'s'}${t?'':' (paused)'}</p></div></div></div>`).join('');
  const can=t&&a&&b&&S.coin>=20&&S.food>=3&&S.eggs.length<eggCap();
  return`<div class="cols"><section class="card"><h2>Breeding</h2>
    ${t?`<p class="hint">Pair a proven female and a proven male. The mother sets the species. The father passes on most stats. 20 coin and 3 food per egg.</p>`:`<div class="risk"><b>Nursery offline.</b> Add Wardens (or Warden hybrids) to the Nursery in the Hideout until it reaches tier 1.</div>`}
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))">
      <label class="field">Mother ♀<select id="breedMom" data-act="mom">${opt(moms,ui.mom)}</select></label>
      <label class="field">Father ♂<select id="breedDad" data-act="dad">${opt(dads,ui.dad)}</select></label>
    </div>${pred}
    <div class="row"><button class="btn primary" data-act="breed" ${can?'':'disabled'}>Lay an egg</button><span class="status">Incubator ${S.eggs.length}/${eggCap()}</span></div>
  </section>
  <section class="card"><h2>Incubator</h2>${eggs||'<p class="empty">No eggs yet.</p>'}
    <h3>Known hybrid pairings</h3><p class="hint">Rare when the parents' types match a pairing, in either order. Hybrids have both types and +20% HP and attack.</p>
    <ul class="plain">${HYBRIDS.map(h=>`<li><b>${h.name}</b>: ${TYPES[h.types[0]].name} + ${TYPES[h.types[1]].name}</li>`).join('')}</ul></section></div>`;
}

}

/* ================= Actions ================= */
function act(a,d){
  switch(a){
    case'tab':ui.tab=d.k;ui.sellId=null;ui.resetArm=false;ui.scrapArm=null;renderAll();window.scrollTo(0,0);break;
    case'filter':ui.filter=d.k;renderMain();break;
    case'section':ui.section=d.k;renderMain();break;
    case'close':closeModal();break;
    case'choose':openChooser(+d.slot);break;
    case'pickslot':{const c=byId(+d.id);unplace(c);S.loadout.slots[+d.slot]=c.id;closeModal();save();renderAll();break}
    case'clearslot':S.loadout.slots[+d.slot]=null;closeModal();save();renderAll();break;
    case'deploy':startRaid('raid');break;
    case'scav':startRaid('scav');break;
    case'arena':startRaid('arena');break;
    case'wait':processDay();save();renderAll();break;
    case'assign':{const sel=$('#addsel');if(!sel)break;const c=byId(+sel.value);if(!c||S.sections[d.k].ids.length>=secCap(d.k))break;unplace(c);S.sections[d.k].ids.push(c.id);save();renderAll();break}
    case'unassign':{const c=byId(+d.id);if(c){unplace(c);save();renderAll()}break}
    case'expand':{const ec=expandCost(d.k);if(S.coin<ec.coin||S.ore<ec.ore||S.sections[d.k].cap>=10)break;S.coin-=ec.coin;S.ore-=ec.ore;S.sections[d.k].cap++;save();renderAll();break}
    case'genelab':{const c=byId(+ui.gl.id);if(!c)break;const g=ui.gl.gene,v=c.genes[g],cc={coin:20*(v+1),ore:2*(v+1)};if(v>=10||S.coin<cc.coin||S.ore<cc.ore)break;S.coin-=cc.coin;S.ore-=cc.ore;c.genes[g]=v+1;addLog(`Gene Lab: ${c.name}'s ${GENES[g]} rose to ${v+1}.`);save();renderAll();break}
    case'tutor':{const c=byId(+ui.tt.id);if(!c||S.coin<60||S.ore<8)break;S.coin-=60;S.ore-=8;const i=+ui.tt.slot||0;const old=c.traits[i];c.traits[i]=rollTraits(1,c.traits,true)[0];addLog(`Trait Tutor: ${c.name} swapped ${TRAITS[old].name} for ${TRAITS[c.traits[i]].name}.`);save();renderAll();break}
    case'feed':{const c=byId(+d.id);if(S.food<1)break;S.food--;c.bond=Math.min(100,c.bond+10);c.hp=Math.min(stats(c).hp,c.hp+Math.round(stats(c).hp*.2));save();renderAll();break}
    case'sell':{const c=byId(+d.id);if(ui.sellId!==c.id){ui.sellId=c.id;renderMain();break}
      S.coin+=sellValue(c);unplace(c);S.creatures=S.creatures.filter(x=>x!==c);ui.sellId=null;addLog(`Sold ${c.name} for ${sellValue(c)} coin.`);save();renderAll();break}
    case'breed':breed();break;
    case'craft':{const g=GUNS[d.k],cost=WEAPON_COST[g.tier];if(!canCraft(d.k)||S.coin<cost.coin||S.ore<cost.ore)break;S.coin-=cost.coin;S.ore-=cost.ore;S.guns[d.k]=(S.guns[d.k]||0)+1;addLog(`The Forge made a ${g.name}.`);save();renderAll();break}
    case'scrap':{const g=GUNS[d.k];if(!(S.guns[d.k]>0))break;if(ui.scrapArm!==d.k){ui.scrapArm=d.k;renderMain();break}ui.scrapArm=null;
      const ore=Math.round(SCRAP_ORE[g.tier]*(secTier('forge')>=3?1.5:1));S.guns[d.k]--;S.ore+=ore;S.blueprints[d.k]=1;validGuns();addLog(`Scrapped a ${g.name} for ${ore} ore.`);save();renderAll();break}
    case'donate':{const g=GUNS[d.k];if(!(S.guns[d.k]>0)||!sectionUnlockedArmory())break;const before=armoryTier();S.guns[d.k]--;S.armory+=DONATE_PTS[g.tier];S.blueprints[d.k]=1;validGuns();
      addLog(`Donated a ${g.name} to the Armory (+${DONATE_PTS[g.tier]} pts).${armoryTier()>before?' Armory tier '+armoryTier()+' reached: '+ARMORY_TIERS[armoryTier()-1]+'.':''}`);save();renderAll();break}
    case'gilded':if(secTier('forge')>=3&&S.coin>=25&&S.ore>=2){S.coin-=25;S.ore-=2;S.cages.gilded++;save();renderAll()}break;
    case'buy-food':if(S.coin>=5){S.coin-=5;S.food++;save();renderAll()}break;
    case'buy-food10':if(S.coin>=42){S.coin-=42;S.food+=10;save();renderAll()}break;
    case'buy-cage':if(S.coin>=15){S.coin-=15;S.cages.basic++;save();renderAll()}break;
    case'buy-ore':if(S.coin>=18){S.coin-=18;S.ore++;save();renderAll()}break;
    case'sell-ore':if(S.ore>0){S.ore--;S.coin+=8;save();renderAll()}break;
    case'opt':S.opts[d.k]=d.v;save();renderMain();break;
    case'lab-spawn':{const L=ui.lab;const lv=clamp(+L.level||1,1,40);
      let traits=null;if(L.t1||L.t2){traits=[];if(L.t1)traits.push(L.t1);if(L.t2&&L.t2!==L.t1)traits.push(L.t2);while(traits.length<2)traits.push(rollTraits(1,traits)[0])}
      const c=makeCreature(L.species,L.origin,lv,{proven:L.proven,sex:L.sex==='R'?null:L.sex,traits,genes:L.max?{vig:10,pow:10,swf:10,hst:10,tmp:10}:undefined,bond:L.origin==='wild'?20:100,captureRaid:L.origin==='wild'&&!L.proven?S.stats.raids:-1});
      S.creatures.push(c);addLog(`Test Lab: added ${c.name}, a ${sexSym(c.sex)} ${L.origin} ${SPECIES[c.species].name} at Lv ${lv}.`);save();renderAll();break}
    case'lab-squad':{for(let i=0;i<10;i++){const sp=pick(SPECIES_IDS.filter(k=>!SPECIES[k].hybrid));S.creatures.push(makeCreature(sp,'bred',10))}addLog('Test Lab: added 10 Lv 10 creatures.');save();renderAll();break}
    case'lab-floor':startRaid('raid',+d.k);break;
    case'lab-res':{const k=d.k;if(k==='coin')S.coin+=500;if(k==='food')S.food+=50;if(k==='ore')S.ore+=50;if(k==='cage')S.cages.basic+=5;
      if(k==='guns')GUN_IDS.forEach(g=>{if(g!=='pistol')S.guns[g]=Math.max(1,S.guns[g]||0)});if(k==='bp')GUN_IDS.forEach(g=>S.blueprints[g]=1);
      if(k==='keeper'){addKeeperXp(keeperNeed()-S.keeper.xp)}save();renderAll();break}
    case'lab-heal':S.creatures.forEach(c=>c.hp=stats(c).hp);save();renderAll();break;
    case'lab-prove':S.creatures.forEach(c=>c.proven=true);save();renderAll();break;
    case'lab-xp':S.loadout.slots.map(byId).filter(Boolean).forEach(c=>{c.level=Math.min(40,c.level+5);c.hp=stats(c).hp});save();renderAll();break;
    case'lab-hatch':{const n=S.eggs.length;S.eggs.forEach(e=>S.creatures.push(e.child));S.eggs=[];if(n)addLog(`Test Lab: hatched ${n} egg${n>1?'s':''}.`);save();renderAll();break}
    case'reset':if(!ui.resetArm){ui.resetArm=true;renderMain();break}ui.resetArm=false;newGame();save();ui.tab='raid';renderAll();break;
  }
}
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return}
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;
  if(b.closest('#raid'))return;

});
document.addEventListener('change',e=>{
  const el=e.target,a=el.dataset.act;if(!a)return;
  if(a==='gunsel'){S.loadout.guns[+el.dataset.slot]=el.value||null;validGuns();save();renderMain()}
  else if(a==='mom'){ui.mom=el.value;renderMain()}
  else if(a==='dad'){ui.dad=el.value;renderMain()}
  else if(a==='glc'){ui.gl.id=el.value;renderMain()}
  else if(a==='glg'){ui.gl.gene=el.value;renderMain()}
  else if(a==='ttc'){ui.tt.id=el.value;ui.tt.slot='0';renderMain()}
  else if(a==='tts'){ui.tt.slot=el.value}
  else if(a==='lab'){const k=el.dataset.k;ui.lab[k]=el.type==='checkbox'?el.checked:el.value}
  else if(a==='setting'){S.settings[el.dataset.k]=el.checked;save()}
  else if(a==='mode'){S.modes[el.dataset.k]=el.checked;save()}
  else if(a==='optc'){S.opts[el.dataset.k]=el.checked;save()}
  else if(a==='opthud'){S.opts.hudAlpha=+el.value;save()}
});

/* ================= Raid engine ================= */
const TS=32,RW=15,RH=11,CW=RW+6,CH=RH+6;
let R=null,raf=0;
const keys=new Set();
const touch={move:null,aim:null};
const localFloor=f=>(f-1)%3+1;
const isBossFloor=f=>f%3===0;

function rollWildSpecies(floor,lair){
  const rareMul=(floor===1?1:floor===2?2:floor>=4?3.5:3)*(lair?2:1);
  const type=wpick(TYPE_IDS,t=>{const T=TYPES[t];return T.weight*(T.tier===3?rareMul:T.tier===4?(floor>=3?2:1):1)});
  return wpick(speciesOf(type),k=>SPECIES[k].w*(SPECIES[k].w===1?(floor>=2?2:1):1));
}
function genMap(floor,arena,bossId){
  const G=arena?1:4,rooms=[],grid={};const key=(x,y)=>x+','+y;const loc=localFloor(floor),set=floor>=4?1:0;
  const add=(gx,gy,kind)=>{const r={gx,gy,ox:gx*CW+3,oy:gy*CH+3,links:[],kind:kind||'fight',spawned:false,cleared:false,locked:false,visited:false,doors:[],idx:rooms.length};rooms.push(r);grid[key(gx,gy)]=r;return r};
  const start=add(arena?0:ri(0,3),arena?0:ri(0,3));
  const target=arena?1:8+loc;let guard=0;
  while(rooms.length<target&&guard++<1000){const a=pick(rooms);const[dx,dy]=pick([[1,0],[-1,0],[0,1],[0,-1]]);const nx=a.gx+dx,ny=a.gy+dy;
    if(nx<0||ny<0||nx>=G||ny>=G||grid[key(nx,ny)])continue;const b=add(nx,ny);a.links.push(b);b.links.push(a)}
  start.dist=0;const q=[start];while(q.length){const r=q.shift();for(const n of r.links)if(n.dist==null){n.dist=r.dist+1;q.push(n)}}
  start.kind=arena?'arena':'start';start.cleared=true;start.visited=true;
  const cracks=new Map();
  if(!arena){
    const others=rooms.filter(r=>r!==start).sort((a,b)=>b.dist-a.dist);let i=0;const set1=k=>{if(others[i])others[i++].kind=k};
    if(isBossFloor(floor)){set1('boss');set1('rift');set1('cliff')}else{set1('stairs');set1('gate')}
    if(loc>=2)set1('lair');
    const rest=shuffle(others.slice(i));let j=0;const put=k=>{if(rest[j])rest[j++].kind=k};
    put('chest');put('chest');
    if(Math.random()<.75)put('shop');
    if(Math.random()<.25)put('shrine');
    const pool=foePool(floor),newIntro=loc+set*3;
    const swarm=S.modes.swarm&&modeUnlocked('swarm')?2:0;
    const wildMul=(S.modes.hunter&&modeUnlocked('hunter')?2:1)*(secTier('roost')>=4?1.3:1);
    for(const r of rooms){
      if(['start','shop','shrine','boss'].includes(r.kind))continue;
      const base={fight:[3,4],chest:[1,2],stairs:[3,4],gate:[2,3],rift:[3,4],cliff:[2,3],lair:[3,4]}[r.kind];
      const n=ri(base[0],base[1])+(loc-1)+swarm;
      const wc=r.kind==='lair'?(Math.random()<.5?1:0):(Math.random()<(loc===3?.26:.2)*wildMul?1:0);
      const foes=[];while(foes.length<n-wc)foes.push(wpick(pool,k=>FOES[k].intro===newIntro?2.2:1));
      r.plan={foes,wilds:Array.from({length:wc},()=>rollWildSpecies(floor,r.kind==='lair')),elite:r.kind==='lair'};
    }
    if(bossId)rooms.find(r=>r.kind==='boss').bossId=bossId;
    // secret room behind a cracked wall
    if(Math.random()<.65){
      const hosts=shuffle(rooms.filter(r=>!['boss','start'].includes(r.kind)));
      outer:for(const h of hosts)for(const[dx,dy]of shuffle([[1,0],[-1,0],[0,1],[0,-1]])){const nx=h.gx+dx,ny=h.gy+dy;if(nx<0||ny<0||nx>=G||ny>=G||grid[key(nx,ny)])continue;
        const s=add(nx,ny,'secret');s.hidden=true;s.host=h;s.links.push(h);h.links.push(s);s.chest={x:0,y:0,open:false,rich:true};
        s.plan={foes:[],wilds:Math.random()<.4?[rollWildSpecies(floor,true)]:[]};break outer}
    }
  }
  const W=G*CW,H=G*CH,tiles=new Uint8Array(W*H),doorOwner=new Map();
  for(const r of rooms)for(let j=0;j<RH;j++)for(let i=0;i<RW;i++)tiles[(r.oy+j)*W+r.ox+i]=1;
  const done=new Set();
  for(const a of rooms)for(const b of a.links){
    const k=Math.min(a.idx,b.idx)+'-'+Math.max(a.idx,b.idx);if(done.has(k))continue;done.add(k);
    const[p,q2]=(a.gx<b.gx||a.gy<b.gy)?[a,b]:[b,a];
    const sec=p.kind==='secret'?p:q2.kind==='secret'?q2:null,host=sec?(sec===p?q2:p):null;
    const crack=sec?{hp:60+floor*20,tiles:[],room:sec,broken:false}:null;
    const door=(i,r)=>{if(sec){if(r===host){tiles[i]=4;crack.tiles.push(i);cracks.set(i,crack)}else tiles[i]=1;return}tiles[i]=3;doorOwner.set(i,r);r.doors.push(i)};
    if(p.gy===q2.gy){const cy=p.oy+(RH>>1);
      for(let x=p.ox+RW;x<q2.ox;x++)for(let y=cy-1;y<=cy+1;y++)tiles[y*W+x]=1;
      for(let y=cy-1;y<=cy+1;y++){door(y*W+p.ox+RW,p);door(y*W+q2.ox-1,q2)}
    }else{const cx=p.ox+(RW>>1);
      for(let y=p.oy+RH;y<q2.oy;y++)for(let x=cx-1;x<=cx+1;x++)tiles[y*W+x]=1;
      for(let x=cx-1;x<=cx+1;x++){door((p.oy+RH)*W+x,p);door((q2.oy-1)*W+x,q2)}
    }
  }
  for(const r of rooms){
    if(['fight','lair','chest','arena'].includes(r.kind)){
      const n=r.kind==='arena'?4:ri(0,3);
      for(let k=0;k<n;k++){const px=r.ox+ri(2,RW-4),py=r.oy+ri(2,RH-4);
        if(Math.abs(px+1-(r.ox+RW/2))<3.5&&Math.abs(py+1-(r.oy+RH/2))<3)continue;
        for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)tiles[(py+dy)*W+px+dx]=2}
    }
    r.cx=(r.ox+RW/2)*TS;r.cy=(r.oy+RH/2)*TS;
    if(r.kind==='chest'||r.kind==='lair')r.chest={x:r.cx,y:r.cy,open:false};
    if(r.kind==='secret'){r.chest.x=r.cx;r.chest.y=r.cy}
  }
  return{G,W,H,tiles,doorOwner,cracks,rooms,grid,start,floor,arena:!!arena};
}
function solidAt(M,tx,ty){if(tx<0||ty<0||tx>=M.W||ty>=M.H)return true;const i=ty*M.W+tx,t=M.tiles[i];if(t===1)return false;if(t===3)return M.doorOwner.get(i).locked;return true}
function hitsWall(x,y,r){const M=R.map;const x0=Math.floor((x-r)/TS),x1=Math.floor((x+r)/TS),y0=Math.floor((y-r)/TS),y1=Math.floor((y+r)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solidAt(M,tx,ty))return true;return false}
function moveEnt(e,dx,dy){let moved=false;if(!hitsWall(e.x+dx,e.y,e.r)){e.x+=dx;moved=true}if(!hitsWall(e.x,e.y+dy,e.r)){e.y+=dy;moved=true}return moved}
function roomAt(x,y,m=0){

function paintTile(g,M,x,y,pal){
  const walk=(x,y)=>{if(x<0||y<0||x>=M.W||y>=M.H)return false;const t=M.tiles[y*M.W+x];return t===1||t===3};
  if(walk(x,y)){g.fillStyle=(x+y)%2?pal.a:pal.b;g.fillRect(x*TS,y*TS,TS,TS);if(Math.random()<.18){g.fillStyle=pal.fl;g.fillRect(x*TS+ri(4,24),y*TS+ri(4,24),ri(2,5),ri(2,4))}return}
  let near=false;for(let dy=-1;dy<=1&&!near;dy++)for(let dx=-1;dx<=1;dx++)if(walk(x+dx,y+dy)){near=true;break}
  if(!near&&M.tiles[y*M.W+x]!==4)return;
  g.fillStyle=pal.wall;g.fillRect(x*TS,y*TS,TS,TS);
  g.fillStyle=pal.top;g.fillRect(x*TS,y*TS,TS,6);
  g.fillStyle=pal.edge;g.fillRect(x*TS,y*TS+TS-4,TS,4);
  if(walk(x,y+1)){g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x*TS,(y+1)*TS,TS,6)}
  g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x*TS+(y%2?4:18),y*TS+12,10,2);
  if(M.tiles[y*M.W+x]===4){g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=1.5;g.beginPath();g.moveTo(x*TS+8,y*TS+8);g.lineTo(x*TS+15,y*TS+16);g.lineTo(x*TS+11,y*TS+24);g.moveTo(x*TS+15,y*TS+16);g.lineTo(x*TS+24,y*TS+19);g.stroke()}

function enterRoom(r){

  if(!r.plan)return;
  const f=R.map.floor;
  r.plan.foes.forEach((id,i)=>spawnFoe(spawnPos(r),id,f,r,r.plan.elite&&i===0));
  r.plan.wilds.forEach(s=>spawnWild(spawnPos(r),s,r));
  if(r.kind==='secret'){if(r.plan.wilds.length)msg(`A wild ${SPECIES[r.plan.wilds[0]].name} hides in the secret room.`);return}
  if(R.enemies.some(e=>e.room===r)){
    r.locked=true;
    R.comps.forEach(m=>{if(m&&!roomAt(m.x,m.y,8)){m.x=R.p.x+rnd(-20,20);m.y=R.p.y+rnd(-20,20)}});

    if(w.length){const rare=w.find(s=>SPECIES[s].w===1||TYPES[SPECIES[s].type].tier>=3);msg(rare?`Doors sealed. A rare ${SPECIES[rare].name} is here!`:`Doors sealed. A wild ${SPECIES[w[0]].name} is here.`)}

function pickTarget(e){
  if(R.taunt>0&&R.tauntEnt&&!R.tauntEnt.downed)return R.tauntEnt;
  let best=R.p,bd=dist(e,R.p);
  for(const m of R.comps){if(!m||m.downed)continue;const d=dist(e,m)*1.6;if(d<bd){bd=d;best=m}}
  return best;
}
function explodeAt(x,y,rad,dmg,team,src){
  R.fx.push({x,y,r:rad,t:.35,max:.35,col:team==='e'?'#ff6b6b':'#ffcf4a',fill:true});
  if(team==='e'){if(dist({x,y},R.p)<rad+R.p.r)hurtPlayer(dmg)}
  else{R.enemies.forEach(e=>{if(e.hp>0&&dist({x,y},e)<rad+e.r)hurtEnemy(e,dmg,false,src||'p')});crackHitArea(x,y,rad,dmg)}
}
function crackHitArea(x,y,rad,dmg){
  const M=R.map;if(!M.cracks.size)return;
  for(const[i]of M.cracks){const cx=(i%M.W+.5)*TS,cy=(Math.floor(i/M.W)+.5)*TS;if(Math.hypot(cx-x,cy-y)<rad+16){damageCrack(i,dmg);return}}
}

/* ---------- player actions ---------- */
function useAbility(i){
  const m=R.comps[i];if(!m){msg('That combat slot is empty.');return}
  if(m.downed){msg(`${m.c.name} is down.`);return}
  if(m.abil>0)return;
  const max=8*m.st.abil*Math.max(.4,1-.25*B('abil'));
  if(Math.random()>m.obey){m.abil=max*.5;float(m.x,m.y-26,'Ignores you','#ff6688',true);return}
  m.abil=max;const T=abilType(m.c),atk=m.atk*(1+.2*B('pdmg'));
  if(T==='ember'){for(let k=0;k<12;k++)shoot('p',m.x,m.y,k/12*Math.PI*2,360,atk*1.3,{col:TYPES.ember.color,r:6,src:m});float(m.x,m.y-26,'Flame Ring','#ff7a3d',true)}
  else if(T==='fungal'){const tg=nearestEnemy(m,420)||{x:R.p.x+Math.cos(R.aim)*120,y:R.p.y+Math.sin(R.aim)*120};R.fields.push({x:tg.x,y:tg.y,r:110,t:4,dps:atk*.9,src:m});float(m.x,m.y-26,'Spore Field','#e0527a',true)}
  else if(T==='tide'){R.shield=3;healPlayer(20);float(R.p.x,R.p.y-26,'Shielded','#58c2ff',true)}
  else if(T==='echo'){R.enemies.forEach(e=>{if(dist(e,m)<240){if(e.kind!=='boss'){e.stun=1.6;e.wind=0}hurtEnemy(e,atk*critMul(m.st),false,m)}});R.fx.push({x:m.x,y:m.y,r:240,t:.4,max:.4,col:'#9b7bff'})}
  else if(T==='gale'){const tg=nearestEnemy(m,420);if(!tg){m.abil=1;float(m.x,m.y-26,'No target','#b4a9d8',true);return}const a=Math.atan2(tg.y-m.y,tg.x-m.x);m.dash=.32;m.dvx=Math.cos(a)*620;m.dvy=Math.sin(a)*620;m.dashHit=new Set();m.dashDmg=atk*2.5;float(m.x,m.y-26,'Gust Dash','#4fe0c8',true)}
  else if(T==='crystal'){R.prism=3;float(R.p.x,R.p.y-26,'Prism Ward','#ff8fe0',true)}
  else if(T==='warden'){R.taunt=4;R.tauntEnt=m;float(m.x,m.y-26,'Taunt!','#e3b04b',true)}
}
function doRoll(){
  const p=R.p;if(p.rollCd>0||p.roll>0)return;
  let{mx,my}=moveVec();if(!mx&&!my){mx=Math.cos(R.aim);my=Math.sin(R.aim)}
  const l=Math.hypot(mx,my)||1;p.roll=.3;p.rollCd=.75*Math.pow(.65,B('roll'));p.rvx=mx/l*440;p.rvy=my/l*440;
}
function cageReady(){const rad=capRadius();return!R.slot3&&R.enemies.some(e=>e.kind==='wild'&&e.hp>0&&(S.settings.instant||e.hp/e.maxHp<=.5)&&dist(e,R.p)<rad+e.r)}
function useCage(){
  if(R.slot3){msg('Slot 3 is full. A caught creature needs a free slot 3.');return}
  const kind=R.cages.gilded>0?'gilded':R.cages.basic>0?'basic':null;
  if(!kind){msg('No cages left.');return}
  const rad=capRadius();
  const near=R.enemies.filter(e=>e.kind==='wild'&&e.hp>0&&dist(e,R.p)<rad+e.r);
  if(!near.length){msg('No wild creature inside the cage ring. Get closer.');return}
  const weak=near.filter(e=>S.settings.instant||e.hp/e.maxHp<=.5).sort((a,b)=>dist(a,R.p)-dist(b,R.p));
  if(!weak.length){msg('Weaken it below half health first.');return}
  R.cages[kind]--;
  R.fx.push({x:R.p.x,y:R.p.y,r:rad,t:.45,max:.45,col:'#ffcf4a'});
  tryCapture(weak[0],kind);
}
function swapSlot3(i){
  if(!R.slot3){msg('Slot 3 is empty.');return}
  const cur=R.comps[i];
  if(cur&&cur.downed){msg(`${cur.c.name} is down and can't be swapped out.`);return}
  const inc=R.slot3.c;
  if(cur){cur.c.hp=Math.round(cur.hp/cur.maxHp*stats(cur.c).hp);R.slot3={c:cur.c}}else R.slot3=null;
  const m=makeComp(inc);m.x=R.p.x+(i?20:-20);m.y=R.p.y+10;
  R.comps[i]=m;refreshSupport();
  float(m.x,m.y-26,`Go, ${inc.name}!`,'#ffcf4a',true);
  if(inc.captureRaid===R.id)msg(`Testing ${inc.name}. Wild catches may ignore you.`);
}
function switchGun(){
  if(!R.guns[1-R.active]){msg('Your other weapon slot is empty.');return}
  R.active=1-R.active;R.burst=[];R.spin=0;float(R.p.x,R.p.y-26,GUNS[R.guns[R.active]].name,'#ffe38a',true);
}
function tryCapture(e,kind){
  const hpf=e.hp/e.maxHp,tier=TYPES[e.c.type].tier,rare=SPECIES[e.c.species].w===1?.85:1;
  let ch=(1-hpf)*1.15*(kind==='gilded'?1.7:1)*[1,1,.8,.6,.45][tier]*rare+(partyTrait('lucky')?.1:0)+.1*B('cage');
  if(e.stun>0)ch+=.1;
  if(S.settings.instant||Math.random()<ch){
    const c=e.c;c.hp=stats(c).hp;c.captureRaid=R.id;c.bond=5;
    e.hp=0;e.captured=true;R.slot3={c};refreshSupport();R.caught++;R.kxp+=15;
    float(e.x,e.y-e.r-12,'Caught!','#ffcf4a',true);msg(`Caught ${c.name}, a ${sexSym(c.sex)} ${SPECIES[c.species].name}! ${TOUCH?'Tap ⇄1 or ⇄2':'Press 1 or 2'} to test it.`);
    R.fx.push({x:e.x,y:e.y,r:60,t:.5,max:.5,col:'#ffcf4a'});
    return true;
  }
  float(e.x,e.y-e.r-12,'Broke free!','#ff6688',true);e.stun=0;e.cd=.3;return false;
}
function nearestItem(){let best=null,bd=40;for(const it of R.items){if(it.kind!=='gun')continue;const d=dist(it,R.p);if(d<bd){bd=d;best=it}}return best}
function nearNpc(){const r=R.cur;if(!r||(r.kind!=='shop'&&r.kind!=='shrine'))return null;return dist(R.p,{x:r.cx,y:r.cy})<60?r:null}
function interact(){
  const it=nearestItem();
  if(it){
    R.items=R.items.filter(x=>x!==it);
    if(!R.guns[1]&&R.guns[0]){R.guns[1]=it.id;R.active=1}
    else{const old=R.guns[R.active];R.guns[R.active]=it.id;if(old)R.items.push({kind:'gun',id:old,x:R.p.x+rnd(-14,14),y:R.p.y+18})}
    R.burst=[];R.spin=0;float(R.p.x,R.p.y-26,GUNS[it.id].name,'#ffe38a',true);return;
  }
  const r=nearNpc();if(!r)return;
  if(r.kind==='shop')openShop(r);else openShrine(r);
}

/* ---------- shops and shrines ---------- */
const gunTierRoll=f=>{const l=localFloor(f),s=f>=4;return wpick([1,2,3,4],t=>s?[0,2,5,2][t-1]+(l-1)*[0,0,1,1][t-1]:l===1?[6,3,.6,0][t-1]:l===2?[3,5,2,.3][t-1]:[1,4,5,1][t-1])};
const gunOfTier=t=>pick(GUN_IDS.filter(k=>GUNS[k].tier===t));
function payCoin(n){if(R.bag.coin+S.coin<n)return false;const fb=Math.min(n,R.bag.coin);R.bag.coin-=fb;S.coin-=n-fb;return true}
function openShop(r){
  if(!R.shops[r.idx]){
    const f=R.map.floor,bs=shuffle(BUFF_IDS.filter(k=>k!=='time'||R.mode!=='arena'));
    const gt=gunTierRoll(f),g=gunOfTier(gt);
    R.shops[r.idx]=[{kind:'buff',id:bs[0],price:30+15*f},{kind:'buff',id:bs[1],price:30+15*f},{kind:'gun',id:g,price:[0,55,85,125,170][gt]+10*f},{kind:'heal',price:25+5*f},{kind:'cage',price:30}];
  }
  const offers=R.shops[r.idx];
  showOverlay(`<h2>Wandering Peddler</h2><p class="hint">Pays from coin found this raid first, then your bank. You have ${R.bag.coin} raid coin + ${S.coin} banked.</p>
    <div class="choose-list">${offers.map((o,i)=>{const label=o.kind==='buff'?`${BUFFS[o.id].name}<small>${BUFFS[o.id].desc}</small>`:o.kind==='gun'?`${GUNS[o.id].name}<small>Tier ${GUNS[o.id].tier} ${GUNS[o.id].melee?'melee':'gun'} · ${GUNS[o.id].desc}</small>`:o.kind==='heal'?'Patch Kit<small>Heal yourself and your companions 50%</small>':'Snare Cage<small>One more basic cage for this raid</small>';
      return`<button class="choice" data-p="buy" data-i="${i}" ${o.sold||R.bag.coin+S.coin<o.price?'disabled':''}><span style="flex:1"><span class="nm">${label}</span></span><b style="font-family:var(--display);color:var(--gold)">${o.sold?'Sold':o.price+'c'}</b></button>`}).join('')}</div>
    <button class="btn primary" data-p="resume">Back to the raid</button>`);
  R.shopRoom=r;
}
function buy(i){
  const o=R.shops[R.shopRoom.idx][i];if(!o||o.sold||!payCoin(o.price))return;
  o.sold=true;
  if(o.kind==='buff')applyBuff(o.id,true);
  if(o.kind==='gun')R.items.push({kind:'gun',id:o.id,x:R.p.x+30,y:R.p.y+20});
  if(o.kind==='heal'){healPlayer(R.p.maxHp*.5);R.comps.forEach(m=>{if(m&&!m.downed)m.hp=Math.min(m.maxHp,m.hp+m.maxHp*.5)})}
  if(o.kind==='cage')R.cages.basic++;
  openShop(R.shopRoom);
}
function openShrine(r){
  if(r.used){msg('The shrine has gone quiet.');return}
  if(!r.choices)r.choices=shuffle(BUFF_IDS.filter(k=>k!=='time'||R.mode!=='arena')).slice(0,3);
  showOverlay(`<h2>Old Shrine</h2><p class="hint">Choose one blessing. It lasts until this raid ends.</p>
    <div class="choose-list">${r.choices.map(k=>`<button class="choice" data-p="bless" data-k="${k}"><span class="nm">${BUFFS[k].name}<small>${BUFFS[k].desc}</small></span></button>`).join('')}</div>
    <button class="btn" data-p="resume">Decide later</button>`);
  R.shrineRoom=r;
}

/* ---------- player weapons ---------- */
function moveVec(){
  let mx=0,my=0;
  if(keys.has('KeyW')||keys.has('ArrowUp'))my-=1;if(keys.has('KeyS')||keys.has('ArrowDown'))my+=1;
  if(keys.has('KeyA')||keys.has('ArrowLeft'))mx-=1;if(keys.has('KeyD')||keys.has('ArrowRight'))mx+=1;
  if(touch.move){const r=stickR(),dx=touch.move.x-touch.move.ox,dy=touch.move.y-touch.move.oy,l=Math.hypot(dx,dy);if(l>6){const k=Math.min(1,l/r)/l;mx=dx*k;my=dy*k}}
  else{const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}}
  return{mx,my};
}
function swing(g){
  const p=R.p,a=R.aim,dm=g.dmg*playerDmgMul()*(g.hits||1);
  if(g.lunge){const st=g.lunge/6;for(let i=0;i<6;i++)moveEnt(p,Math.cos(a)*st,Math.sin(a)*st)}
  R.swings.push({x:p.x,y:p.y,a,arc:g.arc,r:g.range,t:.16,max:.16,col:g.col});
  let hit=0;
  for(const e of R.enemies){
    if(e.hp<=0)continue;const d=dist(e,p);if(d>g.range+e.r)continue;
    if(Math.abs(angDiff(Math.atan2(e.y-p.y,e.x-p.x),a))>g.arc/2+Math.atan2(e.r,Math.max(d,1)))continue;
    hurtEnemy(e,dm,false,'p');hit++;
    if(g.knock&&e.kind!=='boss'&&e.spd>0){const k=Math.atan2(e.y-p.y,e.x-p.x);moveEnt(e,Math.cos(k)*g.knock,Math.sin(k)*g.knock)}
  }
  if(g.leech&&hit)healPlayer(dm*g.leech*hit);
  for(let i=R.bullets.length-1;i>=0;i--){const b=R.bullets[i];if(b.team!=='e')continue;const d=dist(b,p);if(d>g.range+b.r+4)continue;
    if(Math.abs(angDiff(Math.atan2(b.y-p.y,b.x-p.x),a))>g.arc/2+.25)continue;
    if(g.reflect){b.team='p';const sp=Math.hypot(b.vx,b.vy)*1.2;const na=Math.atan2(b.y-p.y,b.x-p.x);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;b.dmg=dm*.5;b.col=g.col;b.life=1.2;b.src='p'}
    else{R.bullets.splice(i,1);R.fx.push({x:b.x,y:b.y,r:6,t:.15,max:.15,col:'#fff'})}}
  if(g.shock)explodeAt(p.x+Math.cos(a)*g.range*.7,p.y+Math.sin(a)*g.range*.7,g.shock,dm*.5,'p');
  else crackHitArea(p.x+Math.cos(a)*g.range*.7,p.y+Math.sin(a)*g.range*.7,g.range*.5,dm);
  if(g.wave)shoot('p',p.x+Math.cos(a)*20,p.y+Math.sin(a)*20,a,430,dm*.6,{col:g.col,r:10,pierce:3,life:.8,src:'p'});
}
function fireWeapon(){
  const p=R.p,id=R.guns[R.active];if(!id)return;const g=GUNS[id];
  let rate=g.rate*(1+.15*B('rate'));
  if(g.melee){swing(g);p.fireCd=1/rate;return}
  const dm=g.dmg*playerDmgMul();
  const o={col:g.col,r:g.r||4,pierce:(g.pierce||0)+B('pierce'),life:g.life||1.2,bounce:g.bounce,explode:g.explode,split:g.split,homing:g.homing,src:'p'};
  const mx=p.x+Math.cos(R.aim)*16,my=p.y+Math.sin(R.aim)*16;
  const one=(ang)=>shoot('p',mx,my,ang,g.speed*rnd(.94,1.04),dm,o);
  if(g.ring){for(let k=0;k<g.ring;k++)one(R.aim+k/g.ring*Math.PI*2)}
  else if(g.burst){for(let k=0;k<g.burst;k++)R.burst.push({t:k*g.burstGap,f:()=>one(R.aim+rnd(-g.spread,g.spread))})}
  else for(let k=0;k<(g.pellets||1);k++)one(R.aim+rnd(-(g.spread||0),g.spread||0));
  if(g.spin)rate*=.3+.7*R.spin;
  p.fireCd=1/rate;
}

/* ---------- update ---------- */
function update(dt){
  R.t+=dt;const p=R.p;
  if(R.mode!=='arena'&&!S.settings.noTimer){R.time-=dt;if(R.time<=0){endRaid('collapse');return}}
  R.shield=Math.max(0,R.shield-dt);R.prism=Math.max(0,R.prism-dt);R.taunt=Math.max(0,R.taunt-dt);R.shake=Math.max(0,(R.shake||0)-dt);
  if(R.msgT>0)R.msgT-=dt;
  if(touch.aim){const dx=touch.aim.x-touch.aim.ox,dy=touch.aim.y-touch.aim.oy,l=Math.hypot(dx,dy);if(l>12){R.aim=Math.atan2(dy,dx);R.firing=S.opts.autoFire||l>stickR()*.6}else R.firing=false}
  else if(R.mouse){const s=R.scale;const wx=(R.mouse.x-R.vw/2)/s+R.camx,wy=(R.mouse.y-R.vh/2)/s+R.camy;R.aim=Math.atan2(wy-p.y,wx-p.x)}
  p.rollCd-=dt;p.inv=Math.max(0,p.inv-dt);p.hurt=Math.max(0,p.hurt-dt);p.slow=Math.max(0,p.slow-dt);p.fireCd-=dt;
  if(R.sup.has('tide'))healPlayer(dt);
  if(p.roll>0){p.roll-=dt;moveEnt(p,p.rvx*dt,p.rvy*dt)}
  else{const{mx,my}=moveVec();const sp=200*(R.sup.has('gale')?1.1:1)*(1+.12*B('speed'))*(p.slow>0?.6:1);moveEnt(p,mx*sp*dt,my*sp*dt);if(!R.mouse&&!touch.aim&&(mx||my))R.aim=Math.atan2(my,mx)}
  if(!R.trail.length||dist(R.trail[0],p)>12){R.trail.unshift({x:p.x,y:p.y});if(R.trail.length>60)R.trail.pop()}
  const gun=R.guns[R.active]?GUNS[R.guns[R.active]]:null;
  if(gun&&gun.spin)R.spin=R.firing?Math.min(1,R.spin+dt):Math.max(0,R.spin-dt*2);
  for(let i=R.burst.length-1;i>=0;i--){R.burst[i].t-=dt;if(R.burst[i].t<=0){R.burst[i].f();R.burst.splice(i,1)}}
  if(R.firing&&p.fireCd<=0&&p.roll<=0&&!R.burst.length)fireWeapon();
  R.comps.forEach((m,i)=>m&&updComp(m,dt,i));
  R.enemies.forEach(e=>e.kind==='boss'?updBoss(e,dt):updEnemy(e,dt));
  updBullets(dt);if(R.over)return;
  R.fields.forEach(f=>{f.t-=dt;R.enemies.forEach(e=>{if(dist(e,f)<f.r+e.r){if(e.kind!=='boss')e.slow=.3;hurtEnemy(e,f.dps*dt,true,f.src)}})});R.fields=R.fields.filter(f=>f.t>0);
  for(const e of R.enemies)if(e.hp<=0&&!e.gone){e.gone=true;onEnemyDeath(e)}
  R.enemies=R.enemies.filter(e=>!e.gone);
  const r=roomAt(p.x,p.y,22);
  if(r){R.cur=r;if(!r.spawned)enterRoom(r);r.visited=true;if(r.hidden)r.hidden=false;if(!r.spawned)r.spawned=true}
  else{const r2=roomAt(p.x,p.y,0);if(r2)R.cur=r2}
  R.map.rooms.forEach(rm=>{if(rm.locked&&!R.enemies.some(e=>e.room===rm)){rm.locked=false;rm.cleared=true;if(rm.kind!=='boss')msg('Room clear. The doors open.')}else if(rm.spawned&&!rm.locked)rm.cleared=true});
  R.map.rooms.forEach(rm=>{if(rm.chest&&!rm.chest.open&&!rm.locked&&dist(p,rm.chest)<34)openChest(rm)});
  for(let i=R.items.length-1;i>=0;i--){const it=R.items[i];if((it.kind==='buff'||it.kind==='loot')&&dist(it,p)<26){R.items.splice(i,1);if(it.kind==='buff')applyBuff(it.id);else takeLoot(it)}}
  if(!R.heardCrack&&R.map.cracks.size&&partyHas('echo')){for(const[i]of R.map.cracks){const cx=(i%R.map.W+.5)*TS,cy=(Math.floor(i/R.map.W)+.5)*TS;if(Math.hypot(cx-p.x,cy-p.y)<260){R.heardCrack=true;msg('Your Echo hears a hollow wall nearby.');break}}}
  objectives(dt);
  R.floats.forEach(f=>{f.t-=dt*.9;f.y-=24*dt});R.floats=R.floats.filter(f=>f.t>0);
  R.fx.forEach(f=>f.t-=dt);R.fx=R.fx.filter(f=>f.t>0);
  R.swings.forEach(s=>s.t-=dt);R.swings=R.swings.filter(s=>s.t>0);
}
function compAttack(m,tgt){
  const a=Math.atan2(tgt.y-m.y,tgt.x-m.x),T=m.c.type,at=m.at,atk=m.atk*critMul(m.st)*(1+.2*B('pdmg')),rate=m.st.rate,reach=m.st.reach;
  const col=SPECIES[m.c.species].col,base={col,src:m,life:1.3*reach};
  const spread=(n,sp,fn)=>{for(let i=0;i<n;i++){const t=n===1?0:i/(n-1)-.5;fn(a+t*sp*(n-1))}};
  if(T==='ember'){spread([1,2,3,3][at],.12,x=>shoot('p',m.x,m.y,x,380*reach,atk,{...base,r:5,explode:at>=3?40:0}));m.cd=1.1/rate}
  else if(T==='fungal'){spread([1,2,3,3][at],.2,x=>shoot('p',m.x,m.y,x,260*reach,atk*.8,{...base,r:6,slow:at>=2?1.8:1.2,explode:at>=3?50:0}));m.cd=1.3/rate}
  else if(T==='tide'){spread([1,1,2,3][at],.15,x=>shoot('p',m.x,m.y,x,280*reach,atk*.75,{...base,r:6,pierce:at>=1?1:0,bounce:at>=3?1:0}));m.cd=1.2/rate}
  else if(T==='echo'){spread([2,3,4,4][at],.08,x=>shoot('p',m.x,m.y,x,420*reach,atk*.6,{...base,r:4,pierce:at>=2?1:0,homing:at>=3?2.5:0}));m.cd=1/rate}
  else if(T==='crystal'){spread([3,5,5,7][at],.12,x=>shoot('p',m.x,m.y,x,340*reach,atk*.5,{...base,r:4,pierce:at>=2?1:0}));m.cd=1.4/rate}
}
function updComp(m,dt,idx){

    let kept='';
    const caught=[R.slot3&&R.slot3.c,...R.comps.map(m=>m&&m.c)].filter(c=>c&&c.captureRaid==='arena');
    caught.forEach(c=>{c.captureRaid=S.stats.raids;if(S.settings.keepArena){S.creatures.push(c);kept+=c.name+' '}});
    exitRaid();

  }

      if(!c.proven&&c.captureRaid>=0&&c.captureRaid<R.id){c.proven=true;L.proven.push(`${c.name} is proven. Traits: ${c.traits.map(t=>TRAITS[t].name).join(', ')}`)}

}
