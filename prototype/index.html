<title>GeneSling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: sticky resource header + tab rail over one working panel; raids take over the screen as a canvas overlay */
:root{
  --night:#17122e; --deep:#0e0a1f; --panel:#231b45; --panel2:#2d2457; --line:#4b3e87;
  --ink:#f6eedb; --muted:#b4a9d8; --gold:#ffcf4a; --gold-d:#b5861b; --mint:#5de8b0; --rose:#ff6688; --sky:#58c2ff;
  --display:'Pixelify Sans','Courier New',monospace; --body:'Alegreya Sans','Trebuchet MS',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px),radial-gradient(rgba(255,207,74,.06) 1px,transparent 1.2px);
  background-size:26px 26px,57px 57px;background-position:0 0,13px 9px}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0}
.app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--night);padding-block:12px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;border-bottom:2px solid var(--line)}
.brand{font-family:var(--display);font-size:1.7rem;font-weight:700;color:var(--gold);text-shadow:2px 2px 0 var(--rose),4px 4px 0 var(--deep);letter-spacing:.04em}
.res{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.pill{font-family:var(--display);font-size:.92rem;background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{color:var(--gold);font-weight:600}
.pill small{color:var(--muted);font-family:var(--body);font-size:.78rem}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--display);background:var(--panel);border:0;box-shadow:0 0 0 2px var(--line);padding:7px 14px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--gold);color:var(--deep);box-shadow:0 0 0 2px var(--gold-d)}
.tab:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
main{padding-top:12px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);box-shadow:0 0 0 2px var(--line),5px 5px 0 0 var(--deep);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hint{color:var(--muted);font-size:.95rem;max-width:65ch}
.btn{font-family:var(--display);background:var(--panel2);border:0;box-shadow:0 0 0 2px var(--line),0 3px 0 2px var(--deep);padding:7px 12px;cursor:pointer;transition:transform .05s}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--gold);color:var(--deep);box-shadow:0 0 0 2px var(--gold-d),0 3px 0 2px var(--gold-d)}
.btn.danger{background:#5a1d33;box-shadow:0 0 0 2px var(--rose),0 3px 0 2px #2d0b18}
.btn.small{padding:4px 9px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-block;font-family:var(--display);font-size:.78rem;padding:1px 7px;background:var(--panel2);box-shadow:0 0 0 1.5px var(--line);white-space:nowrap}
.chip.type{background:var(--c);color:var(--deep);box-shadow:0 0 0 1.5px var(--deep)}
.chip.warn{background:#5c4410;color:var(--gold);box-shadow:0 0 0 1.5px var(--gold-d)}
.chip.good{background:#123d33;color:var(--mint);box-shadow:0 0 0 1.5px #1f7a62}
.chip.bad{background:#4a1528;color:var(--rose);box-shadow:0 0 0 1.5px var(--rose)}
.bar{height:8px;background:var(--deep);box-shadow:0 0 0 1.5px var(--line);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--mint)}
.bar.hp>i{background:var(--mint)}
.bar.low>i{background:var(--rose)}
canvas.spr{image-rendering:pixelated;background:var(--deep);box-shadow:0 0 0 2px var(--line);flex:none}
.cre{display:flex;gap:12px;background:var(--panel);box-shadow:0 0 0 2px var(--line),5px 5px 0 0 var(--deep);padding:12px;min-width:0}
.cre-main{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.cre-name{font-family:var(--display);font-size:1.12rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cre-name .lv{color:var(--gold);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0;font-variant-numeric:tabular-nums}
.stats div{background:var(--deep);padding:3px 6px}
.stats dt{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stats dd{margin:0;font-family:var(--display)}
.genes{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:.85rem}
.genes .g{height:6px;background:var(--deep);position:relative}
.genes .g i{position:absolute;inset:0 auto 0 0;background:var(--sky)}
.genes span:last-child{font-family:var(--display);font-variant-numeric:tabular-nums}
.trait{font-size:.9rem}
.trait b{font-family:var(--display);font-weight:600;color:var(--gold)}
.status{font-size:.85rem;color:var(--muted)}
.slots{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.slots{grid-template-columns:minmax(0,1fr)}}
.slot{background:var(--deep);box-shadow:0 0 0 2px var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.slot.support{box-shadow:0 0 0 2px var(--sky)}
.slot-label{font-family:var(--display);font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.slot-body{display:flex;gap:10px;align-items:center;min-width:0}
.slot-body .nm{font-family:var(--display);font-size:1.05rem}
.guns{display:flex;flex-wrap:wrap;gap:8px}
.gun{background:var(--deep);border:0;box-shadow:0 0 0 2px var(--line);padding:8px 10px;cursor:pointer;text-align:left;min-width:150px;flex:1}
.gun[aria-pressed="true"]{box-shadow:0 0 0 2px var(--gold),0 0 0 4px var(--gold-d)}
.gun b{font-family:var(--display);display:block}
.gun small{color:var(--muted)}
.risk{background:#2c1230;box-shadow:0 0 0 2px var(--rose);padding:10px 12px;font-size:.95rem}
.risk b{color:var(--rose);font-family:var(--display);font-weight:600}
.station{gap:10px}
.station-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.workers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.worker{background:var(--deep);padding:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.worker select{width:100%;background:var(--panel2);border:0;box-shadow:0 0 0 1.5px var(--line);padding:4px}
.worker .lab{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.log li{background:var(--deep);padding:6px 10px;font-size:.92rem}
.log li span{font-family:var(--display);color:var(--gold);margin-right:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--display);text-align:right}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.field select,.field input[type=number]{background:var(--deep);border:0;box-shadow:0 0 0 1.5px var(--line);padding:6px}
.toggle{display:flex;gap:8px;align-items:center;cursor:pointer}
.empty{color:var(--muted);font-style:italic}
kbd{font-family:var(--display);background:var(--deep);box-shadow:0 0 0 1.5px var(--line);padding:0 5px;font-size:.85rem}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
/* modal */
#modal{position:fixed;inset:0;z-index:80;background:rgba(8,5,20,.78);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--panel);box-shadow:0 0 0 2px var(--gold-d),6px 6px 0 0 var(--deep);padding:18px;width:min(560px,100%);max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.choose-list{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:center;background:var(--deep);border:0;box-shadow:0 0 0 2px var(--line);padding:8px;cursor:pointer;text-align:left;width:100%}
.choice:hover{box-shadow:0 0 0 2px var(--gold)}
.choice .nm{font-family:var(--display)}
.choice small{color:var(--muted);display:block}
.res-title{font-size:1.6rem}
.res-title.win{color:var(--mint)}
.res-title.lose{color:var(--rose)}
/* raid overlay: stats top-left, map top-right, actions on the right edge above the aim thumb; bottom of the screen stays clear for both sticks */
#raid{position:fixed;inset:0;z-index:50;background:var(--deep);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:absolute;pointer-events:none;font-family:var(--display)}
.lcol{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;width:min(210px,50vw);display:flex;flex-direction:column;gap:5px;pointer-events:none}
.hud-top{font-family:var(--display);background:rgba(14,10,31,.8);box-shadow:0 0 0 2px var(--line);padding:5px 7px;display:flex;flex-direction:column;gap:4px}
.hud-line{display:flex;justify-content:space-between;font-size:.8rem;gap:6px;white-space:nowrap}
.hud-hp{height:14px;background:#2a0f1c;position:relative;box-shadow:0 0 0 1.5px var(--deep)}
.hud-hp i{position:absolute;inset:0 auto 0 0;background:var(--rose)}
.hud-hp span{position:absolute;inset:0;font-size:.7rem;line-height:14px;text-align:center;color:#fff;text-shadow:1px 1px 0 var(--deep)}
#hudGun{font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.party{display:flex;flex-direction:column;gap:5px;pointer-events:none}
.pc{pointer-events:auto;background:rgba(14,10,31,.8);border:0;box-shadow:0 0 0 2px var(--line);padding:4px 7px;font-family:var(--display);font-size:.78rem;color:var(--ink);display:grid;grid-template-columns:auto 1fr auto;gap:2px 6px;align-items:center;text-align:left;touch-action:none;cursor:pointer}
.pc .key{color:var(--gold)}
.pc .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .cd{font-size:.7rem;color:var(--mint)}
.pc .mini-bar{grid-column:1/-1;height:4px;background:#222;position:relative}
.pc .mini-bar i{position:absolute;inset:0 auto 0 0;background:var(--mint)}
.pc .cdb{grid-column:1/-1;height:3px;background:#222;position:relative}
.pc .cdb i{position:absolute;inset:0 auto 0 0;background:var(--sky)}
.pc.down{box-shadow:0 0 0 2px var(--rose)}
.pc.caged{box-shadow:0 0 0 2px var(--gold)}
.pc.s3{cursor:default}
.pc .sw{display:flex;gap:4px}
.pc .sw button{pointer-events:auto;border:0;background:var(--panel2);box-shadow:0 0 0 1.5px var(--line);color:var(--ink);font-family:var(--display);font-size:.72rem;padding:3px 6px;touch-action:none;cursor:pointer}
.hud-tr{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{width:88px;height:88px;background:rgba(14,10,31,.8);box-shadow:0 0 0 2px var(--line);pointer-events:none}
@media (min-width:700px) and (min-height:560px){#mini{width:120px;height:120px}}
.pbtn{border:0;background:rgba(45,36,87,.9);box-shadow:0 0 0 2px var(--line);color:var(--ink);font-family:var(--display);padding:6px 12px;cursor:pointer;touch-action:none}
.ccol{position:absolute;left:50%;transform:translateX(-50%);top:27%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:min(480px,86vw)}
#hudMsg{position:static;max-width:100%;box-sizing:border-box;background:rgba(14,10,31,.85);box-shadow:0 0 0 2px var(--gold-d);padding:5px 10px;width:max-content;text-align:center;font-size:.8rem}
#hudPrompt{max-width:100%;background:rgba(14,10,31,.9);border:0;box-shadow:0 0 0 2px var(--sky);padding:7px 12px;text-align:center;max-width:80vw;font-family:var(--display);font-size:.85rem;color:var(--ink);pointer-events:none;touch-action:none}
#hudPrompt.tap{pointer-events:auto;background:var(--sky);color:var(--deep);box-shadow:0 0 0 2px var(--deep),0 3px 0 2px var(--deep);cursor:pointer}
.hud-keys{left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:.78rem;color:var(--muted);background:rgba(14,10,31,.75);padding:5px 8px;max-width:60vw}
#pause{position:absolute;inset:0;background:rgba(8,5,20,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
#pause .box{background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:18px;display:flex;flex-direction:column;gap:10px;width:min(380px,100%);max-height:88vh;overflow:auto}
#arenaPanel{position:absolute;right:8px;top:calc(env(safe-area-inset-top,0px) + 136px);display:flex;flex-direction:column;gap:5px;max-width:200px;background:rgba(14,10,31,.85);box-shadow:0 0 0 2px var(--line);padding:6px 8px;max-height:34vh;overflow:auto}
@media (min-width:700px) and (min-height:560px){#arenaPanel{top:calc(env(safe-area-inset-top,0px) + 170px);max-height:55vh}}
#arenaPanel summary{font-family:var(--display);cursor:pointer;color:var(--gold)}
#arenaPanel .ap{display:flex;flex-direction:column;gap:6px;margin-top:6px;align-items:flex-start}
#arenaPanel .lab{font-family:var(--display);font-size:.78rem;color:var(--muted);text-transform:uppercase}
#arenaPanel .row{gap:4px}
#actCol{position:absolute;right:10px;top:54%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;align-items:center}
.tb{width:54px;height:54px;border-radius:50%;border:0;background:rgba(45,36,87,.88);box-shadow:0 0 0 2px var(--line);font-family:var(--display);font-size:.78rem;color:var(--ink);touch-action:none}
.tb.cage{background:rgba(255,207,74,.25);box-shadow:0 0 0 2px var(--gold);color:var(--gold)}
.tb.big{background:rgba(255,207,74,.85);color:var(--deep)}
.chip.sex{font-weight:700}
.chip.sex.f{background:#4a1a35;color:#ff8fb1;box-shadow:0 0 0 1.5px #b3507a}
.chip.sex.m{background:#14304a;color:#7fc8ff;box-shadow:0 0 0 1.5px #3a7ab3}
ul.traits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:.88rem}
ul.traits b{font-family:var(--display);font-weight:600;color:var(--gold)}
ul.traits li.neg b{color:var(--rose)}
.genes .g b{position:absolute;top:-2px;width:4px;height:10px;background:var(--gold)}
.gunslot{background:var(--deep);box-shadow:0 0 0 2px var(--line);padding:10px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:min(100%,220px)}
.gunslot select{background:var(--panel2);border:0;box-shadow:0 0 0 1.5px var(--line);padding:6px}
.gunslot small{color:var(--muted)}
.bchips{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.bchip{font-size:.68rem;background:#123d33;color:var(--mint);padding:0 5px}
#hudGun .on{color:var(--gold)}
#hudGun span:not(.on){color:var(--muted)}
.choice[disabled]{opacity:.45;cursor:not-allowed}
.choice small{color:var(--muted);display:block;font-family:var(--body)}
#arenaPanel select{background:var(--panel2);border:0;box-shadow:0 0 0 1.5px var(--line);padding:3px;max-width:100%}
/* v4 hideout */
.hideout{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.hideout{grid-template-columns:minmax(0,1fr)}}
.seclist{display:flex;flex-direction:column;gap:8px}
@media (max-width:760px){.seclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.secbtn{text-align:left;border:0;background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0}
.secbtn.on{box-shadow:0 0 0 2px var(--gold),4px 4px 0 0 var(--deep)}
.secbtn.locked{opacity:.55}
.secbtn .nm{font-family:var(--display);font-size:1rem}
.secbtn small{color:var(--muted)}
.mbar{display:block;height:5px;background:var(--deep);position:relative}
.mbar i{position:absolute;inset:0 auto 0 0;background:var(--mint)}
.meter{position:relative;height:16px;background:var(--deep);box-shadow:0 0 0 2px var(--line);margin:18px 0 4px}
.meter>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--mint),var(--gold))}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muted)}
.meter b.on{background:var(--gold)}
.meter b span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:.7rem;color:var(--muted);font-weight:400}
.meter b.on span{color:var(--gold)}
.tierlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.tierlist li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;background:var(--deep);padding:5px 8px;color:var(--muted);font-size:.92rem}
.tierlist li b{font-family:var(--display)}
.tierlist li.on{color:var(--ink);box-shadow:inset 3px 0 0 var(--gold)}
.tierlist li.on b{color:var(--gold)}
.tierlist small{font-family:var(--display);font-size:.75rem}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.member{display:flex;gap:8px;align-items:center;background:var(--deep);padding:6px;min-width:0}
.member .nm{font-family:var(--display)}
.member small{color:var(--muted)}
.secdetail select,#addsel{background:var(--deep);border:0;box-shadow:0 0 0 1.5px var(--line);padding:6px;max-width:100%;min-width:0;flex:1}
.chip.tier{background:#3a2e10;color:var(--gold);box-shadow:0 0 0 1.5px var(--gold-d)}
.chip.tier.t0{background:var(--panel2);color:var(--muted);box-shadow:0 0 0 1.5px var(--line)}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.recipe{background:var(--deep);box-shadow:0 0 0 2px var(--line);padding:8px;display:flex;flex-direction:column;gap:6px}
.recipe b{font-family:var(--display);font-weight:600}
.recipe small{color:var(--muted)}
.recipe.unknown{opacity:.55}
.invrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--deep);padding:6px 8px}
.invrow b{font-family:var(--display);font-weight:600}
.trophies{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.trophy{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--deep);padding:6px 4px;text-align:center;font-family:var(--display);font-size:.72rem;color:var(--muted)}
.trophy.won{color:var(--gold);box-shadow:0 0 0 1.5px var(--gold-d)}
.trophy small{font-size:.65rem;color:var(--muted)}
.trophy canvas.spr{box-shadow:none}
.trophy:not(.won) canvas{opacity:.25;filter:grayscale(1)}
.modes{display:flex;flex-direction:column;gap:8px}
.toggle.locked{opacity:.55}
.seg{display:flex;flex-wrap:wrap;gap:6px}
input[type=range]{accent-color:var(--gold);width:100%}
#bossBar{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 236px);width:min(420px,80vw);font-family:var(--display);text-align:center;pointer-events:none}
#bossBar span{display:block;font-size:.85rem;color:#ffa0b0;text-shadow:1px 1px 0 var(--deep)}
#bossBar .bb{height:10px;background:#2a0f1c;box-shadow:0 0 0 2px var(--deep),0 0 0 4px #ff5c7a;position:relative}
#bossBar .bb i{position:absolute;inset:0 auto 0 0;background:#ff3a5c}
.ccol.low{top:calc(env(safe-area-inset-top,0px) + 276px)!important}
#raid .lcol,#raid .hud-tr{opacity:var(--hud-a,.85)}
#raid .tb{width:var(--tb,54px);height:var(--tb,54px)}
#raid.lefty #actCol{right:auto;left:10px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}

/* v5 */

const JOURNAL=[
  {rank:1,title:'To whoever finds this',text:'If you are reading this at my desk, I did not come back. The hideout is yours. Feed the creatures before you feed yourself, and never go deeper than your companions can carry you. — Ilsa Marrow, Keeper'},
  {rank:2,title:'The tether',text:'Every creature born in the Bloom has a root-thread in its chest. I call it the tether. Inside, the Bloom can pull on it at any time. Extraction points are the only places where the thread thins enough to cut. That is why we leave with them, never without them.'},
  {rank:3,title:'Why the dead stay down',text:'I lost Clover on Floor 2 today. I went back an hour later and there was nothing but a new flower where she fell. The Bloom does not waste anything.'},
  {rank:4,title:'Sorrel’s theory',text:'Wen Sorrel thinks the Bloom is one organism, and every creature is a cell it lets wander. If she is right, breeding cut-free creatures is the only way to make something it cannot take back. I hope she is right.'},
  {rank:5,title:'Evolution',text:'Cut-free creatures keep changing after they leave. Biscuit grew into something I had never seen in the dungeon. Out here, they grow for themselves instead of for the Bloom.'},
  {rank:6,title:'The boss on Floor 3',text:'Biscuit is gone. Something wearing her colors waits at the end of the third floor. I could not bring myself to fight it. Next time I will bring someone who never knew her.'},
  {rank:7,title:'Old camps',text:'Pip found an old Keeper camp on Floor 3, older than any record. Forge coals, a crown, a drilling machine. We are not the first to try this. We are only the first to keep a journal.'},
  {rank:8,title:'The Ember Abyss',text:'Below the third floor the Bloom gets hot, like a fever. Everything bites harder. Bring creatures that have grown up. The Abyss does not forgive young ones.'},
  {rank:9,title:'Runes',text:'There are carvings on the Abyss totems in a language I almost recognize. One repeats on every wall: KEEP IT ASLEEP.'},
  {rank:10,title:'The song',text:'Three voices sing in the deep, always the same melody. I hum it without meaning to. Marrowtail goes quiet when I do.'},
  {rank:11,title:'What the Bloom wants',text:'I do not think the Bloom is cruel. I think it is lonely, and it is afraid of everything that leaves. That is why it builds walls out of the creatures it loves.'},
  {rank:12,title:'The heart',text:'There is a seventh floor. I can hear it under the sixth, slow, like breathing. The heart is down there. If it can be cut free, maybe the whole Bloom can.'},
  {rank:14,title:'Last entry',text:'I am going down with Marrowtail. If we do not come back, do not follow until your creatures are stronger than mine were. When you reach the heart, do not kill it. Cut the tether. — I.'},

const NPC_IDS=Object.keys(NPCS);
const SYL={ember:['Cin','Ash','Kin','Pyr','Scor','Em','Vol'],fungal:['Mor','Puf','Spo','Cap','Tru','Myc','Fen'],tide:['Rip','Brin','Mar','Wav','Cor','Nai','Sil'],echo:['Ech','Vesp','Nox','Chir','Dus','Umb','Lur'],gale:['Zeph','Aer','Gus','Kes','Sky','Fal','Wisp'],crystal:['Pris','Gem','Qua','Opa','Lum','Shar','Glim'],warden:['Gra','Bas','Tor','Mon','Ked','Ore','Hul']};

function randGenes(min,max){const g={};for(const k in GENES)g[k]=ri(min,max);return g}
const lineOf=c=>LINES[c.species];
const formOf=c=>lineOf(c)[Math.min(c.stage||0,lineOf(c).length-1)];
const nextForm=c=>lineOf(c)[(c.stage||0)+1]||null;
const formName=c=>formOf(c).name;
function wildStageFor(species,level,floor){
  const L=LINES[species],cap=floor>=4?2:floor>=2?1:0;let s=0;
  for(let i=1;i<L.length&&i<=cap;i++)if(level>=L[i].lv)s=i;return s;
}
function makeCreature(species,origin,level,o={}){
  const sp=SPECIES[species];
  const type=o.type||(sp.hybrid?sp.types[0]:sp.type);
  const type2=sp.hybrid?(o.type2||sp.types.find(t=>t!==type)):null;
  const wild=origin==='wild';
  const c={id:S.nextId++,species,type,type2,sex:o.sex||(Math.random()<.5?'F':'M'),name:o.name||makeName(type),origin,
    proven:!wild||!!o.proven,stage:o.stage||0,pers:o.pers||pick(PERS_IDS),
    genes:o.genes||(wild?randGenes(Math.min(6,2+Math.ceil((o.floor||1)/2)),10):randGenes(2,7)),
    traits:o.traits||rollTraits(wild?(Math.random()<.5?2:1):2),
    level:level||1,xp:0,bondXp:o.bondXp!=null?o.bondXp:(wild?0:30),gen:o.gen||0,raids:0,
    captureRaid:o.captureRaid!=null?o.captureRaid:-1};
  c.hp=stats(c).hp;return c;
}
const bondStar=c=>BOND_TH.filter(t=>(c.bondXp||0)>=t).length;
function addBond(c,n){const before=bondStar(c);c.bondXp=(c.bondXp||0)+Math.round(n*(c.pers==='loyal'?1.5:1)*(res('bond',0)?1.5:1));return bondStar(c)>before}
function stats(c){
  const B=TYPES[c.type].base,m=SPECIES[c.species].mods,g=c.genes,l=1+.07*(c.level-1),has=k=>c.traits.includes(k),st=c.stage||0;
  const bs=bondStar(c),bm=bs>=4?1.12:bs>=2?1.05:1;
  let hp=B.hp*m.hp*(.6+g.vig*.08)*l*(1+.15*st)*bm,atk=B.atk*m.atk*(.6+g.pow*.08)*l*(1+.15*st)*bm,spd=B.spd*m.spd*(.85+g.swf*.03)*(1+.03*st),rate=m.rate*(.8+g.hst*.04);
  if(has('thick'))hp*=1.12;if(has('frail'))hp*=.9;if(has('glow'))atk*=1.1;if(has('quick'))spd*=1.12;if(has('clumsy'))spd*=.9;if(has('rapid'))rate*=1.15;
  const p=c.pers;if(p==='brave')atk*=1.1;if(p==='playful')spd*=1.15;
  const obey=c.origin==='bred'||p==='loyal'?1:clamp(.4+g.tmp*.03+(bs-1)*.1+(c.proven?.1:0),.2,1);
  const f=formOf(c);
  return{hp:Math.round(hp),atk:Math.round(atk*10)/10,spd:Math.round(spd),rate:Math.round(rate*100)/100,obey,
    taken:(has('sturdy')?.85:1)*(p==='timid'?.85:1),regen:has('regen')?.015:0,reach:has('reach')?1.3:1,
    abil:(has('focus')?.8:1)*(has('lazy')?1.25:1)*(p==='calm'?.85:1)*(res('bond',3)?.9:1),crit:(has('keen')?.15:0)+(p==='fierce'?.1:0),vamp:has('vamp')?.08:0,
    atkId:f.atk,abilId:f.abil,star:bs};
}
const xpNeed=c=>25*c.level;
function gainXp(c,amt){
  c.xp+=Math.round(amt*(c.pers==='playful'?1.2:1));let ups=0;
  while(c.xp>=xpNeed(c)&&c.level<40){c.xp-=xpNeed(c);c.level++;ups++}
  if(ups)c.hp=Math.min(stats(c).hp,c.hp+Math.round(stats(c).hp*.1*ups));
  return ups;
}
function canEvolve(c){const n=nextForm(c);return!!n&&c.proven&&c.level>=n.lv&&(!n.need||c.genes[n.need[0]]>=n.need[1])}
function evolveCost(c){const s=(c.stage||0)+1,last=s===lineOf(c).length-1,half=res('bond',4)?.5:1;return{coin:Math.round(80*s*half),ore:Math.round(8*s*half),shard:last&&lineOf(c).length>2?1:0}}
function evolve(c){
  if(!canEvolve(c))return false;const k=evolveCost(c);

  return old;
}
function defaultOpts(){return{stick:'fixed',stickSize:'M',btnSize:'M',hand:'right',dmgNums:true,shake:true,hudAlpha:.82,autoFire:true,vol:.7,music:.5,sfx:.8,mute:false}}

function addLog(msg){S.log.unshift({day:S.day,msg});S.log=S.log.slice(0,60)}

function killCreature(c,how){unplace(c);S.creatures=S.creatures.filter(x=>x!==c);S.stats.lost++;S.memorial.unshift({name:c.name,form:formName(c),species:c.species,stage:c.stage||0,type:c.type,type2:c.type2,level:c.level,day:S.day,how:how||'Lost in the Bloom'});S.memorial=S.memorial.slice(0,40)}
const typeTier=c=>Math.max(...typesOf(c).map(t=>TYPES[t].tier));

function buyResearch(b){const k=researchCost(b);if(!k||S.coin<k.coin||S.ore<k.ore||S.shards<k.shard)return false;S.coin-=k.coin;S.ore-=k.ore;S.shards-=k.shard;S.research[b]++;addLog(`Research: ${RESEARCH[b].nodes[S.research[b]-1]}.`);return true}

function dexForm(sp,st,kind){const k=sp+':'+st,d=S.dex.forms[k]||(S.dex.forms[k]={});d.seen=1;if(kind==='owned')d.owned=1;if(kind==='caught')d.caught=(d.caught||0)+1}

function dexScore(){let n=0;for(const k in S.dex.forms)if(S.dex.forms[k].seen)n++;n+=Object.keys(S.dex.foes).length;n+=Object.keys(S.progress.bosses).length;return n}
const DEX_MILES=[{n:10,reward:{coin:100}},{n:20,reward:{ore:25,cage:2}},{n:35,reward:{coin:250,gilded:2}},{n:50,reward:{shard:2}},{n:70,reward:{coin:500,ore:60}},{n:90,reward:{shard:4,gilded:3}},{n:115,reward:{coin:1200,shard:6}}];

function giveReward(r){
  const out=[];
  if(r.coin){S.coin+=r.coin;out.push(`${r.coin} coin`)}

}

function npcQuest(id){const st=S.npc[id];if(!st)return null;const q=NPCS[id].quests[st.q];if(!q)return null;const v=q.abs?npcStat(q):npcStat(q)-st.base;return{q,v:Math.min(v,q.n),done:v>=q.n}}
function npcAttention(id){const st=S.npc[id];if(!st)return false;if(!st.met)return true;const p=npcQuest(id);return!!(p&&p.done)}

/* ---------- days ---------- */
function hatchEgg(e){S.creatures.push(e.child);dexForm(e.child.species,e.child.stage||0,'owned');if(e.child.type2)bump('hybridsHatched')}
function processDay(){

  const gt=secTier('garden');let g=[0,3,6,10,15,22][gt]+(res('economy',3)?3:0);if(g){S.food+=g;notes.push(`The Garden grew ${g} food.`)}
  const sp=secTier('spring');
  S.creatures.forEach(c=>{const m=stats(c).hp;c.hp=sp>=2?m:Math.min(m,Math.round(c.hp+m*(sp>=1?.5:.35)))});
  if(sp>=3)S.creatures.forEach(c=>addBond(c,5));
  const tt=secTier('training'),txp=[20,30,45,60,75,100][tt];let lvls=0;

  if(trainees)notes.push(`Trainees earned ${txp} XP each${lvls?` (${lvls} level-up${lvls>1?'s':''})`:''}.`);

/* ---------- breeding ---------- */
function hybridChance(mom,dad){
  if(SPECIES[mom.species].hybrid||SPECIES[dad.species].hybrid)return{id:null,p:0};
  const id=hybridFor(mom.type,dad.type),t=secTier('nursery');return{id,p:id?(t>=5?.2:t>=4?.15:.1)+(res('breeding',2)?.05:0):0};
}
const mutChance=()=>(secTier('nursery')>=4?.25:.12)+(res('breeding',0)?.05:0);
function breed(){
  const mom=byId(+ui.mom),dad=byId(+ui.dad);
  if(!mom||!dad||mom.sex!=='F'||dad.sex!=='M'||!mom.proven||!dad.proven)return;
  const t=secTier('nursery');
  if(!t||S.coin<20||S.food<3||S.eggs.length>=eggCap())return;
  S.coin-=20;S.food-=3;
  const mc=mutChance();
  let species=mom.species,type=mom.type,type2=mom.type2;
  const h=hybridChance(mom,dad);let isHybrid=false;
  if(h.id&&Math.random()<h.p){species=h.id;type=mom.type;type2=dad.type;isHybrid=true}
  const genes={};
  for(const k in GENES){let v=Math.random()<.7?dad.genes[k]:mom.genes[k];if(Math.random()<mc)v+=pick([-2,-1,1,1,2]);genes[k]=clamp(v,1,10)}
  const traits=[];
  for(let i=0;i<2;i++){
    let tr=null;
    if(Math.random()<.08)tr=rollTraits(1,traits)[0];
    else{const src=Math.random()<.6?dad:mom;const pool=src.traits.filter(x=>!traits.includes(x));const alt=(src===dad?mom:dad).traits.filter(x=>!traits.includes(x));tr=pool.length?pick(pool):alt.length?pick(alt):rollTraits(1,traits)[0]}
    traits.push(tr);
  }
  const r=Math.random(),pers=r<.5?mom.pers:r<.75?dad.pers:pick(PERS_IDS);
  const child=makeCreature(species,'bred',t>=5||res('breeding',4)?5:1,{type,type2,genes,traits,pers,gen:Math.max(mom.gen,dad.gen)+1});
  const days=Math.max(1,(t>=3?1:2)-(res('breeding',1)?1:0));
  S.eggs.push({id:child.id,days,child,cols:[SPECIES[mom.species].col,SPECIES[dad.species].col],parents:mom.name+' and '+dad.name,hybrid:isHybrid});
  bump('eggs');
  if(isHybrid){S.stats.hybrids++;addLog(`${mom.name} and ${dad.name} produced a shimmering egg. Something unusual is inside.`)}
  else addLog(`${mom.name} and ${dad.name} produced an egg.`);
  sfx('pickup');ui.mom='';ui.dad='';save();renderAll();
}

const AU={ctx:null,master:null,mus:null,fx:null,noise:null,last:{},track:null,timer:null,step:0,next:0,mel:[],bar:0};
function auInit(){
  if(AU.ctx)return true;
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
    AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.connect(AU.ctx.destination);
    AU.mus=AU.ctx.createGain();AU.mus.connect(AU.master);AU.fx=AU.ctx.createGain();AU.fx.connect(AU.master);
    const b=AU.ctx.createBuffer(1,Math.floor(AU.ctx.sampleRate*.6),AU.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=b;

}
function auVol(){if(!AU.ctx||!S)return;const o=S.opts;AU.master.gain.value=o.mute?0:o.vol;AU.mus.gain.value=o.music*.32;AU.fx.gain.value=o.sfx*.5}
function tone(freq,dur,type='square',vol=.3,slide=0,when=0,dest,abs){
  const c=AU.ctx,t0=abs!=null?abs:c.currentTime+when;const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.006);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g);g.connect(dest||AU.fx);o.start(t0);o.stop(t0+dur+.03);
}
function noise(dur,vol=.3,fc=2000,q=1,when=0,type='bandpass',dest,abs){
  const c=AU.ctx,t0=abs!=null?abs:c.currentTime+when;const s=c.createBufferSource();s.buffer=AU.noise;
  const f=c.createBiquadFilter();f.type=type;f.frequency.value=fc;f.Q.value=q;const g=c.createGain();
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);s.connect(f);f.connect(g);g.connect(dest||AU.fx);s.start(t0);s.stop(t0+dur+.03);

const TRACKS={
  hideout:{bpm:76,root:57,scale:[0,2,4,7,9],bass:[0,null,null,null,null,null,null,null,5,null,null,null,null,null,null,null],bw:'triangle',lw:'triangle',dens:.3,hat:false,pad:[0,4,7]},
  depths:{bpm:96,root:50,scale:[0,3,5,7,10],bass:[0,null,0,null,7,null,0,null,3,null,3,null,7,null,5,null],bw:'square',lw:'triangle',dens:.35,hat:true,pad:[0,3,7]},
  abyss:{bpm:106,root:45,scale:[0,1,5,7,8],bass:[0,0,null,0,null,0,1,null,0,0,null,0,null,7,8,null],bw:'sawtooth',lw:'square',dens:.3,hat:true,pad:[0,1,7]},
  boss:{bpm:138,root:45,scale:[0,1,3,7,8],bass:[0,0,12,0,0,12,0,0,3,3,15,3,1,1,13,1],bw:'sawtooth',lw:'square',dens:.55,hat:true,pad:null},

const mtof=m=>440*Math.pow(2,(m-69)/12);
function newMelody(T){AU.mel=Array.from({length:16},(_,i)=>Math.random()<T.dens*(i%2?.6:1.3)?T.scale[ri(0,T.scale.length-1)]+12*ri(1,2):null)}
function musicFor(){if(R&&!R.over){if(R.boss&&R.boss.hp>0)return'boss';return R.map&&R.map.floor>=4?'abyss':'depths'}return'hideout'}
function musicTick(){
  if(!AU.ctx||!S)return;
  const want=musicFor();
  if(want!==AU.track){AU.track=want;AU.step=0;AU.bar=0;AU.next=AU.ctx.currentTime+.05;newMelody(TRACKS[want])}
  if(S.opts.mute||S.opts.music<=0){AU.next=AU.ctx.currentTime+.05;return}
  const T=TRACKS[AU.track],sixteenth=60/T.bpm/4;
  while(AU.next<AU.ctx.currentTime+.12){
    const st=AU.step%16,t0=AU.next;
    const b=T.bass[st];if(b!=null)tone(mtof(T.root-12+b),sixteenth*1.8,T.bw,.16,0,0,AU.mus,t0);
    const m=AU.mel[st];if(m!=null)tone(mtof(T.root+m),sixteenth*1.6,T.lw,.07,0,0,AU.mus,t0);
    if(T.hat&&st%2===1)noise(.03,.05,7000,1,0,'highpass',AU.mus,t0);
    if(T.hat&&(st===4||st===12)&&AU.track!=='hideout')noise(.08,.07,1500,1,0,'bandpass',AU.mus,t0);
    if(T.pad&&st===0)T.pad.forEach(p=>tone(mtof(T.root+p),sixteenth*16,'sine',.05,0,0,AU.mus,t0));
    AU.next+=sixteenth;AU.step++;
    if(AU.step%64===0){AU.bar++;if(AU.bar%2===0)newMelody(T)}
  }
}

function hmapHit(e){
  const cv=$('#hmap');const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*HMAP.W/r.width,y=(e.clientY-r.top)*HMAP.H/r.height;

  if(Math.hypot(x-GATE.x,y-(GATE.y+20))<GATE.r+12)return'gate';
  if(Math.abs(x-BOARD.x)<40&&y>BOARD.y-48&&y<BOARD.y+44)return'board';
  for(const[k,b]of Object.entries(BUILD)){const h=44+5*9+40;if(Math.abs(x-b.x)<b.w*.62&&y>b.y-h&&y<b.y+34)return k}
  return null;
}
function startHideoutMap(){
  const cv=$('#hmap');if(!cv)return;
  cv.onmousemove=e=>{HMAP.hover=hmapHit(e);cv.style.cursor=HMAP.hover?'pointer':'default'};
  cv.onmouseleave=()=>{HMAP.hover=null};
  cv.onclick=e=>{const h=hmapHit(e);if(!h)return;sfx('ui');
    if(h==='gate'){act('tab',{k:'raid'});return}
    if(h==='board'){act('tab',{k:'codex'});return}

function sectionDetail(k){

  const tiers=sec.tiers.map((d,i)=>`<li class="${t>i?'on':''}"><b>T${i+1}</b> <span>${d}</span> <small>${SEC_TH[i]} pts</small></li>`).join('');
  const members=ids.map(byId).filter(Boolean).map(c=>`<div class="member">${spr(c,40)}<div style="min-width:0;flex:1"><div class="nm">${esc(c.name)}</div><small>${esc(formName(c))} Lv ${c.level} · +${Math.round(secContribution(c,k))} pts</small>${k==='training'?`<div class="bar"><i style="width:${c.xp/xpNeed(c)*100}%;background:var(--sky)"></i></div>`:''}</div><button class="btn small" data-act="unassign" data-id="${c.id}" aria-label="Remove ${esc(c.name)}">×</button></div>`).join('');

    const sel=(id,val)=>`<select id="${id}" data-act="${id}">${pool.map(c=>`<option value="${c.id}" ${String(c.id)===String(val)?'selected':''}>${esc(c.name)} · ${esc(formName(c))} Lv ${c.level}</option>`).join('')}</select>`;

      <button class="btn small" data-act="genelab" ${gc&&gv<10&&S.coin>=gcost.coin&&S.ore>=gcost.ore?'':'disabled'}>${gv>=10?'Maxed':`Train · ${gcost.coin}c ${gcost.ore} ore`}</button></div>`:'<p class="status">Reach tier 2 to raise genes with coin and ore.</p>'}
      <h3>Trait Tutor ${t>=4?'':'· opens at T4'}</h3>

      <div class="row">${sel('ttc',ui.tt.id)}<select id="tts" data-act="tts">${tc?tc.traits.map((x,i)=>`<option value="${i}" ${ui.tt.slot==String(i)?'selected':''}>${TRAITS[x].name}</option>`).join(''):''}</select>

function creCard(c){

  const chain=L.map((f,i)=>`<span class="evo ${i===(c.stage||0)?'on':i<(c.stage||0)?'done':''}">${f.name}${i?` <small>Lv ${f.lv}</small>`:''}</span>`).join('<i>›</i>');
  let evo='';
  if(nf){const ok=canEvolve(c),k=evolveCost(c),afford=S.coin>=k.coin&&S.ore>=k.ore&&S.shards>=k.shard;

  const bs=st.star,bp=BOND_PASSIVE[T],nextB=BOND_TH[bs];

    <div class="cre-name">${esc(c.name)} <span class="lv">Lv ${c.level}</span></div>
    <div class="status">${esc(formName(c))} · ${sp.blurb}</div>
    <div class="row" style="gap:4px">${sexChip(c)}${typeChips(c)}${persChip(c)}${c.origin==='bred'?`<span class="chip good">Bred · Gen ${c.gen}</span>`:(c.proven?'<span class="chip">Wild · Proven</span>':'<span class="chip warn">Wild · Unproven</span>')}</div>

    <p class="status"><b class="lbl">Attack:</b> ${K.name}, ${K.desc.toLowerCase()}<br><b class="lbl">Ability:</b> ${A.name}, ${A.desc.toLowerCase()}</p>
    <div class="evochain">${chain}</div>${evo}
    <div class="row" style="gap:6px">${stars(bs)}<small class="status">${nextB!=null?`${c.bondXp}/${nextB} bond`:'Max bond'}${bs>=3?` · ${bp.name}: ${bp.desc}`:` · ★3 unlocks ${bp.name}`}</small></div>
    <div class="genes">${genes}</div>
    <ul class="traits">${traits}</ul>
    <div class="bar" title="XP"><i style="width:${c.xp/xpNeed(c)*100}%;background:var(--sky)"></i></div>
    <p class="status">${statusText(c)} · XP ${c.xp}/${xpNeed(c)}${c.origin==='wild'?` · obeys ${Math.round(st.obey*100)}%`:''}</p>
    <div class="row"><button class="btn small" data-act="feed" data-id="${c.id}" ${S.food<1?'disabled':''}>Feed (1 food)</button>
    <button class="btn small ${sellArmed?'danger':''}" data-act="sell" data-id="${c.id}">${sellArmed?'Confirm: sell for '+sellValue(c)+' coin':'Sell'}</button></div>
  </div></article>`;
}

const milestoneReady=()=>{const m=DEX_MILES[S.dex.claimed];return!!m&&dexScore()>=m.n};
function viewCodex(){
  const T=[['creatures','Creatures'],['enemies','Enemies'],['bosses','Boss memories'],['journal','Ilsa’s journal'+(journalNew()?' •':'')],['reactions','Reactions & combos'],['story','The Bloom']];
  const nav=`<div class="filters">${T.map(([k,l])=>`<button class="tab" aria-selected="${ui.codex===k}" data-act="codex" data-k="${k}">${l}</button>`).join('')}</div>`;
  const sc=dexScore(),m=DEX_MILES[S.dex.claimed];
  const head=`<section class="card" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><h2>Codex · ${sc}/${DEX_TOTAL()} discovered</h2>
    ${m?`<button class="btn small ${sc>=m.n?'primary':''}" data-act="claim" ${sc>=m.n?'':'disabled'}>${sc>=m.n?'Claim':`Next reward at ${m.n}`}: ${rewardText(m.reward)}</button>`:'<span class="chip good">All milestones claimed</span>'}</div>${nav}</section>`;
  let body='';
  if(ui.codex==='creatures'){
    const tnav=`<div class="filters">${[...TYPE_IDS,'hybrid'].map(t=>`<button class="tab" aria-selected="${ui.dexType===t}" data-act="dextype" data-k="${t}">${t==='hybrid'?'Hybrids':TYPES[t].name}</button>`).join('')}</div>`;
    const list=ui.dexType==='hybrid'?HYBRIDS.map(h=>h.id):speciesOf(ui.dexType);
    body=`<section class="card">${tnav}<div class="dexlines">${list.map(sp=>{const L=LINES[sp];return`<div class="dexline"><div class="row" style="justify-content:space-between"><b>${SPECIES[sp].name} line</b><small class="status">${SPECIES[sp].hybrid?'Hybrid':({6:'Common',3:'Uncommon',1:'Rare'})[SPECIES[sp].w]}</small></div><div class="dexforms">${L.map((f,i)=>{const d=S.dex.forms[sp+':'+i]||{};const seen=!!d.seen;
      return`<div class="dexform ${seen?'':'unseen'}">${sprSp(sp,i,56,!seen)}<b>${seen?f.name:'???'}</b><small>${i?`Lv ${f.lv}${f.need?' · '+GENES[f.need[0]]+' '+f.need[1]:''}`:'Base form'}</small>${seen?`<small>${ATTACKS[f.atk].name} · ${ABILITIES[f.abil].name}</small><small>${d.owned?'Owned':'Seen'}${d.caught?' · caught '+d.caught:''}</small>`:''}</div>`}).join('<i class="arrow">›</i>')}</div></div>`}).join('')}</div></section>`;
  }else if(ui.codex==='enemies'){
    body=[0,1].map(s=>`<section class="card" style="margin-bottom:16px"><h3>${s?'The Ember Abyss · Floors 4–6':'Overgrown Depths · Floors 1–3'}</h3><div class="dexgrid">${FOE_IDS.filter(k=>FOES[k].set===s).map(k=>{const d=S.dex.foes[k];const F=FOES[k];
      return`<div class="dexform ${d?'':'unseen'}"><canvas class="spr" width="52" height="52" data-foe="${k}" ${d?'':'data-sil="1"'}></canvas><b>${d?F.name:'???'}</b><small>${d?`Floor ${F.intro} · ${d.kills} defeated`:`Appears from floor ${F.intro}`}</small>${d&&d.kills?`<small class="lore">${F.lore}</small>`:''}</div>`}).join('')}</div></section>`).join('');
  }else if(ui.codex==='bosses'){
    body=`<section class="card"><p class="hint">Each boss drops a memory shard the first time you beat it, revealing who it was before the Bloom changed it.</p><div class="memories">${BOSS_IDS.map(b=>{const B=BOSSES[b],won=S.progress.bosses[b];
      return`<div class="memory ${won?'':'unseen'}"><canvas class="spr" width="64" height="64" data-boss="${b}" ${won?'':'data-sil="1"'}></canvas><div><b>${won?B.name:'Unknown memory'}</b><small class="status">${B.set?'Floor 6':'Floor 3'}${won?' · beaten '+won+'×':''}</small><p>${won?B.lore:'Defeat this boss to recover its memory.'}</p></div></div>`}).join('')}</div></section>`;
  }else if(ui.codex==='journal'){
    S.journalRead=JOURNAL.filter(j=>j.rank<=S.keeper.level).length;save();renderTabs();
    body=`<section class="card journal"><p class="hint">Ilsa Marrow kept this journal. A new page turns up with each Keeper rank.</p>${JOURNAL.map(j=>j.rank<=S.keeper.level?`<article class="page"><h3>${j.title}</h3><p>${j.text}</p><small>Keeper rank ${j.rank}</small></article>`:`<article class="page locked"><h3>Missing page</h3><p>Reach Keeper rank ${j.rank} to find it.</p></article>`).join('')}</section>`;
  }else if(ui.codex==='reactions'){
    body=`<div class="cols"><section class="card"><h2>Elemental reactions</h2><p class="hint">Companion attacks and some weapons apply an element. Hitting a foe that carries one element with a matching second element sets off a reaction.</p>
      <div class="elemrow">${Object.values(ELEM).map(e=>`<span class="chip" style="box-shadow:0 0 0 1.5px ${e.col};color:${e.col}">${e.name}</span>`).join('')}</div>
      <ul class="plain">${REACTIONS.filter((r,i,a)=>a.findIndex(x=>x.name===r.name)===i).map(r=>`<li><b style="color:${r.col}">${r.name}</b>: ${r.desc}${r.name==='Shatter'?' Also works with Staggered.':''}</li>`).join('')}</ul></section>
      <section class="card"><h2>Combos</h2><p class="hint">Your slot 1 and slot 2 companions' types decide your combo. Press C or the Combo button when it charges.</p>
      <ul class="plain">${Object.entries(COMBOS).map(([k,c])=>`<li><b>${c.name}</b> (${k.split('+').map(t=>TYPES[t].name).join(' + ')}): ${c.desc}</li>`).join('')}<li><b>Twin Fury</b> (same type): both attack twice as fast for 5s.</li><li><b>Pack Rally</b> (any other pair): both attack 60% faster for 5s.</li></ul></section></div>`;
  }else{
    body=`<section class="card journal"><article class="page"><h3>The Bloom</h3>${LORE_INTRO.map(p=>`<p>${p}</p>`).join('')}</article></section>`;
  }
  return head+body;
}
function rewardText(r){const o=[];if(r.coin)o.push(r.coin+' coin');if(r.ore)o.push(r.ore+' ore');if(r.cage)o.push(r.cage+' cages');if(r.gilded)o.push(r.gilded+' gilded');if(r.shard)o.push(r.shard+' shards');return o.join(', ')}

  </section>

/* ---------- modals ---------- */
function openModal(html){$('#modal').hidden=false;$('#modalBox').innerHTML=html;paintSprites($('#modalBox'))}
function closeModal(){$('#modal').hidden=true}
function openChooser(slot){
  const cur=S.loadout.slots[slot];
  const list=S.creatures.filter(c=>c.id!==cur).sort((a,b)=>b.level-a.level);
  const items=list.map(c=>{const w=whereIs(c);const note=w.kind==='section'?`Leaves the ${SECTIONS[w.key].name}`:w.kind==='loadout'?`Moves from slot ${w.slot+1}`:'';const st=stats(c);
    return`<button class="choice" data-act="pickslot" data-slot="${slot}" data-id="${c.id}">${spr(c,44)}<span style="min-width:0;flex:1"><span class="nm">${esc(c.name)} · ${sexSym(c.sex)} ${esc(formName(c))} Lv ${c.level} ${'★'.repeat(st.star)}</span><small>${c.hp}/${st.hp} HP · ${slot===2?'Passive: '+supportText(c):ABILITIES[st.abilId].name+' · '+ATTACKS[st.atkId].name}${c.proven?'':' · Unproven'}</small>${note?`<small style="color:var(--gold)">${note}</small>`:''}</span></button>`}).join('');
  openModal(`<h2>${slot===2?'Slot 3: support or free':'Combat slot '+(slot+1)}</h2>
    ${slot===2?'<p class="hint">A support creature gives its passive but stays out of the fight until you swap it into slot 1 or 2. Leave the slot free if you plan to cage something.</p>':''}
    <div class="choose-list">${slot===2?'<button class="choice" data-act="clearslot" data-slot="2"><span class="nm">Leave free for a capture</span></button>':''}${items||'<p class="empty">No other creatures.</p>'}</div>
    <div class="row"><button class="btn" data-act="close">Cancel</button></div>`);
}
function openNpc(id){
  const n=NPCS[id],st=S.npc[id];if(!st)return;
  let line;if(!st.met){line=n.intro;st.met=true;save()}else line=pick(n.idle);
  const p=npcQuest(id);
  const quest=p?`<div class="slot"><div class="slot-label">Quest ${st.q+1} of ${n.quests.length}</div><p>${p.q.text}</p>
    <div class="bar"><i style="width:${p.v/p.q.n*100}%;background:var(--gold)"></i></div><p class="status">${p.v}/${p.q.n} · Reward: ${questRewardText(p.q.reward)}</p>
    ${p.done?`<button class="btn primary" data-act="turnin" data-k="${id}">Turn in</button>`:''}</div>`:`<p class="status">${n.outro}</p>`;
  openModal(`<div class="row" style="gap:12px;flex-wrap:nowrap"><canvas class="spr" width="72" height="72" data-npc="${id}"></canvas><div><h2>${n.name}</h2><p class="status">${n.role} · ${SECTIONS[n.home].name}</p></div></div>
    <blockquote class="say">${line}</blockquote>${quest}<div class="row"><button class="btn" data-act="close">Goodbye</button></div>`);
  renderTabs();
}
function questRewardText(r){const o=[];if(r.coin)o.push(r.coin+' coin');if(r.ore)o.push(r.ore+' ore');if(r.cage)o.push(r.cage+' cages');if(r.gilded)o.push(r.gilded+' gilded cages');if(r.shard)o.push(r.shard+' shard'+(r.shard>1?'s':''));if(r.blueprint)o.push(GUNS[r.blueprint].name+' blueprint');if(r.weapon)o.push(GUNS[r.weapon].name);if(r.egg)o.push('a mysterious egg');return o.join(', ')}
function openIntro(first){
  openModal(`<h2 class="res-title">The Bloom</h2>${LORE_INTRO.map(p=>`<p>${p}</p>`).join('')}
    <div class="row">${first?'<button class="btn primary" data-act="tutorial">Play the tutorial</button><button class="btn" data-act="close">Skip to the hideout</button>':'<button class="btn primary" data-act="close">Close</button>'}</div>`);
}

/* ================= Actions ================= */
function act(a,d){
  switch(a){
    case'tab':ui.tab=d.k;ui.sellId=null;ui.resetArm=false;ui.scrapArm=null;renderAll();window.scrollTo(0,0);break;
    case'filter':ui.filter=d.k;renderMain();break;
    case'section':ui.section=d.k;HMAP.sel=d.k;if($('#secPanel'))renderSecPanel();else renderMain();break;
    case'codex':ui.codex=d.k;renderMain();break;
    case'dextype':ui.dexType=d.k;renderMain();break;
    case'close':closeModal();break;
    case'npc':openNpc(d.k);break;
    case'turnin':{const got=npcTurnIn(d.k);if(got){sfx('quest');save();renderAll();const n=NPCS[d.k];openModal(`<div class="row" style="gap:12px;flex-wrap:nowrap"><canvas class="spr" width="72" height="72" data-npc="${d.k}"></canvas><h2>${n.name}</h2></div><blockquote class="say">${n.quests[S.npc[d.k].q-1].done}</blockquote><p class="status">Received ${got}.</p><div class="row"><button class="btn primary" data-act="npc" data-k="${d.k}">Continue</button><button class="btn" data-act="close">Close</button></div>`)}break}
    case'claim':{const m=DEX_MILES[S.dex.claimed];if(m&&dexScore()>=m.n){const got=giveReward(m.reward);S.dex.claimed++;addLog(`Codex milestone ${m.n}: received ${got}.`);sfx('quest');save();renderAll()}break}
    case'research':if(buyResearch(d.k)){sfx('level');save();renderAll()}break;
    case'evolve':{const c=byId(+d.id);const old=evolve(c);if(old){sfx('evolve');save();renderAll();
      openModal(`<h2 class="res-title win">${esc(c.name)} evolved!</h2><div class="row" style="justify-content:center;gap:10px">${sprSp(c.species,c.stage-1,80)}<b style="font-family:var(--display);font-size:1.6rem">›</b>${sprSp(c.species,c.stage,96)}</div>
        <p style="text-align:center">${esc(old)} became <b style="color:var(--gold)">${esc(formName(c))}</b>.</p><p class="status" style="text-align:center">New attack: ${ATTACKS[formOf(c).atk].name}. Ability: ${ABILITIES[formOf(c).abil].name}.</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="close">Wonderful</button></div>`)}break}
    case'choose':openChooser(+d.slot);break;
    case'pickslot':{const c=byId(+d.id);unplace(c);S.loadout.slots[+d.slot]=c.id;closeModal();save();renderAll();break}
    case'clearslot':S.loadout.slots[+d.slot]=null;closeModal();save();renderAll();break;
    case'deploy':startRaid('raid');break;
    case'scav':startRaid('scav');break;
    case'arena':startRaid('arena');break;
    case'tutorial':closeModal();startRaid('tutorial');break;
    case'intro':openIntro(false);break;
    case'wait':processDay();save();renderAll();break;
    case'assign':{const sel=$('#addsel');if(!sel)break;const c=byId(+sel.value);if(!c||S.sections[d.k].ids.length>=secCap(d.k))break;unplace(c);S.sections[d.k].ids.push(c.id);save();renderAll();break}
    case'unassign':{const c=byId(+d.id);if(c){unplace(c);save();renderAll()}break}
    case'expand':{const ec=expandCost(d.k);if(S.coin<ec.coin||S.ore<ec.ore||S.sections[d.k].cap>=10)break;S.coin-=ec.coin;S.ore-=ec.ore;S.sections[d.k].cap++;save();renderAll();break}
    case'genelab':{const c=byId(+ui.gl.id);if(!c)break;const g=ui.gl.gene,v=c.genes[g],cc={coin:20*(v+1),ore:2*(v+1)};if(v>=10||S.coin<cc.coin||S.ore<cc.ore)break;S.coin-=cc.coin;S.ore-=cc.ore;c.genes[g]=v+1;addLog(`Gene Lab: ${c.name}'s ${GENES[g]} rose to ${v+1}.`);sfx('level');save();renderAll();break}
    case'tutor':{const c=byId(+ui.tt.id);if(!c||S.coin<60||S.ore<8)break;S.coin-=60;S.ore-=8;const i=+ui.tt.slot||0;const old=c.traits[i];c.traits[i]=rollTraits(1,c.traits,true)[0];addLog(`Trait Tutor: ${c.name} swapped ${TRAITS[old].name} for ${TRAITS[c.traits[i]].name}.`);save();renderAll();break}
    case'feed':{const c=byId(+d.id);if(S.food<1)break;S.food--;addBond(c,10);c.hp=Math.min(stats(c).hp,c.hp+Math.round(stats(c).hp*.2));sfx('pickup');save();renderAll();break}
    case'sell':{const c=byId(+d.id);if(ui.sellId!==c.id){ui.sellId=c.id;renderMain();break}
      S.coin+=sellValue(c);unplace(c);S.creatures=S.creatures.filter(x=>x!==c);ui.sellId=null;addLog(`Sold ${c.name} for ${sellValue(c)} coin.`);sfx('coin');save();renderAll();break}
    case'breed':breed();break;
    case'craft':{const g=GUNS[d.k],cost=WEAPON_COST[g.tier];if(!canCraft(d.k)||S.coin<cost.coin||S.ore<cost.ore)break;S.coin-=cost.coin;S.ore-=cost.ore;S.guns[d.k]=(S.guns[d.k]||0)+1;addLog(`The Forge made a ${g.name}.`);sfx('heavy');save();renderAll();break}
    case'scrap':{const g=GUNS[d.k];if(!(S.guns[d.k]>0))break;if(ui.scrapArm!==d.k){ui.scrapArm=d.k;renderMain();break}ui.scrapArm=null;

function genMap(floor,arena,bossId){
  const G=arena?1:4,rooms=[],grid={};const loc=localFloor(floor),set=floor>=4?1:0;

    if(nx<0||ny<0||nx>=G||ny>=G||grid[nx+','+ny])continue;const b=add(nx,ny);a.links.push(b);b.links.push(a)}
  start.dist=0;const q=[start];while(q.length){const r=q.shift();for(const n of r.links)if(n.dist==null){n.dist=r.dist+1;q.push(n)}}

    if(isBossFloor(floor)){set1('boss');set1('rift');set1('cliff')}else{set1('stairs');set1('gate')}

    for(const r of rooms){

      const n=ri(base[0],base[1])+(loc-1)+swarm;

      const foes=[];while(foes.length<n-wc)foes.push(wpick(pool,k=>FOES[k].intro===newIntro?2.2:1));
      r.plan={foes,wilds:Array.from({length:wc},()=>rollWildSpecies(floor,r.kind==='lair')),elite:r.kind==='lair'};
      if((r.kind==='fight'||r.kind==='lair')&&Math.random()<(floor===1?.15:.25))r.mod=pick(ROOM_MOD_IDS);
    }
    if(bossId)rooms.find(r=>r.kind==='boss').bossId=bossId;
    if(Math.random()<.65){
      const hosts=shuffle(rooms.filter(r=>!['boss','start'].includes(r.kind)));
      outer:for(const h of hosts)for(const[dx,dy]of shuffle([[1,0],[-1,0],[0,1],[0,-1]])){const nx=h.gx+dx,ny=h.gy+dy;if(nx<0||ny<0||nx>=G||ny>=G||grid[nx+','+ny])continue;
        const s=add(nx,ny,'secret');s.hidden=true;s.host=h;s.links.push(h);h.links.push(s);s.chest={x:0,y:0,open:false,rich:true};

function genTutorialMap(){

function buildMap(rooms,grid,Gx,Gy,floor,arena,start){
  const W=Gx*CW,H=Gy*CH,tiles=new Uint8Array(W*H),doorOwner=new Map(),cracks=new Map();
  for(const r of rooms)for(let j=0;j<RH;j++)for(let i=0;i<RW;i++)tiles[(r.oy+j)*W+r.ox+i]=1;
  const done=new Set();
  for(const a of rooms)for(const b of a.links){
    const k=Math.min(a.idx,b.idx)+'-'+Math.max(a.idx,b.idx);if(done.has(k))continue;done.add(k);
    const[p,q2]=(a.gx<b.gx||a.gy<b.gy)?[a,b]:[b,a];
    const sec=p.kind==='secret'?p:q2.kind==='secret'?q2:null,host=sec?(sec===p?q2:p):null;
    const crack=sec?{hp:60+floor*20,tiles:[],room:sec,broken:false}:null;
    const door=(i,r)=>{if(sec){if(r===host){tiles[i]=4;crack.tiles.push(i);cracks.set(i,crack)}else tiles[i]=1;return}tiles[i]=3;doorOwner.set(i,r);r.doors.push(i)};
    if(p.gy===q2.gy){const cy=p.oy+(RH>>1);
      for(let x=p.ox+RW;x<q2.ox;x++)for(let y=cy-1;y<=cy+1;y++)tiles[y*W+x]=1;
      for(let y=cy-1;y<=cy+1;y++){door(y*W+p.ox+RW,p);door(y*W+q2.ox-1,q2)}
    }else{const cx=p.ox+(RW>>1);
      for(let y=p.oy+RH;y<q2.oy;y++)for(let x=cx-1;x<=cx+1;x++)tiles[y*W+x]=1;
      for(let x=cx-1;x<=cx+1;x++){door((p.oy+RH)*W+x,p);door((q2.oy-1)*W+x,q2)}
    }
  }
  for(const r of rooms){
    if(['fight','lair','chest','arena'].includes(r.kind)){
      const n=r.kind==='arena'?4:ri(0,3);
      for(let k=0;k<n;k++){const px=r.ox+ri(2,RW-4),py=r.oy+ri(2,RH-4);
        if(Math.abs(px+1-(r.ox+RW/2))<3.5&&Math.abs(py+1-(r.oy+RH/2))<3)continue;
        for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)tiles[(py+dy)*W+px+dx]=2}
    }
    r.cx=(r.ox+RW/2)*TS;r.cy=(r.oy+RH/2)*TS;
    if(r.kind==='chest'||r.kind==='lair')r.chest={x:r.cx,y:r.cy,open:false};
    if(r.kind==='secret'){r.chest.x=r.cx;r.chest.y=r.cy}
  }
  return{G:Math.max(Gx,Gy),Gx,Gy,W,H,tiles,doorOwner,cracks,rooms,grid,start,floor,arena:!!arena};
}
function solidAt(M,tx,ty){if(tx<0||ty<0||tx>=M.W||ty>=M.H)return true;const i=ty*M.W+tx,t=M.tiles[i];if(t===1)return false;if(t===3)return M.doorOwner.get(i).locked;return true}

  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solidAt(M,tx,ty))return true;return false}

function paintTile(g,M,x,y,pal){

/* ---------- elements ---------- */
function applyElem(e,elem,dmg,src){
  if(!elem||e.hp<=0)return;
  for(const k in e.status){if(e.status[k]>0&&k!==elem){const r=reactionFor(k,elem);if(r){delete e.status[k];react(e,r,dmg,src);return}}}
  e.status[elem]=4;
  if(elem==='burn'){const bm=src&&src.c&&src.c.type==='ember'&&src.st.star>=3?1.5:1;e.burn={dps:Math.max(2,dmg*.3)*bm,t:3,src}}
  if(elem==='soak'&&src&&src.c&&src.c.type==='tide'&&src.st.star>=3&&e.kind!=='boss')e.slow=1.5;
}
function react(e,r,dmg,src){
  const base=Math.max(dmg,8)*(res('combat',3)?1.3:1);
  bump('reactions');sfx('react');float(e.x,e.y-e.r-26,r.name+'!',r.col,true);
  R.fx.push({x:e.x,y:e.y,r:60,t:.4,max:.4,col:r.col});
  if(r.name==='Steam Burst')explodeAt(e.x,e.y,85,base*2.5,'p',src,null,'#e8f4ff');
  else if(r.name==='Combustion')explodeAt(e.x,e.y,100,base*3,'p',src,null,'#ffb347');
  else if(r.name==='Electrocute'){const hit=[e];let cur=e;for(let i=0;i<4;i++){const nx=R.enemies.filter(x=>x.hp>0&&!hit.includes(x)&&dist(x,cur)<190).sort((a,b)=>dist(a,cur)-dist(b,cur))[0];if(!nx)break;R.bolts.push({a:{x:cur.x,y:cur.y},b:{x:nx.x,y:nx.y},t:.25,col:'#c8a8ff'});hurtEnemy(nx,base*2,false,src);hit.push(nx);cur=nx}hurtEnemy(e,base*2,false,src)}
  else if(r.name==='Overgrowth'){if(e.kind!=='boss')e.stun=1.8;e.slow=3;hurtEnemy(e,base*1.5,false,src)}
  else if(r.name==='Shatter'){hurtEnemy(e,base*3,false,src)}
  else if(r.name==='Thunderclap'){if(e.kind!=='boss')e.stun=1.2;hurtEnemy(e,base*2,false,src);R.bolts.push({a:{x:e.x,y:e.y-120},b:{x:e.x,y:e.y},t:.25,col:'#fff6a8'})}
}

  if(e.kind==='wild'&&isWeak(e)&&!e.weakShown){e.weakShown=true;float(e.x,e.y-e.r-24,'Weak! Get close and cage it','#ffcf4a',true)}
  if(e.kind==='boss'&&!e.phase2&&e.hp<e.maxHp*.5){e.phase2=true;e.ai=0;msg(`${e.def.name} is enraged!`);sfx('boss');R.fx.push({x:e.x,y:e.y,r:120,t:.6,max:.6,col:'#ff5c7a'})}

function nearestEnemy(from,range,spareWeak){let best=null,bd=range;for(const e of R.enemies){if(e.hp<=0)continue;if(spareWeak&&isWeak(e))continue;const d=dist(from,e)-e.r;if(d<bd){bd=d;best=e}}return best}

  if(R.mode==='arena'||!r)return;
  if(r.kind==='stairs'){
    if(dist(p,{x:r.cx,y:r.cy})<40&&!r.locked){R.stairT+=dt;R.prompt='Descending… '+Math.max(0,1.2-R.stairT).toFixed(1)+'s';if(R.stairT>=1.2)descend(R.map.floor+1)}

        <ul class="plain"><li>Real raids go 3 floors deep, with a boss on Floor 3.</li><li>Anything you bring is lost if you fall, unless the Vault saves it.</li><li>Keeper XP comes from every raid, so even losses move you forward.</li><li>Visit the Hideout to meet Brannoc, and check Ilsa's journal in the Codex.</li></ul>`;
    }else html=`<h2 class="res-title">Tutorial ended</h2><p class="hint">Nothing was lost. You can replay it from the Raid tab or Settings.</p>`;
    exitRaid();openModal(html+`<div class="row"><button class="btn primary" data-act="close">To the hideout</button></div>`);save();return;
  }
  const L={home:[],lost:[],caught:[],proven:[],levels:[],loot:[],notes:[],keeper:[],bond:[]};
  R.comps.forEach(m=>{if(m)m.c.hp=m.downed?0:Math.round(m.hp/m.maxHp*stats(m.c).hp)});
  const party=R.comps.filter(Boolean);
  const scav=R.mode==='scav',vt=scav?0:secTier('vault'),at=scav?0:armoryTier();
  const isNew=c=>!S.creatures.includes(c);
  const held=R.guns.filter(g=>g&&g!=='pistol');
  const deepest=Math.max(...R.floorsSeen);S.progress.deepest=Math.max(S.progress.deepest||0,deepest);
  const fell=`Fell on Floor ${R.map.floor}`;
  if(outcome==='extract'){

    S.stats.deaths++;
    L.notes.push(outcome==='collapse'?'The dungeon collapsed around you.':'You were knocked out.');
    party.forEach((m,i)=>{
      if(i===0&&vt>=4&&!isNew(m.c)){L.home.push(`${m.c.name} (Vault guardian)`);gainXp(m.c,m.xpGain);return}
      if(isNew(m.c))L.lost.push(`${m.c.name} (new catch)`);else{L.lost.push(m.c.name);killCreature(m.c,fell)}});

    keepG.forEach(g=>{S.guns[g]=(S.guns[g]||0)+1;L.home.push(`${GUNS[g].name} (saved)`)});
    held.filter(g=>!keepG.includes(g)).forEach(g=>L.lost.push(GUNS[g].name));
    R.taken.forEach(g=>{if(!held.includes(g))L.lost.push(GUNS[g].name)});
    const keepCoin=Math.round(R.bag.coin*(vt>=5?.6:vt>=3?.3:0)),keepOre=vt>=5?R.bag.ore:0;
    if(keepCoin||keepOre){S.coin+=keepCoin;S.ore+=keepOre;L.home.push(`Vault saved ${keepCoin} coin${keepOre?' and '+keepOre+' ore':''}`)}

  addLog(`${scav?'Scav run':'Raid'}: ${title.toLowerCase()} on floor ${R.map.floor}.`+(L.caught.length?' Caught '+L.caught.length+'.':'')+(L.lost.length&&outcome!=='extract'?' Lost: '+L.lost.join(', ')+'.':''));

  openModal(`<h2 class="res-title ${outcome==='extract'?'win':'lose'}">${title}</h2>${L.notes.map(n=>`<p>${esc(n)}</p>`).join('')}
    <div class="slot"><div class="slot-label">Keeper XP</div><p><b style="font-family:var(--display);color:var(--gold)">+${kx}</b> · rank ${S.keeper.level} (${S.keeper.xp}/${keeperNeed()}) · ${R.kills} defeated · deepest floor ${deepest}</p>${L.keeper.map(k=>`<p class="status" style="color:var(--gold)">${esc(k)}</p>`).join('')}</div>
    ${sec('Caught',L.caught,'var(--gold)')}${sec('Proven',L.proven,'var(--mint)')}${sec('Came home',L.home)}${sec('Level ups',L.levels)}${sec('Bond',L.bond,'var(--sky)')}${sec('Loot banked',L.loot)}${sec('Lost',L.lost,'var(--rose)')}${sec('Quests',quests,'var(--gold)')}
    <p class="status">Day ${S.day} begins. ${esc(S.log[0].msg)}</p>
    <div class="row"><button class="btn primary" data-act="close">Back to the hideout</button></div>`);
}

  if(e.burn){g.fillStyle=`rgba(255,122,61,${.3+.2*Math.sin(t*12)})`;g.beginPath();g.arc(e.x,e.y-e.r*.6,e.r*.5,0,7);g.fill()}
  if(e.kind==='boss'){drawBossBody(g,e.def,e.x,e.y,e.r/40,t,e.flash>0);pips(g,e,e.y+e.r+10);return}
  if(e.kind==='wild'){
    drawCreature(g,e.c,e.x+(e.wind>0?rnd(-1,1):0),e.y,.9,t,{face:e.face,flash:e.flash>0,seed:e.seed});
    const f=e.hp/e.maxHp,weak=isWeak(e);hpOver(g,e.x,e.y-30,30,f,weak?'#ffcf4a':'#ff6688');pips(g,e,e.y-38);
    g.font='600 10px "Pixelify Sans", monospace';g.fillStyle=SPECIES[e.c.species].col;g.fillText(`WILD ${formName(e.c).toUpperCase()} ${sexSym(e.c.sex)} LV${e.c.level}`,e.x,e.y-44);
    if(weak){g.strokeStyle='#ffcf4a';g.lineWidth=2;g.setLineDash([4,4]);g.lineDashOffset=t*20;g.beginPath();g.arc(e.x,e.y,22+Math.sin(t*6)*2,0,7);g.stroke();g.setLineDash([])}
    return;
  }
  drawFoeBody(g,e.def,e.x+(e.wind>0&&e.fire.kind==='charge'?rnd(-1.5,1.5):0),e.y,e.r/14,t,{flash:e.flash>0,seed:e.seed,face:e.face,dir:e.chargeT>0?Math.atan2(e.cvy,e.cvx):null});
  hpOver(g,e.x,e.y-e.r-12,e.elite||e.def.body==='brute'?44:26,e.hp/e.maxHp,'#ff6688');pips(g,e,e.y-e.r-18);
  if(e.elite||e.def.body==='brute'){g.font='600 10px "Pixelify Sans", monospace';g.fillStyle='#ffa04f';g.fillText((e.elite?'ELITE ':'')+e.def.name.toUpperCase(),e.x,e.y-e.r-24)}
  if(e.stun>0&&e.stun<99){g.fillStyle='#9b7bff';g.font='600 11px "Pixelify Sans", monospace';g.fillText('STUN',e.x,e.y+e.r+14)}
}
function drawMini(){
  const g=mctx,M=R.map,W=240;g.clearRect(0,0,W,W);
  if(CU('blind')){g.fillStyle='#ff6688';g.font='600 22px "Pixelify Sans", monospace';g.textAlign='center';g.textBaseline='middle';g.fillText('BLIND',W/2,W/2);g.textBaseline='alphabetic';return}
  const n=M.G,cell=Math.floor((W-16)/n),pad=(W-cell*n)/2,box=cell-14;
  const showSecret=S.settings.reveal||secTier('roost')>=3;
  const show=r=>(r.visited||R.reveal)&&(!r.hidden||showSecret||r.visited);
  const pos=r=>[pad+r.gx*cell+7,pad+r.gy*cell+7];
  g.strokeStyle='#4b3e87';g.lineWidth=4;
  M.rooms.forEach(r=>r.links.forEach(o=>{if(r.idx<o.idx&&show(r)&&show(o)){const[a,b]=pos(r),[c,d]=pos(o);g.beginPath();g.moveTo(a+box/2,b+box/2);g.lineTo(c+box/2,d+box/2);g.stroke()}}));
  const col={start:'#5de8b0',stairs:'#ffcf4a',gate:'#ffcf4a',rift:'#9b7bff',cliff:'#4fe0c8',chest:'#c98a2b',lair:'#ff6688',fight:'#6a5cab',arena:'#ff8fb1',shop:'#58c2ff',shrine:'#5de8b0',boss:'#ff3a5c',portal:'#9b7bff',secret:'#ffcf4a',tutA:'#5de8b0',tutB:'#6a5cab'};
  const lab={stairs:'S',gate:'G',rift:'R',cliff:'C',chest:'$',lair:'!',shop:'P',shrine:'+',boss:'B',portal:'O',secret:'?'};
  g.font='600 20px "Pixelify Sans", monospace';g.textAlign='center';g.textBaseline='middle';
  M.rooms.forEach(r=>{
    if(!show(r))return;const[x,y]=pos(r);
    g.globalAlpha=r.visited?1:.5;g.fillStyle=col[r.kind]||'#6a5cab';g.fillRect(x,y,box,box);
    if(r.mod&&r.visited){g.fillStyle=ROOM_MODS[r.mod].col;g.fillRect(x+box-10,y+box-10,10,10)}
    if(r.locked){g.strokeStyle='#ff6688';g.lineWidth=3;g.strokeRect(x,y,box,box)}
    g.globalAlpha=1;g.fillStyle=OL;if(lab[r.kind])g.fillText(lab[r.kind],x+box/2,y+box/2+1);
    if(secTier('roost')>=2&&r.plan&&!r.cleared&&r.plan.wilds.some(s=>SPECIES[s].w===1||TYPES[SPECIES[s].type].tier>=3)){g.fillStyle='#fff';g.fillText('*',x+box-6,y+8)}
    if(r===R.cur){g.strokeStyle='#fff';g.lineWidth=3;g.strokeRect(x-3,y-3,box+6,box+6)}
  });
  g.textBaseline='alphabetic';
}
function updHud(){
  const p=R.p;
  $('#hudHp').style.width=clamp(p.hp/p.maxHp,0,1)*100+'%';$('#hudHpTxt').textContent=`${Math.ceil(Math.max(0,p.hp))}/${p.maxHp}`;
  $('#hudGun').innerHTML=R.guns.map((g,i)=>g?`<span class="${i===R.active?'on':''}">${GUNS[g].name}</span>`:'').filter(Boolean).join(' / ')||'No weapon';
  $('#hudFloor').textContent=R.mode==='arena'?'Arena':R.mode==='tutorial'?'Tutorial':`Floor ${R.map.floor}${R.mode==='scav'?' Scav':''}`;
  $('#hudCoin').textContent=R.bag.coin+'c';
  if(R.mode==='arena'||R.mode==='tutorial'||S.settings.noTimer)$('#hudTime').textContent='∞';
  else{const s=Math.max(0,Math.ceil(R.time));$('#hudTime').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;$('#hudTime').style.color=s<60?'var(--rose)':''}
  const nb=Object.values(R.buffs).reduce((a,b)=>a+b,0),nc=R.curses.size;
  $('#hudBag').innerHTML=`<span>Cages ${R.mode==='arena'?'∞':R.cages.basic+R.cages.gilded}</span><span>${nb?nb+' buff'+(nb>1?'s':''):'No buffs'}${nc?` · <b style="color:var(--rose)">${nc} pact${nc>1?'s':''}</b>`:''}</span>`;
  let h=R.comps.map((m,i)=>{const k=i?'E':'Q';if(!m)return`<div class="pc"><span class="key">${k}</span><span class="nm" style="color:var(--muted)">Empty</span><span></span></div>`;
    const max=m.abilMax||1;
    return`<button class="pc ${m.downed?'down':''}" data-t="${i?'e':'q'}" aria-label="Use ${esc(m.c.name)}'s ability"><span class="key">${k}</span><span class="nm">${esc(m.c.name)} <small>Lv${m.c.level}</small></span><span class="cd">${m.downed?'DOWN':m.abil>0?Math.ceil(m.abil)+'s':ABILITIES[m.st.abilId].name}</span><div class="mini-bar"><i style="width:${m.hp/m.maxHp*100}%"></i></div><div class="cdb"><i style="width:${m.abil>0?(1-m.abil/max)*100:100}%"></i></div></button>`}).join('');
  if(R.comps[0]&&R.comps[1]){const cb=comboFor(R.comps[0].c.type,R.comps[1].c.type),rdy=comboReady();h+=`<button class="pc pcombo ${rdy?'ready':''}" data-t="combo" aria-label="Use combo ${cb.name}"><span class="key">C</span><span class="nm">${cb.name}</span><span class="cd">${rdy?'ready':Math.ceil(R.combo.cd)+'s'}</span><div class="cdb"><i style="width:${(1-R.combo.cd/R.combo.max)*100}%;background:var(--gold)"></i></div></button>`}
  if(R.slot3){const c=R.slot3.c,caged=c.captureRaid===R.id;h+=`<div class="pc s3 ${caged?'caged':''}"><span class="key">3</span><span class="nm">${esc(c.name)} · ${caged?'caught':'support'}</span><span class="sw"><button data-t="s1" aria-label="Swap with slot 1">⇄1</button><button data-t="s2" aria-label="Swap with slot 2">⇄2</button></span></div>`}
  else h+=`<div class="pc s3"><span class="key">3</span><span class="nm" style="color:var(--muted)">Free for a catch</span><span></span></div>`;
  $('#hudParty').innerHTML=h;
  if(TOUCH){$('#tCage').hidden=!cageReady();$('#tGun').hidden=!(R.guns[0]&&R.guns[1]);$('#tCombo').hidden=!comboReady()}
  const bb=R.boss&&R.boss.hp>0;$('#bossBar').hidden=!bb;if(bb)$('#bossHp').style.width=clamp(R.boss.hp/R.boss.maxHp,0,1)*100+'%';
  $('.ccol').classList.toggle('low',!!bb);
  const rm=R.cur&&R.cur.mod&&R.cur.visited?ROOM_MODS[R.cur.mod]:null;const rmEl=$('#roomMod');if(rm){rmEl.hidden=false;rmEl.textContent=rm.name;rmEl.style.color=rm.col}else rmEl.hidden=true;
  const mEl=$('#hudMsg');if(R.msgT>0){mEl.hidden=false;mEl.textContent=R.msg}else mEl.hidden=true;
  const pr=$('#hudPrompt');if(R.prompt){pr.hidden=false;pr.textContent=R.prompt;pr.classList.toggle('tap',!!(R.canUse&&TOUCH))}else pr.hidden=true;
  drawMini();
}
let hudT=0;
function loop(ts){
  if(!R||R.over)return;
  const dt=Math.min(.04,(ts-(R.last||ts))/1000);R.last=ts;
  if(!R.paused)update(dt);
  if(!R||R.over)return;
  draw();hudT+=dt;if(hudT>.1){hudT=0;updHud()}
  raf=requestAnimationFrame(loop);
}
function showOverlay(html){R.paused=true;R.firing=false;keys.clear();touch.move=touch.aim=null;$('#pause').hidden=false;$('#pauseBox').innerHTML=html}
function setPause(on){
  if(!R)return;R.paused=on;$('#pause').hidden=!on;if(!on){R.last=0;return}
  const safe=R.mode==='arena'||R.mode==='tutorial';
  const bl=Object.entries(R.buffs).map(([k,n])=>`<li><b>${BUFFS[k].name}${n>1?' ×'+n:''}</b> · ${BUFFS[k].desc}</li>`).join('')+[...R.curses].map(k=>`<li style="color:var(--rose)"><b>${CURSES[k].name}</b> · ${CURSES[k].desc}</li>`).join('');
  showOverlay(`<h2>Paused</h2>
    <p class="hint">${safe?'Leaving restores your creatures. Nothing is lost.':'Abandoning counts as death: everything you brought is lost.'}</p>
    <button class="btn primary" data-p="resume">Resume</button>
    ${safe?`<button class="btn" data-p="leave">${R.mode==='tutorial'?'Leave the tutorial':'Leave the arena'}</button>`:`<button class="btn danger" data-p="abandon">${R.abandonArm?'Confirm: abandon and lose loadout':'Abandon raid'}</button>`}
    ${safe?'':`<p class="status">Backpack: ${R.bag.coin} coin · ${R.bag.ore} ore · ${R.bag.food} food · ${R.cages.basic+R.cages.gilded} cages · Keeper XP so far ${R.kxp}</p>`}
    ${bl?`<h3>Buffs and pacts</h3><ul class="plain">${bl}</ul>`:''}
    <p class="status">${TOUCH?'Change stick and button layout in the Settings tab.':'WASD move · Mouse aim and attack · Space roll · Q/E abilities · C combo · 1/2 swap slot 3 · R switch weapon · F cage · G use'}</p>`);
}
$('#pauseBox').addEventListener('click',e=>{
  const b=e.target.closest('[data-p]');if(!b||!R||b.disabled)return;const k=b.dataset.p;sfx('ui');
  if(k==='resume'){R.abandonArm=false;setPause(false)}
  if(k==='leave'){$('#pause').hidden=true;endRaid(R.mode==='arena'?'arena':'quit')}
  if(k==='abandon'){if(!R.abandonArm){R.abandonArm=true;setPause(true);return}$('#pause').hidden=true;endRaid('dead')}
  if(k==='buy')buy(+b.dataset.i);
  if(k==='bless'){const r=R.shrineRoom;if(r&&!r.used){r.used=true;applyBuff(b.dataset.k,true);setPause(false);msg(`${BUFFS[b.dataset.k].name}: ${BUFFS[b.dataset.k].desc}.`)}}
  if(k==='curse'){const r=R.shrineRoom;if(r&&!r.used){r.used=true;setPause(false);applyCurse(b.dataset.k)}}
});
$('#btnPause').addEventListener('click',()=>{if(R)setPause(!R.paused)});

/* ---------- input ---------- */
window.addEventListener('keydown',e=>{
  if(!R||R.over)return;
  if(e.target&&(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'))return;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='Escape'){setPause(!R.paused);return}
  if(R.paused||e.repeat)return;
  keys.add(e.code);
  const c=e.code;
  if(c==='Space')doRoll();if(c==='KeyQ')useAbility(0);if(c==='KeyE')useAbility(1);if(c==='KeyF')useCage();if(c==='KeyC')useCombo();
  if(c==='Digit1')swapSlot3(0);if(c==='Digit2'||c==='KeyX')swapSlot3(1);if(c==='KeyR')switchGun();if(c==='KeyG')interact();
});
window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>{keys.clear();if(R)R.firing=false});
function bindCanvas(){
  cv.addEventListener('mousemove',e=>{if(R)R.mouse={x:e.clientX,y:e.clientY}});
  cv.addEventListener('mousedown',e=>{if(!R||R.paused)return;R.mouse={x:e.clientX,y:e.clientY};if(e.button===2){doRoll();return}if(e.button===0)R.firing=true});
  window.addEventListener('mouseup',e=>{if(R&&e.button===0&&!touch.aim)R.firing=false});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('touchstart',e=>{e.preventDefault();if(!R||R.paused)return;R.mouse=null;
    const fixed=S.opts.stick==='fixed',bases=stickBases(),left=S.opts.hand==='left';
    for(const t of e.changedTouches){
      const onLeft=t.clientX<innerWidth/2,kind=(onLeft!==left)?'move':'aim';
      if(touch[kind])continue;
      const base=fixed?bases[kind]:{x:t.clientX,y:t.clientY};
      touch[kind]={id:t.identifier,ox:base.x,oy:base.y,x:t.clientX,y:t.clientY};
    }},{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){[touch.move,touch.aim].forEach(o=>{if(o&&o.id===t.identifier){o.x=t.clientX;o.y=t.clientY}})}},{passive:false});
  const end=e=>{for(const t of e.changedTouches){if(touch.move&&touch.move.id===t.identifier)touch.move=null;if(touch.aim&&touch.aim.id===t.identifier){touch.aim=null;if(R)R.firing=false}}};
  cv.addEventListener('touchend',end);cv.addEventListener('touchcancel',end);
  $('#raid').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-t]');if(!b||!R)return;e.preventDefault();e.stopPropagation();const k=b.dataset.t;
    if(k==='pause'){setPause(!R.paused);return}if(R.paused)return;
    if(k==='roll')doRoll();if(k==='q')useAbility(0);if(k==='e')useAbility(1);if(k==='cage')useCage();if(k==='s1')swapSlot3(0);if(k==='s2')swapSlot3(1);if(k==='gun')switchGun();if(k==='use')interact();if(k==='combo')useCombo()});
}
window.addEventListener('resize',()=>{if(cv)resize()});

/* ================= Boot ================= */
function start(data){
  cv=$('#cv');ctx=cv.getContext('2d');mini=$('#mini');mctx=mini.getContext('2d');bindCanvas();
  S=(data&&data.S&&data.S.v===5)?data.S:load();
  let fresh=false;if(!S){newGame();fresh=true}
  save();renderAll();
  if(fresh||!S.introSeen){S.introSeen=true;save();openIntro(true)}
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){try{window.claude.hot.snapshot(()=>({S}))}catch(e){}}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});

</script>
