# Build the game and publish dist/ to GitHub Pages on every push to main:
# the full game at /GeneSling/, the demo at /GeneSling/demo/ and GeneSlingVR at /GeneSling/vr/.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run build
      # GeneSlingVR has its own build in vr/; its page goes to dist/vr/.
      - run: npm ci && npm run build
        working-directory: vr
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: mkdir -p dist/vr && cp vr/dist/index.html dist/vr/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
